<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C19 하루 시간표 랜딩 PC</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/hl.css">
<style>
  /* 3. 하루 시간표 PC: 첫 화면이 아침부터 밤까지 일곱 장면의 세로 띠. 무료 편 띠만 넓고 맛보기가 있음 */
  body { width: 1280px; margin: 0 auto; background: var(--paper); }
  .head { height: 200px; padding: 40px 56px 0; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 40px; box-sizing: border-box; }
  .logo { font-size: 40px; color: var(--brown); margin: 0; }
  h1 { font-size: 42px; margin: 6px 0 0; }
  .sub { font-size: 16px; color: var(--ink-2); margin: 0 0 6px; text-align: right; }
  .strips { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 2.4fr 1fr 1fr; height: 600px; }
  .s { position: relative; overflow: hidden; }
  .s > img { width: 100%; height: 100%; object-fit: cover; object-position: center 35%; }
  .s .lab { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 12px 16px; color: #fff; background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(30,30,40,.55)); }
  .s .lab span { display: block; font-size: 12px; }
  .s .lab b { font-family: var(--font-title); font-weight: 700; font-size: 18px; letter-spacing: -0.03em; }
  .free .card { position: absolute; left: 24px; right: 24px; bottom: 24px; background: var(--paper); border-radius: 16px; padding: 18px 20px; }
  .free .card span { font-size: 13px; color: var(--ink-2); }
  .free .card b.t { display: block; font-size: 26px; margin: 2px 0 10px; }
</style>
</head>
<body>
  <header class="head">
    <div><p class="t logo">릴리랑</p><h1 class="t">아이가 이야기에 끼어드는 2분 영어 그림책</h1></div>
    <p class="sub">4~7세, 아침부터 밤까지<br>하루 습관마다 한 편</p>
  </header>
  <main class="strips">
    <div class="s"><img src="../assets/hl/cover-ep02.webp" alt=""><div class="lab"><span>일어나기</span><b>Wake Up!</b></div></div>
    <div class="s"><img src="../assets/hl/cover-ep03.webp" alt=""><div class="lab"><span>세수하기</span><b>Splash!</b></div></div>
    <div class="s"><img src="../assets/hl/cover-ep04.webp" alt=""><div class="lab"><span>아침 먹기</span><b>Yummy!</b></div></div>
    <div class="s"><img src="../assets/hl/cover-ep05.webp" alt=""><div class="lab"><span>옷 입기</span><b>Put On!</b></div></div>
    <div class="s free"><img src="../assets/hl/cover-ep01.webp" alt="EP01 이 닦기 첫 장면">
      <div class="card"><span>이 닦기, 지금 무료</span><b class="t">Brush, Brush, Brush!</b>
        <a class="play"><img src="../assets/hl/btn-play.webp" alt=""><b>맛보기 바로 듣기<small>2분 19초, 로그인 없이</small></b></a></div></div>
    <div class="s"><img src="../assets/hl/cover-ep06.webp" alt=""><div class="lab"><span>목욕하기</span><b>Bath Time!</b></div></div>
    <div class="s"><img src="../assets/hl/cover-ep07.webp" alt=""><div class="lab"><span>잠자기</span><b>Sweet Dreams</b></div></div>
  </main>
</body>
</html>
