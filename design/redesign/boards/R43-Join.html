<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390">
  <title>R43 개선안 Join</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    html, body { margin: 0; width: 390px; min-height: 844px; background: var(--paper); }

    /* Header nav */
    .join-nav {
      padding: 14px 24px;
      border-bottom: 1px solid var(--line);
    }
    .join-nav img { height: 30px; width: auto; display: block; }

    /* Body */
    .join-body {
      padding: 30px 24px 36px;
    }

    .join-heading {
      font-family: var(--font-kr);
      font-size: 26px;
      font-weight: 700;
      color: var(--ink);
      margin: 0 0 6px;
    }
    .join-sub {
      font-family: var(--font-kr);
      font-size: 14px;
      color: var(--ink-2);
      line-height: 1.6;
      margin: 0 0 26px;
    }

    /* Reassurance block: the visual anchor */
    .reassurance {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--teal-soft);
      border-left: 3px solid var(--teal);
      border-radius: 0 var(--r-frame) var(--r-frame) 0;
      padding: 15px 16px 15px 14px;
      margin-bottom: 30px;
    }
    .reassurance-icon { flex-shrink: 0; margin-top: 1px; }
    .reassurance-main {
      font-family: var(--font-kr);
      font-size: 14px;
      font-weight: 700;
      color: var(--teal);
      margin: 0 0 3px;
    }
    .reassurance-sub {
      font-family: var(--font-kr);
      font-size: 12px;
      color: var(--ink-2);
      margin: 0;
      line-height: 1.5;
    }

    /* Kakao button */
    .kakao-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 56px;
      background: #FEE500;
      border: none;
      border-radius: var(--r-btn);
      font-family: var(--font-kr);
      font-size: 16px;
      font-weight: 700;
      color: #3C1E1E;
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
    }
    .kakao-bubble {
      width: 22px;
      height: 20px;
      background: #3C1E1E;
      border-radius: 10px 10px 10px 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .divider-text {
      font-family: var(--font-kr);
      font-size: 12px;
      color: var(--ink-2);
    }

    /* Email link */
    .email-link {
      display: block;
      text-align: center;
      font-family: var(--font-kr);
      font-size: 14px;
      color: var(--teal);
      text-decoration: none;
      padding: 14px;
      border: 1.5px solid var(--line);
      border-radius: var(--r-btn);
    }

    /* Consent */
    .consent-sec {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }
    .consent-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }
    .consent-item:last-child { margin-bottom: 0; }
    .consent-box {
      width: 20px;
      height: 20px;
      min-width: 20px;
      border: 1.5px solid var(--line);
      border-radius: 4px;
      background: var(--paper);
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .consent-box.checked {
      background: var(--teal);
      border-color: var(--teal);
    }
    .consent-label {
      font-family: var(--font-kr);
      font-size: 13px;
      color: var(--ink);
      margin: 0 0 3px;
    }
    .consent-label strong { color: var(--teal); }
    .consent-desc {
      font-family: var(--font-kr);
      font-size: 11px;
      color: var(--ink-2);
      margin: 0;
      line-height: 1.5;
    }
    .consent-desc a {
      color: var(--teal);
      text-decoration: underline;
    }

    .age-notice {
      font-family: var(--font-kr);
      font-size: 11px;
      color: var(--ink-2);
      text-align: center;
      margin-top: 18px;
      line-height: 1.5;
    }

    /* Footer links at the bottom */
    .join-footer {
      padding: 20px 24px 28px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 28px;
    }
    .join-footer a {
      font-family: var(--font-kr);
      font-size: 11px;
      color: var(--ink-2);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <nav class="join-nav" aria-label="릴리랑">
    <img src="../assets/brand-logo-h.svg" alt="릴리랑">
  </nav>

  <div class="join-body">
    <h1 class="join-heading">릴리랑 시작하기</h1>
    <p class="join-sub">아이와 함께 듣는 2분 영어 이야기</p>

    <!-- Reassurance block -->
    <div class="reassurance" role="note" aria-label="아이 정보 안내">
      <svg class="reassurance-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M10 2.5C10 2.5 4.5 5 4.5 10.5c0 3.59 2.91 6.5 5.5 6.5s5.5-2.91 5.5-6.5C15.5 5 10 2.5 10 2.5z" fill="none" stroke="var(--teal)" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M7.5 10.5l2 2L13 9" stroke="var(--teal)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <p class="reassurance-main">아이 정보는 받지 않아요. 부모님 계정만요.</p>
        <p class="reassurance-sub">이름, 사진, 학교를 입력하지 않아도 됩니다.</p>
      </div>
    </div>

    <!-- Kakao -->
    <a class="kakao-btn" href="R44-Me.html" role="button">
      <div class="kakao-bubble" aria-hidden="true">
        <svg width="11" height="10" viewBox="0 0 11 10" fill="none">
          <path d="M5.5 0C2.46 0 0 1.87 0 4.17c0 1.48.98 2.77 2.45 3.52L1.96 10l2.65-1.76c.28.04.58.06.89.06C8.54 8.3 11 6.43 11 4.13 11 1.87 8.54 0 5.5 0z" fill="#FEE500"/>
        </svg>
      </div>
      카카오로 시작하기
    </a>

    <!-- Divider -->
    <div class="divider" aria-hidden="true">
      <div class="divider-line"></div>
      <span class="divider-text">또는</span>
      <div class="divider-line"></div>
    </div>

    <!-- Email -->
    <a class="email-link" href="#">이메일로 시작하기</a>

    <!-- Consent -->
    <div class="consent-sec">
      <div class="consent-item">
        <div class="consent-box checked" role="checkbox" aria-checked="true" aria-label="개인정보 수집 동의 필수">
          <svg width="12" height="9" viewBox="0 0 12 9" fill="none" aria-hidden="true">
            <path d="M1 4l3.5 3.5L11 1" stroke="white" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <p class="consent-label"><strong>[필수]</strong> 개인정보 수집과 이용에 동의해요</p>
          <p class="consent-desc">보호자 이메일 또는 카카오 정보, 닉네임만 받아요. <a href="#">자세히 보기</a></p>
        </div>
      </div>
      <div class="consent-item">
        <div class="consent-box" role="checkbox" aria-checked="false" aria-label="새 편 소식 선택 동의"></div>
        <div>
          <p class="consent-label">[선택] 새 편 소식을 받을게요</p>
          <p class="consent-desc">동의하지 않아도 가입할 수 있어요. <a href="#">자세히 보기</a></p>
        </div>
      </div>
    </div>

    <p class="age-notice">만 14세 이상 보호자만 가입할 수 있어요</p>

    <footer class="join-footer">
      <a href="#">개인정보처리방침</a>
      <a href="#">문의</a>
    </footer>
  </div>
</body>
</html>
