<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390">
  <title>R55 개선안 2 EpisodeNight</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    html, body { margin: 0; width: 390px; height: 844px; overflow: hidden; background: var(--night); }

    /* 무대 (밤 토큰) */
    .stage {
      position: relative; width: 390px; height: 636px;
      overflow: hidden; background: var(--night);
    }
    .stage-art { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* 진행 점 (밤 버전) */
    .progress-dots {
      position: absolute; top: 14px; right: 16px; z-index: 5;
      display: flex; gap: 5px; align-items: center;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--night-ink-2); opacity: 0.5; }
    .dot.on { background: var(--night-ink); width: 14px; border-radius: 3px; opacity: 1; }

    /* 브랜드 엠블럼 */
    .brand {
      position: absolute; top: 10px; left: 16px; z-index: 5;
      width: 32px; height: 32px; border-radius: 50%;
      object-fit: cover; border: 1.5px solid rgba(243,234,216,0.35);
      opacity: 0.85;
    }

    /* 종이 띠 라벨 (밤 버전: 어두운 종이) */
    .title-label {
      position: absolute; top: 16px; left: 56px; z-index: 5;
      background: var(--night-2);
      border: 1px solid var(--night-ink-2);
      padding: 5px 13px 6px;
      transform: rotate(-1.5deg);
      box-shadow: 1px 2px 8px rgba(0,0,0,0.3);
      clip-path: polygon(1% 10%, 0% 0%, 98% 2%, 100% 0%, 99% 90%, 100% 100%, 3% 98%, 0% 100%);
    }
    .title-label .ep-num {
      font-family: var(--font-en); font-size: 10px; color: var(--night-ink-2);
      display: block; margin-bottom: 1px;
    }
    .title-label .ep-title {
      font-family: var(--font-logo); font-size: 14px; color: var(--night-ink);
      display: block;
    }

    /* 램프 터치 타겟 */
    .touch-wrap {
      position: absolute;
      left: 130px; bottom: 90px;
      width: 96px; height: 96px;
      display: flex; align-items: center; justify-content: center;
      z-index: 5;
    }

    /* 숨쉬는 빛 (밤 lamp 색) */
    .glow {
      position: absolute; inset: -20px;
      background: var(--lamp);
      border-radius: 50%;
      opacity: 0;
      animation: breathe 2.4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.0; transform: scale(0.85); }
      50% { opacity: 0.28; transform: scale(1.1); }
    }

    /* 타이머 고리 (밤 버전: lamp 색) */
    .ring-svg {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3; width: 136px; height: 136px;
    }
    .ring-track { fill: none; stroke: var(--night-2); stroke-width: 3; }
    .ring-count {
      fill: none; stroke: var(--lamp); stroke-width: 3.5;
      stroke-linecap: round;
      stroke-dasharray: 377; stroke-dashoffset: 0;
      transform-origin: center; transform: rotate(-90deg);
      animation: countdown 8s linear forwards;
    }
    @keyframes countdown {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 377; }
    }
    .touch-img {
      position: relative; z-index: 4;
      width: 88px; height: 88px; object-fit: contain;
    }
    .hand-hint {
      position: absolute; bottom: -10px; right: -16px;
      width: 44px; height: 44px; object-fit: contain; z-index: 5;
      opacity: 0.85;
    }

    /* 찢은 종이 가장자리 (어두운 종이 색) */
    .torn-edge {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 4; line-height: 0;
    }

    /* 본문 줄 (어두운 종이 = night-2) */
    .text-strip {
      height: 152px; background: var(--night-2);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 20px 32px 10px; gap: 6px;
    }
    .body-kr {
      font-family: var(--font-book); font-size: 20px;
      color: var(--night-ink); margin: 0; text-align: center; line-height: 1.6;
    }
    .body-en {
      font-family: var(--font-en); font-size: 17px;
      color: var(--night-ink-2); margin: 0; text-align: center;
    }

    /* 서랍 손잡이 (밤) */
    .bottom-zone {
      height: 56px; background: var(--night);
      border-top: 1px solid var(--night-2);
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .pull-bar { width: 32px; height: 3px; background: var(--night-2); border-radius: 2px; }
    .pull-label { font-family: var(--font-kr); font-size: 13px; color: var(--lamp); }
    .pull-chevron {
      width: 8px; height: 8px;
      border-left: 1.5px solid var(--lamp); border-top: 1.5px solid var(--lamp);
      transform: rotate(45deg); margin-top: 3px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <img class="stage-art" src="../assets/ep07-bg-1-find.webp" alt="잠자리 밤 장면">

    <img class="brand" src="../assets/brand-emblem.png" alt="릴리랑">
    <div class="progress-dots">
      <span class="dot"></span>
      <span class="dot on"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <!-- 제목 라벨 (어두운 종이) -->
    <div class="title-label">
      <span class="ep-num">EP07</span>
      <span class="ep-title">Sweet Dreams</span>
    </div>

    <!-- 램프 터치 타겟 -->
    <div class="touch-wrap">
      <div class="glow"></div>
      <svg class="ring-svg" viewBox="0 0 136 136">
        <circle class="ring-track" cx="68" cy="68" r="60"/>
        <circle class="ring-count" cx="68" cy="68" r="60"/>
      </svg>
      <img class="touch-img" src="../assets/ep01-L-lamp-on.png" alt="램프">
      <img class="hand-hint" src="../assets/engine-ui-hand-tap.webp" alt="">
    </div>

    <!-- 찢은 가장자리 (밤: night-2, 불규칙 베지어) -->
    <div class="torn-edge">
      <svg width="390" height="40" viewBox="0 0 390 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" style="display:block">
        <rect x="0" y="0" width="390" height="6" fill="rgba(36,50,61,0.05)"/>
        <path d="M0,40 L0,30 C4,33 9,25 17,28 C25,31 29,22 38,19 C45,16 52,25 61,29 C69,33 75,23 84,20 C91,17 98,22 107,26 C115,30 121,34 130,29 C137,24 143,17 152,21 C161,25 167,32 175,29 C182,26 188,19 197,15 C205,11 212,22 221,27 C229,32 236,35 244,30 C252,25 258,17 267,21 C275,25 281,31 289,28 C297,25 303,19 311,23 C319,27 325,33 333,27 C340,21 347,16 356,20 C363,24 370,31 378,27 C383,24 387,21 390,23 L390,40 Z" style="fill:var(--night-2)"/>
        <path d="M0,31 C4,34 9,26 17,29 C25,32 29,23 38,20 C45,17 52,26 61,30 C69,34 75,24 84,21 C91,18 98,23 107,27 C115,31 121,35 130,30 C137,25 143,18 152,22 C161,26 167,33 175,30 C182,27 188,20 197,16 C205,12 212,23 221,28 C229,33 236,36 244,31 C252,26 258,18 267,22 C275,26 281,32 289,29 C297,26 303,20 311,24 C319,28 325,34 333,28 C340,22 347,17 356,21 C363,25 370,32 378,28 C383,25 387,22 390,24" stroke="var(--card)" stroke-width="1.2" fill="none" stroke-opacity="0.4"/>
      </svg>
    </div>
  </div>

  <!-- 본문 줄 (어두운 종이) -->
  <div class="text-strip">
    <p class="body-kr">램프가 어디 있지?</p>
    <p class="body-en">Where is the lamp?</p>
  </div>

  <!-- 서랍 손잡이 (밤) -->
  <div class="bottom-zone">
    <div class="pull-bar"></div>
    <span class="pull-label">부모 화면 열기</span>
    <div class="pull-chevron"></div>
  </div>
</body>
</html>
