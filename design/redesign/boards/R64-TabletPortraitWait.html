<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=834">
  <title>R64 TabletPortraitWait – 834×1194</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Gowun+Batang&family=Gowun+Dodum&family=Jua&display=swap">
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    html, body {
      margin: 0; width: 834px; height: 1194px; overflow: hidden;
      background: var(--paper);
    }

    /* ─── kid container: (1194-224)×0.7 = 679px ─── */
    .kid {
      max-width: 679px; margin: 0 auto; height: 1194px;
      display: flex; flex-direction: column;
      background: var(--paper);
    }

    /* ─── stage ─── */
    .stage {
      position: relative; overflow: hidden;
      flex: 100 1 0;
      background: var(--sky);
    }
    .stage > svg {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    }
    .stage::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 40px; pointer-events: none;
      background: var(--paper);
      -webkit-mask: url(../assets/torn.svg) 0 0 / 100% 100% no-repeat;
      mask: url(../assets/torn.svg) 0 0 / 100% 100% no-repeat;
    }

    /* SVG scene element classes */
    .tgt .halo { fill: var(--touch); opacity: .3; animation: halo 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .tgt .pulse { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes halo  { 50% { opacity: .08; transform: scale(1.18); } }
    @keyframes pulse { 50% { transform: scale(1.06); } }
    .stage svg { stroke-linecap: round; stroke-linejoin: round; }
    .fS { fill: var(--paper); } .fA { fill: var(--teal); } .fU { fill: var(--ink-2); }
    .fN { fill: none; } .fT { fill: var(--touch); } .fI { fill: #191f28; }
    .sO { stroke: var(--teal-soft); } .sU { stroke: var(--ink-2); }
    .sE { stroke: var(--touch-edge); }
    .hit { fill: transparent; }

    /* ─── stage overlays ─── */
    .logo {
      position: absolute; z-index: 5; top: 2px; left: 8px;
      width: 48px; height: 48px; display: grid; place-items: center;
    }
    .logo img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 1.5px var(--paper); }

    .dots {
      position: absolute; z-index: 5; top: 14px; right: 16px;
      display: flex; align-items: center; gap: 5px; height: 20px;
    }
    .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--line); }
    .dots i.past { background: var(--brown); opacity: .4; }
    .dots i.now  { width: 14px; background: var(--brown); }

    /* ring (countdown ring around brush target) */
    /*
      Stage: 679×970px  SVG sc1: 482×731 xMidYMax slice
      Scale = max(679/482, 970/731) = 1.409  (width-driven)
      Content h = 731×1.409 = 1030px  →  YMax: top clipped by 1030-970 = 60px
      Brush halo cx=322, cy=306 → screen (322×1.409, 306×1.409-70) = (454, 361)
      Ring r≈85px screen  →  div 170px, left=369, top=276
    */
    .ring {
      position: absolute; z-index: 6; pointer-events: none;
      width: 170px; height: 170px;
      left: 369px; top: 276px;
    }
    .ring svg { display: block; width: 100%; height: 100%; }
    .ring circle { fill: none; stroke-width: 3.5; }
    .ring .trk { stroke: var(--line); opacity: .7; }
    .ring .cnt {
      stroke: var(--touch); stroke-linecap: round;
      stroke-dasharray: 534; stroke-dashoffset: 267;   /* 534=2π×85, half shown */
      transform: rotate(-90deg); transform-origin: center;
    }

    /* hand hint */
    .hand-hint {
      position: absolute; z-index: 7; pointer-events: none;
      width: 52px; height: auto;
      left: 460px; top: 414px;
      transform: scaleX(-1);
      opacity: .9;
    }

    /* ─── cap ─── */
    .cap {
      position: relative; flex: 1 0 168px; padding: 20px 40px 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--paper);
    }
    .cap p { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
    .cap .kr { font-family: var(--font-book); font-size: 22px; line-height: 1.8; color: var(--ink); }  /* CHANGED */
    .cap .en { font-family: var(--font-en); font-size: 18px; line-height: 1.5; color: var(--ink-2); } /* CHANGED */

    /* ─── hintrow ─── */
    .hintrow {
      position: relative; flex: none; width: 100%; height: 56px;
      display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0;
      border: 0; border-top: 1.5px solid var(--line); background: var(--paper-2);
      color: var(--teal); font-size: 16px; font-family: var(--font-kr); cursor: pointer; /* CHANGED 15→16 */
    }
    .hintrow::after {
      content: ""; position: absolute; top: 0; right: 0;
      border-style: solid; border-width: 0 20px 20px 0;
      border-color: transparent var(--paper) transparent transparent;
    }
    .hintrow .bar { width: 32px; height: 3px; border-radius: 2px; background: var(--line); }
    .hintrow .chev {
      width: 8px; height: 8px; margin-top: 4px;
      border-left: 1.5px solid currentColor; border-top: 1.5px solid currentColor;
      transform: rotate(45deg);
    }
  </style>
</head>
<body>
<div class="kid waiting">

  <!-- stage -->
  <div class="stage">
    <!-- scene 1: 칫솔 찾기 (xMidYMax slice – bottom-aligned, top clipped) -->
    <svg viewBox="0 0 482 731" preserveAspectRatio="xMidYMax slice">
      <image href="../assets/ep01-bg-1-find.webp" width="482" height="731"/>
      <!-- t-brush target: halo at (322,306), brush item overlaid, hit area -->
      <g class="tgt" id="t-brush">
        <circle class="halo" cx="322" cy="306" r="58"/>
        <g class="pulse">
          <g transform="translate(196 424) rotate(12) scale(.62)">
            <image href="../assets/ep01-L-brush.png" x="-15" y="-280" width="246" height="292"/>
          </g>
        </g>
        <circle class="hit" cx="282" cy="342" r="88"/>
      </g>
    </svg>

    <!-- ring around brush target (positioned in screen coords, see CSS comment) -->
    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 170 170">
        <circle class="trk" cx="85" cy="85" r="78"/>
        <circle class="cnt" cx="85" cy="85" r="78"/>
      </svg>
    </div>

    <!-- hand hint pointing to brush -->
    <img class="hand-hint" src="../assets/engine-ui-hand-tap.webp" alt="" aria-hidden="true">

    <!-- logo -->
    <div class="logo">
      <img src="../assets/brand-emblem.png" alt="릴리랑" onerror="this.style.background='var(--teal)';this.removeAttribute('src')">
    </div>

    <!-- progress dots (sc1 = now, sc0 past) -->
    <div class="dots" aria-hidden="true">
      <i class="past"></i>
      <i class="now"></i>
      <i></i><i></i><i></i><i></i><i></i>
    </div>
  </div><!-- /stage -->

  <!-- body text -->
  <div class="cap">
    <p>
      <span class="kr">칫솔이 어디 있지?</span>
      <span class="en">Where is the toothbrush?</span>
    </p>
  </div>

  <!-- parent handle -->
  <button class="hintrow" aria-label="부모 화면 열기">
    <span class="bar"></span>
    부모 화면 열기
    <span class="chev"></span>
  </button>

</div>
</body>
</html>
