<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390">
  <title>R23 개선안 EpisodeTurn</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    html, body { margin: 0; width: 390px; height: 844px; overflow: hidden; background: var(--paper); }

    /* 헤더 */
    .hdr {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 16px; height: 52px;
      background: var(--paper); border-bottom: 1px solid var(--line);
    }
    .hdr .emblem {
      width: 34px; height: 34px; border-radius: 50%;
      object-fit: cover; border: 1.5px solid var(--line); flex-shrink: 0;
    }
    .ep-info { flex: 1; }
    .ep-num { font-size: 10px; color: var(--ink-2); font-family: var(--font-en); }
    .ep-title { font-size: 13px; font-weight: 700; color: var(--ink); font-family: var(--font-en); }
    .dots { display: flex; gap: 5px; align-items: center; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
    .dot.on { background: var(--teal); width: 14px; border-radius: 3px; }

    /* 무대: R22와 같은 높이 */
    .stage {
      position: relative; width: 390px; height: 600px;
      overflow: hidden; background: var(--sky);
    }
    .stage-art {
      width: 100%; height: 100%;
      object-fit: cover; object-position: top center; display: block;
    }

    /* 스티커 책 쪽: 민트 빈 공간 위에 올림 */
    .sticker-overlay {
      position: absolute; bottom: 16px; left: 0; right: 0;
      padding: 0 20px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .sticker-heading {
      font-family: var(--font-kr); font-size: 12px;
      color: var(--ink-2); margin: 0;
    }
    .sticker-row { display: flex; gap: 12px; justify-content: center; }
    .sticker-col { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .sticker-slot {
      width: 80px; height: 80px;
      background: var(--paper);
      border: 2px solid var(--line);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 10px rgba(107,74,54,0.18);
      overflow: hidden;
    }
    .sticker-slot.filled { border-color: var(--touch-edge); }
    .sticker-slot img { width: 70px; height: 70px; object-fit: contain; }
    .sticker-word {
      font-family: var(--font-en); font-size: 12px; color: var(--ink);
    }

    /* 본문 줄: R22처럼 대사 */
    .text-strip {
      height: 92px; background: var(--paper);
      border-top: 2px solid var(--line);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 0 28px; gap: 4px;
    }
    .body-en {
      font-family: var(--font-en); font-size: 18px;
      font-weight: 700; color: var(--ink); margin: 0; text-align: center;
    }
    .body-kr {
      font-family: var(--font-kr); font-size: 15px;
      color: var(--ink-2); margin: 0; text-align: center;
    }

    /* 말했어요 단추: 좌우 16px, 아래 16px 여백, 둥근 단추 */
    .said-zone {
      padding: 12px 16px 16px;
      background: var(--paper);
      border-top: 1.5px solid var(--line);
    }
    .said-btn {
      width: 100%; height: 72px;
      background: var(--touch);
      border: 3px solid var(--touch-edge);
      border-radius: var(--r-btn);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 2px;
    }
    .said-kr {
      font-family: var(--font-kr); font-size: 21px;
      font-weight: 700; color: var(--touch-edge);
    }
    .said-en {
      font-family: var(--font-en); font-size: 12px;
      color: var(--touch-edge); opacity: 0.75;
    }
  </style>
</head>
<body>
  <header class="hdr">
    <img class="emblem" src="../assets/brand-emblem.png" alt="릴리랑">
    <div class="ep-info">
      <div class="ep-num">EP01</div>
      <div class="ep-title">Brush, Brush, Brush!</div>
    </div>
    <div class="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot on"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </header>

  <!-- 무대: 스티커 책 쪽을 빈 민트 영역 위에 겹침 -->
  <div class="stage">
    <img class="stage-art" src="../assets/ep01-bg-5-turn.webp" alt="친구 차례 장면">

    <div class="sticker-overlay">
      <p class="sticker-heading">오늘의 스티커</p>
      <div class="sticker-row">
        <div class="sticker-col">
          <div class="sticker-slot filled">
            <img src="../assets/ep01-L-sticker-brush.webp" alt="">
          </div>
          <span class="sticker-word">brush my teeth</span>
        </div>
        <div class="sticker-col">
          <div class="sticker-slot"></div>
          <span class="sticker-word">bubbles</span>
        </div>
        <div class="sticker-col">
          <div class="sticker-slot"></div>
          <span class="sticker-word">all clean</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 본문 줄: R22처럼 대사 -->
  <div class="text-strip">
    <p class="body-en">Brush my teeth!</p>
    <p class="body-kr">따라 말해 볼까?</p>
  </div>

  <!-- 말했어요 단추: 좌우 여백, 둥근 단추 -->
  <div class="said-zone">
    <div class="said-btn">
      <span class="said-kr">말했어요</span>
      <span class="said-en">I said it!</span>
    </div>
  </div>
</body>
</html>
