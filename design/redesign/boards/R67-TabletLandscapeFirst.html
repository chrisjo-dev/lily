<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1024">
  <title>R67 개선안 2 태블릿 EP01 첫 화면</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    html, body { margin: 0; width: 1024px; height: 768px; overflow: hidden; background: #c4b49a; }

    .book-wrap { position: relative; width: 1024px; height: 768px; }
    .paper-layer-a {
      position: absolute; bottom: 6px; left: 0; right: 0;
      height: 14px; background: #f0e8dc; border-radius: 0 0 5px 5px; z-index: 1;
    }
    .paper-layer-b {
      position: absolute; bottom: 0; left: 18px; right: 18px;
      height: 12px; background: #e4d9c6; border-radius: 0 0 5px 5px; z-index: 0;
    }

    .book {
      position: absolute; top: 0; left: 0;
      display: flex; width: 1024px; height: 748px; z-index: 2;
      box-shadow: 0 6px 28px rgba(50,28,8,0.26);
    }

    /* ── 왼쪽 쪽 ── */
    .page-left {
      width: 504px; height: 748px;
      position: relative; overflow: hidden; flex-shrink: 0;
      background: var(--sky);
      border-radius: 3px 0 0 3px;
    }
    .page-bg {
      position: absolute; inset: 0;
      background: url('../assets/ep01-bg-0-intro.webp') center top / cover no-repeat;
    }

    /* EP01 제목 라벨 */
    .title-label {
      position: absolute; top: 16px; left: 16px; z-index: 5;
      background: white;
      border: 1.5px solid var(--line);
      padding: 5px 13px 6px;
      transform: rotate(-1.5deg);
      box-shadow: 1px 2px 8px rgba(0,0,0,0.12);
      clip-path: polygon(1% 10%, 0% 0%, 98% 2%, 100% 0%, 99% 90%, 100% 100%, 3% 98%, 0% 100%);
    }
    .title-label .ep-num {
      font-family: var(--font-en); font-size: 10px; color: var(--ink-2);
      display: block; margin-bottom: 1px;
    }
    .title-label .ep-title {
      font-family: var(--font-logo); font-size: 14px; color: var(--ink);
      display: block;
    }

    /* 재생 단추 */
    .play-wrap {
      position: absolute; left: 50%; bottom: 90px;
      transform: translateX(-50%);
      z-index: 5;
    }
    .big-play {
      position: relative;
      width: 112px; height: 112px;
      border-radius: 50%; border: 0; background: none;
      cursor: pointer;
      isolation: isolate;
    }
    .big-play::before {
      content: "";
      position: absolute; z-index: -1;
      left: -19%; top: -31%; width: 138%; height: 131%;
      pointer-events: none;
      background: url('../assets/btn-play.webp') 0 0 / 100% 100% no-repeat;
    }

    /* 하단 찢은 종이 가장자리 */
    .left-torn {
      position: absolute; bottom: -1px; left: 0; right: 0;
      z-index: 4; pointer-events: none;
    }

    /* ── 책 등 ── */
    .spine {
      width: 10px; flex-shrink: 0;
      background: linear-gradient(to right,
        rgba(48,24,6,0.6) 0%,
        rgba(107,74,54,0.32) 40%,
        rgba(107,74,54,0.06) 100%);
    }

    /* ── 오른쪽 쪽 ── */
    .page-right {
      flex: 1; height: 748px;
      display: flex; flex-direction: column;
      position: relative; overflow: hidden;
      border-radius: 0 3px 3px 0;
    }
    .page-right-bg {
      position: absolute; inset: 0;
      background: var(--paper) url('../assets/ep01-paper.webp') center / cover;
      opacity: 0.5; z-index: 0;
    }
    .page-right-color {
      position: absolute; inset: 0;
      background: var(--paper); z-index: 0; opacity: 0.6;
    }
    .page-right > *:not(.page-right-bg):not(.page-right-color) {
      position: relative; z-index: 1;
    }
    .margin-line {
      position: absolute; left: 52px; top: 0; bottom: 0;
      width: 1px; background: rgba(107,74,54,0.07); z-index: 1; pointer-events: none;
    }

    /* 장면 진행 점 */
    .page-dots {
      padding: 22px 56px 14px;
      display: flex; gap: 8px; align-items: center; flex-shrink: 0;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
    .dot.active { width: 22px; border-radius: 3px; background: var(--teal); }

    /* 본문 */
    .book-text {
      flex: 1; padding: 28px 52px 28px 64px;
      display: flex; flex-direction: column;
      justify-content: center; gap: 0;
    }
    .story-kr {
      font-family: var(--font-book); font-size: 30px;
      line-height: 2; color: var(--ink);
      margin: 0 0 18px;
      border-bottom: 1.5px solid var(--line);
      padding-bottom: 22px;
    }
    .expression-block { border-top: 1.5px solid var(--line); padding-top: 24px; }
    .expression-label {
      font-family: var(--font-kr); font-size: 11px;
      color: var(--ink-2); letter-spacing: 0.06em; margin: 0 0 9px;
    }
    .expression-word {
      display: inline-block;
      font-family: var(--font-en); font-size: 42px; font-weight: 700;
      color: var(--ink);
      text-decoration: underline;
      text-decoration-color: var(--brown);
      text-underline-offset: 7px;
      text-decoration-thickness: 2.5px;
      letter-spacing: -0.01em;
    }

    /* 부모 조작 스트립 */
    .parent-strip {
      flex-shrink: 0; background: var(--paper-2);
      border-top: 1.5px solid var(--line);
      padding: 10px 24px 14px;
      display: flex; align-items: center; gap: 16px; min-height: 68px;
    }
    .play-btn {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--teal);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; box-shadow: 0 2px 8px rgba(47,125,109,0.28);
    }
    .play-btn svg { fill: white; display: block; margin-left: 3px; }
    .strip-sep { width: 1px; height: 32px; background: var(--line); flex-shrink: 0; }
    .strip-actions { display: flex; gap: 20px; align-items: center; }
    .action-item { display: flex; align-items: center; gap: 7px; }
    .action-item img { width: 32px; height: 32px; object-fit: contain; display: block; opacity: 0.72; }
    .action-label { font-family: var(--font-kr); font-size: 11px; color: var(--ink-2); white-space: nowrap; }
  </style>
</head>
<body>
<div class="book-wrap">
  <div class="paper-layer-a"></div>
  <div class="paper-layer-b"></div>

  <div class="book">
    <!-- 왼쪽 쪽 -->
    <div class="page-left">
      <div class="page-bg"></div>

      <!-- EP01 제목 라벨 -->
      <div class="title-label">
        <span class="ep-num">EP01</span>
        <span class="ep-title">Brush, Brush, Brush!</span>
      </div>

      <!-- 재생 단추 -->
      <div class="play-wrap">
        <button class="big-play" type="button" aria-label="이야기 시작"></button>
      </div>

      <!-- 하단 찢은 종이 -->
      <svg class="left-torn" xmlns="http://www.w3.org/2000/svg"
           preserveAspectRatio="none" viewBox="0 0 504 26" width="504" height="26">
        <path d="M0,14 Q14,4 28,13 Q42,22 56,9 Q70,0 84,11 Q98,20 112,8 Q126,1 140,12 Q154,22 168,10 Q182,2 196,13 Q210,22 224,9 Q238,0 252,12 Q266,22 280,10 Q294,2 308,13 Q322,22 336,10 Q350,2 364,14 Q378,24 392,11 Q406,2 420,13 Q434,22 448,10 Q462,2 476,14 Q490,24 504,14 L504,26 L0,26 Z" fill="var(--paper)"/>
      </svg>
    </div>

    <!-- 책 등 -->
    <div class="spine"></div>

    <!-- 오른쪽 쪽 -->
    <div class="page-right">
      <div class="page-right-bg"></div>
      <div class="page-right-color"></div>
      <div class="margin-line"></div>

      <div class="page-dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <div class="book-text">
        <p class="story-kr">노란 동그라미를 누르면<br>릴리 이야기가 시작돼요.</p>
        <div class="expression-block">
          <p class="expression-label">오늘의 표현</p>
          <span class="expression-word">brush my teeth</span>
        </div>
      </div>

      <div class="parent-strip">
        <div class="play-btn" role="button" aria-label="재생">
          <svg width="18" height="18" viewBox="0 0 18 18"><path d="M4 2.5L15 9L4 15.5V2.5Z"/></svg>
        </div>
        <div class="strip-sep"></div>
        <div class="strip-actions">
          <div class="action-item">
            <img src="../assets/ic-repeat.png" alt="">
            <span class="action-label">반복</span>
          </div>
          <div class="action-item">
            <img src="../assets/ic-slow.png" alt="">
            <span class="action-label">천천히</span>
          </div>
          <div class="action-item">
            <img src="../assets/ic-listen.png" alt="">
            <span class="action-label">그냥 듣기</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
