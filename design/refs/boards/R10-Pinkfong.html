<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R10 핑크퐁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);padding:40px 44px 44px;width:1460px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:28px}
.id{font-size:14px;letter-spacing:.08em;color:var(--accent);font-weight:700}
h1{font-family:var(--font-head);font-size:40px;font-weight:700;margin:6px 0 6px}
.url{font-size:15px;color:var(--sub)}
.tag{font-size:13px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;white-space:nowrap}
.why{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:30px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 26px}
.box h2{font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:10px}
.box p{font-size:19px;line-height:1.6}
.box ul{list-style:none}
.box li{font-size:18px;line-height:1.6;padding-left:22px;position:relative;margin-bottom:6px}
.box li::before{content:"";position:absolute;left:4px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.shots{display:flex;gap:40px;align-items:flex-start}
figure{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;box-shadow:var(--shadow)}
figure img{display:block;border-radius:6px}
figcaption{font-size:13px;color:var(--muted);padding:10px 4px 2px}
</style></head>
<body>
<header class="top"><div><div class="id">R10 참고 사이트</div><h1>핑크퐁</h1><div class="url">https://www.pinkfong.com/ko/</div></div><div class="tag">한국 아동 콘텐츠 브랜드</div></header>
<section class="why">
<div class="box"><h2>그림을 쓰는 방식</h2><p>짙은 파랑 바탕에 캐릭터와 숫자 그래픽, 불꽃을 한 장면으로 합쳐 첫 화면을 만들고, 아래는 카드 목록으로 소식을 보여 준다. 수채 감성과는 거리가 있다.</p></div>
<div class="box"><h2>릴리랑이 가져올 점</h2><ul><li>한국 부모가 익숙한 문장 길이와 정보 배치 기준으로 참고</li><li>캐릭터를 단색 바탕에 띄우는 방식은 릴리랑이 피할 대조 사례</li></ul></div>
</section>
<section class="shots">
<figure><img src="../assets/pinkfong-pc.webp" width="880" height="1650" alt="핑크퐁 PC 화면"><figcaption>PC 1440px, 첫 화면부터 아래로</figcaption></figure>
<figure><img src="../assets/pinkfong-m.webp" width="390" height="1650" alt="핑크퐁 휴대폰 화면"><figcaption>휴대폰 390px</figcaption></figure>
</section>
</body></html>
