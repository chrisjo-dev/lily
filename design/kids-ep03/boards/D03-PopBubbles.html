<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390">
  <title>D03 — 거품 터뜨리기</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    body { width: 390px; max-width: 390px; min-height: 844px; max-height: 844px; overflow: hidden; margin: 0 auto; background: var(--t-bg); font-family: var(--t-kr); }

    .top-bar { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--t-bg); }
    .ep-title { font-family: var(--t-en); font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.72); letter-spacing: 0.01em; }
    .progress-dots { display: flex; gap: 5px; align-items: center; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.28); }
    .dot.active { width: 14px; height: 14px; background: var(--t-accent); }
    .dot.done { background: rgba(255,255,255,0.55); }
    .skip-wrap { display: flex; align-items: center; gap: 5px; font-size: 11px; font-family: var(--t-kr); color: rgba(255,255,255,0.6); }
    .track { width: 34px; height: 18px; background: rgba(255,255,255,0.18); border-radius: 9px; position: relative; }
    .thumb { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,0.45); position: absolute; top: 2px; left: 2px; }

    .stage { width: 390px; height: 636px; overflow: hidden; background: var(--t-bg); position: relative; }

    .caption-strip { background: var(--t-surface); padding: 12px 20px 14px; height: 88px; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
    .caption-line { font-family: var(--t-kr); font-size: 20px; color: var(--t-ink); line-height: 1.4; }
    .caption-line .en { font-family: var(--t-en); color: var(--t-bg); font-weight: 700; }

    .parent-ctrl { height: 68px; background: var(--t-surface); border-top: 1.5px solid var(--t-line); display: flex; align-items: center; padding: 0 14px; gap: 8px; }
    .pp-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--t-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .track-wrap { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .audio-bar { height: 4px; background: var(--t-line); border-radius: 2px; overflow: hidden; }
    .audio-fill { height: 100%; background: var(--t-bg); border-radius: 2px; }
    .audio-time { font-family: var(--t-en); font-size: 11px; color: var(--t-sub); display: flex; justify-content: space-between; }
    .ctrl-btns { display: flex; gap: 5px; }
    .ctrl-btn { font-family: var(--t-kr); font-size: 10px; color: var(--t-sub); background: var(--t-soft); border-radius: 8px; padding: 5px 9px; white-space: nowrap; }

    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .bubble-b1 { animation: bob 2.2s ease-in-out infinite; }
    .bubble-b2 { animation: bob 2.8s ease-in-out 0.4s infinite; }
    .bubble-b3 { animation: bob 2.5s ease-in-out 0.9s infinite; }
  </style>
</head>
<body class="t-split">

  <!-- TOP BAR -->
  <div class="top-bar">
    <span class="ep-title">Brush, Brush, Brush!</span>
    <div class="progress-dots" aria-label="3/6 장면">
      <span class="dot done"></span>
      <span class="dot done"></span>
      <span class="dot active" aria-label="3번"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <div class="skip-wrap">
      <span>그냥 듣기</span>
      <div class="track" role="switch" aria-checked="false" aria-label="그냥 듣기">
        <div class="thumb"></div>
      </div>
    </div>
  </div>

  <!-- STAGE -->
  <div class="stage" aria-label="거품 터뜨리기, 거품을 눌러요">
    <svg width="390" height="636" viewBox="0 0 390 636" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">

      <!-- Background -->
      <rect width="390" height="636" style="fill: var(--t-bg)"/>

      <!-- "Bubbles" big word at top -->
      <text x="195" y="92" text-anchor="middle" style="font-family: var(--t-en); font-size: 68px; font-weight: 700; fill: var(--card); fill-opacity: 0.95; letter-spacing: -2px;">Bubbles!</text>

      <!-- Korean subtitle -->
      <text x="195" y="128" text-anchor="middle" style="font-family: var(--t-kr); font-size: 22px; fill: var(--card); fill-opacity: 0.75;">거품이야!</text>

      <!-- Popped bubble 1 (left, burst radiating lines) -->
      <g transform="translate(72, 230)">
        <g style="stroke: var(--t-accent); stroke-width: 3.5; fill: none; stroke-linecap: round;">
          <line x1="0" y1="0" x2="0" y2="-44"/>
          <line x1="0" y1="0" x2="38" y2="-26"/>
          <line x1="0" y1="0" x2="44" y2="10"/>
          <line x1="0" y1="0" x2="24" y2="40"/>
          <line x1="0" y1="0" x2="-24" y2="40"/>
          <line x1="0" y1="0" x2="-44" y2="10"/>
          <line x1="0" y1="0" x2="-38" y2="-26"/>
        </g>
        <!-- Pop sparkle dots -->
        <circle cx="0" cy="-50" r="5" style="fill: var(--t-accent)"/>
        <circle cx="44" cy="-30" r="4" style="fill: var(--t-accent)"/>
        <circle cx="50" cy="14" r="5" style="fill: var(--t-accent)"/>
        <circle cx="-50" cy="14" r="4" style="fill: var(--t-accent)"/>
        <circle cx="-44" cy="-30" r="5" style="fill: var(--t-accent)"/>
        <text x="0" y="70" text-anchor="middle" style="font-family: var(--t-en); font-size: 20px; font-weight: 700; fill: var(--t-accent);">POP!</text>
      </g>

      <!-- Popped bubble 2 (upper right, smaller burst) -->
      <g transform="translate(308, 175)">
        <g style="stroke: var(--card); stroke-width: 3; fill: none; stroke-linecap: round; stroke-opacity: 0.85;">
          <line x1="0" y1="0" x2="0" y2="-36"/>
          <line x1="0" y1="0" x2="31" y2="-21"/>
          <line x1="0" y1="0" x2="36" y2="8"/>
          <line x1="0" y1="0" x2="19" y2="32"/>
          <line x1="0" y1="0" x2="-19" y2="32"/>
          <line x1="0" y1="0" x2="-36" y2="8"/>
          <line x1="0" y1="0" x2="-31" y2="-21"/>
        </g>
        <circle cx="0" cy="-40" r="4" style="fill: var(--card); fill-opacity: 0.8"/>
        <circle cx="36" cy="-24" r="3" style="fill: var(--card); fill-opacity: 0.8"/>
        <circle cx="-36" cy="-24" r="3" style="fill: var(--card); fill-opacity: 0.8"/>
      </g>

      <!-- Intact bubble 1 (large, center, YELLOW outline = touchable) -->
      <g class="bubble-b1">
        <circle cx="195" cy="340" r="80" style="fill: var(--card); fill-opacity: 0.12; stroke: var(--t-accent); stroke-width: 4"/>
        <ellipse cx="172" cy="310" rx="18" ry="10" style="fill: var(--card); fill-opacity: 0.5; transform: rotate(-30deg); transform-origin: 172px 310px;"/>
        <circle cx="185" cy="305" r="6" style="fill: var(--card); fill-opacity: 0.4"/>
      </g>

      <!-- Intact bubble 2 (small, lower left, YELLOW outline) -->
      <g class="bubble-b2">
        <circle cx="88" cy="470" r="52" style="fill: var(--card); fill-opacity: 0.1; stroke: var(--t-accent); stroke-width: 3.5"/>
        <ellipse cx="74" cy="452" rx="12" ry="7" style="fill: var(--card); fill-opacity: 0.45; transform: rotate(-30deg); transform-origin: 74px 452px;"/>
      </g>

      <!-- Intact bubble 3 (medium, right, YELLOW outline) -->
      <g class="bubble-b3">
        <circle cx="316" cy="440" r="64" style="fill: var(--card); fill-opacity: 0.1; stroke: var(--t-accent); stroke-width: 3.5"/>
        <ellipse cx="299" cy="418" rx="14" ry="8" style="fill: var(--card); fill-opacity: 0.45; transform: rotate(-30deg); transform-origin: 299px 418px;"/>
      </g>

      <!-- Counter label 2/5 popped -->
      <rect x="148" y="590" width="94" height="32" rx="16" style="fill: var(--card); fill-opacity: 0.18"/>
      <text x="195" y="610" text-anchor="middle" style="font-family: var(--t-kr); font-size: 16px; fill: var(--card);">2 / 5 터짐!</text>

      <!-- Small Lily (bottom left, happy) -->
      <!-- Body -->
      <path d="M0 636 q2 -56 28 -76 h44 q26 20 28 76 z" style="fill: var(--sky)"/>
      <!-- Head -->
      <circle cx="50" cy="548" r="36" style="fill: var(--skin); stroke: var(--ink); stroke-width: 2"/>
      <!-- Hair -->
      <path d="M16 540 q4 -38 34 -40 q30 2 34 40 q-18 -18 -34 -20 q-16 2 -34 20 z" style="fill: var(--hair)"/>
      <!-- Left pigtail -->
      <path d="M17 532 q-18 10 -14 34 q10 -8 14 -22" style="fill: var(--hair)"/>
      <circle cx="5" cy="564" r="6" style="fill: var(--sun); stroke: var(--ink); stroke-width: 1.5"/>
      <!-- Right pigtail -->
      <path d="M83 532 q18 10 14 34 q-10 -8 -14 -22" style="fill: var(--hair)"/>
      <circle cx="95" cy="564" r="6" style="fill: var(--sun); stroke: var(--ink); stroke-width: 1.5"/>
      <!-- Eyes (excited) -->
      <circle cx="39" cy="550" r="6" style="fill: var(--ink)"/>
      <circle cx="61" cy="550" r="6" style="fill: var(--ink)"/>
      <circle cx="40" cy="548" r="2" style="fill: var(--card)"/>
      <circle cx="62" cy="548" r="2" style="fill: var(--card)"/>
      <!-- Big smile -->
      <path d="M37 560 q13 14 26 0" style="fill: none; stroke: var(--ink); stroke-width: 2.5"/>
      <!-- Cheeks -->
      <ellipse cx="30" cy="560" rx="8" ry="5" style="fill: var(--cheek); fill-opacity: 0.7"/>
      <ellipse cx="70" cy="560" rx="8" ry="5" style="fill: var(--cheek); fill-opacity: 0.7"/>
    </svg>
  </div>

  <!-- CAPTION STRIP -->
  <div class="caption-strip">
    <div class="caption-line">와! <span class="en">Bubbles!</span> 거품이야!</div>
  </div>

  <!-- PARENT CONTROLS -->
  <div class="parent-ctrl" aria-label="재생 조작">
    <div class="pp-btn" aria-label="일시정지">
      <svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true">
        <rect x="1" y="1" width="4" height="16" rx="2" style="fill: var(--card)"/>
        <rect x="9" y="1" width="4" height="16" rx="2" style="fill: var(--card)"/>
      </svg>
    </div>
    <div class="track-wrap">
      <div class="audio-bar"><div class="audio-fill" style="width: 47%"></div></div>
      <div class="audio-time"><span>1:08</span><span>2:19</span></div>
    </div>
    <div class="ctrl-btns">
      <div class="ctrl-btn">3번 이어 듣기</div>
      <div class="ctrl-btn">조금 천천히</div>
    </div>
  </div>

</body>
</html>
