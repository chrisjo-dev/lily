<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390">
  <title>A03 거품 터뜨리기 — Brush, Brush, Brush!</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    body { background:var(--t-bg); font-family:var(--t-body); color:var(--t-ink); width:390px; margin:0; height:844px; overflow:hidden; }
    .top-bar { height:36px; background:var(--t-bg); display:flex; align-items:center; padding:0 12px; gap:8px; }
    .top-title { font-family:var(--t-en); font-size:11px; font-weight:700; color:var(--t-ink); flex-shrink:0; letter-spacing:.02em; }
    .step-dots { display:flex; gap:5px; flex:1; justify-content:center; align-items:center; }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--t-surface); opacity:.28; }
    .dot.on { opacity:1; width:18px; border-radius:4px; }
    .listen-sw { display:flex; align-items:center; gap:4px; flex-shrink:0; }
    .sw-lbl { font-family:var(--t-kr); font-size:9px; color:var(--t-ink); opacity:.6; }
    .sw-track { width:28px; height:14px; background:var(--t-ink); border-radius:7px; opacity:.2; }
    .device { background:var(--t-surface); border-radius:24px 24px 26px 26px; border-bottom:9px solid var(--t-surface-2); margin:0 6px; padding:12px 10px 14px; }
    .screen { background:var(--t-screen); border-radius:16px; overflow:hidden; border:3px solid var(--t-surface-2); margin-bottom:10px; }
    .stage { width:100%; height:480px; overflow:hidden; line-height:0; position:relative; }
    .stage svg { display:block; width:100%; height:480px; }
    .caption { background:var(--t-screen); padding:10px 14px 12px; }
    .cap-text { font-family:var(--t-kr); font-size:14px; color:var(--t-paper); line-height:1.55; text-align:center; margin:0; }
    .cap-text .en { font-family:var(--t-en); font-size:17px; font-weight:700; color:var(--t-glow); }
    .btns { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .btn-side { background:var(--t-paper); border:none; border-bottom:5px solid var(--t-surface-2); border-radius:14px; padding:9px 6px 7px; display:flex; flex-direction:column; align-items:center; gap:4px; width:78px; cursor:pointer; }
    .btn-lbl { font-family:var(--t-kr); font-size:10px; color:var(--t-ink); text-align:center; line-height:1.3; white-space:pre-line; }
    .btn-play { background:var(--t-soft); border:none; border-bottom:6px solid var(--t-surface-2); border-radius:40px; width:84px; height:78px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; }
    .btn-time { font-family:var(--t-en); font-size:14px; font-weight:700; color:var(--t-ink); }
    .btn-total { font-family:var(--t-en); font-size:9px; color:var(--t-ink); opacity:.5; }
  </style>
</head>
<body class="t-toy">

  <div class="top-bar">
    <span class="top-title">Brush, Brush, Brush!</span>
    <div class="step-dots" aria-label="장면 3/6">
      <span class="dot"></span><span class="dot"></span><span class="dot on"></span>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="listen-sw" aria-label="그냥 듣기 꺼짐">
      <span class="sw-lbl">그냥 듣기</span>
      <div class="sw-track"></div>
    </div>
  </div>

  <div class="device">
    <div class="screen" aria-label="거품 터뜨리기 장면, 2개 터뜨림">

      <div class="stage">
        <svg viewBox="0 0 352 480" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">
          <!-- Background: light airy (t-soft/yellow) -->
          <rect width="352" height="480" style="fill:var(--t-soft)"/>
          <!-- light background gradient suggestion (rectangles) -->
          <rect x="0" y="0" width="352" height="240" style="fill:var(--t-paper);opacity:.45"/>

          <!-- BIG "Bubbles!" text -->
          <text x="176" y="72" text-anchor="middle" style="font-family:var(--t-en);font-size:52px;font-weight:700;fill:var(--t-screen);opacity:.9">Bubbles!</text>

          <!-- count indicator: 2 of 5 popped -->
          <rect x="124" y="82" width="104" height="26" rx="13" style="fill:var(--t-screen);opacity:.18"/>
          <text x="176" y="100" text-anchor="middle" style="font-family:var(--t-en);font-size:13px;font-weight:700;fill:var(--t-screen)">2 / 5 popped</text>

          <!-- REMAINING BUBBLES (3 circles) -->
          <!-- Big bubble, left -->
          <circle cx="86" cy="220" r="66" style="fill:var(--card);opacity:.72;stroke:var(--t-glow);stroke-width:3"/>
          <!-- bubble shine -->
          <circle cx="72" cy="202" r="10" style="fill:var(--card);opacity:.9;stroke:none"/>
          <!-- tap ring hint -->
          <circle cx="86" cy="220" r="74" style="fill:none;stroke:var(--t-glow);stroke-width:2.5;opacity:.4;stroke-dasharray:8,6"/>
          <!-- finger tap icon inside bubble -->
          <text x="86" y="228" text-anchor="middle" style="font-family:var(--t-kr);font-size:13px;fill:var(--t-screen);opacity:.5">눌러요!</text>

          <!-- Medium bubble, upper right -->
          <circle cx="268" cy="168" r="48" style="fill:var(--card);opacity:.68;stroke:var(--t-glow);stroke-width:3"/>
          <circle cx="256" cy="154" r="8" style="fill:var(--card);opacity:.9;stroke:none"/>

          <!-- Small bubble, lower right -->
          <circle cx="286" cy="370" r="34" style="fill:var(--card);opacity:.68;stroke:var(--t-glow);stroke-width:3"/>
          <circle cx="278" cy="360" r="6" style="fill:var(--card);opacity:.9;stroke:none"/>

          <!-- POPPED BUBBLE 1 (center-top, the one just tapped — big burst) -->
          <!-- starburst at (186, 290) -->
          <g style="fill:var(--t-glow);stroke:none">
            <polygon points="186,250 193,276 216,260 204,284 232,284 214,300 228,322 204,312 200,340 186,318 172,340 168,312 144,322 158,300 140,284 168,284 156,260 179,276"/>
          </g>
          <text x="186" y="300" text-anchor="middle" style="font-family:var(--t-en);font-size:18px;font-weight:700;fill:var(--t-screen)">Pop!</text>
          <!-- small sparkle bits around burst -->
          <g style="fill:var(--sun);stroke:none">
            <circle cx="148" cy="254" r="5"/>
            <circle cx="224" cy="256" r="4"/>
            <circle cx="140" cy="308" r="4"/>
            <circle cx="230" cy="312" r="5"/>
          </g>

          <!-- POPPED BUBBLE 2 (small burst, bottom-left) -->
          <g style="fill:var(--t-glow);opacity:.7;stroke:none">
            <polygon points="66,390 70,406 82,397 78,412 94,408 84,420 96,428 80,426 80,444 70,432 60,444 60,426 44,428 56,420 46,408 62,412 58,397 70,406"/>
          </g>
          <text x="66" y="424" text-anchor="middle" style="font-family:var(--t-en);font-size:12px;font-weight:700;fill:var(--t-screen);opacity:.8">pop</text>

          <!-- Lily small (BOTTOM-LEFT corner, excited — clear of title) -->
          <circle cx="42" cy="434" r="26" style="fill:var(--skin);stroke:var(--ink);stroke-width:2"/>
          <path d="M18,424 q4-28 24-28 q20,0 24,28 q-10-10-24-12 q-14,2-24,12 z" style="fill:var(--hair)"/>
          <circle cx="16" cy="416" r="4" style="fill:var(--sun);stroke:var(--ink);stroke-width:1.5"/>
          <circle cx="68" cy="416" r="4" style="fill:var(--sun);stroke:var(--ink);stroke-width:1.5"/>
          <circle cx="34" cy="434" r="3" style="fill:var(--ink)"/>
          <circle cx="50" cy="434" r="3" style="fill:var(--ink)"/>
          <ellipse cx="26" cy="442" rx="5" ry="3" style="fill:var(--cheek);opacity:.7"/>
          <ellipse cx="58" cy="442" rx="5" ry="3" style="fill:var(--cheek);opacity:.7"/>
          <path d="M34,446 q8,8 16,0" style="fill:none;stroke:var(--ink);stroke-width:2"/>
          <!-- exclamation bubble from Lily (to the right) -->
          <rect x="72" y="412" width="52" height="28" rx="8" style="fill:var(--t-soft);stroke:var(--sun);stroke-width:2"/>
          <text x="98" y="431" text-anchor="middle" style="font-family:var(--t-en);font-size:16px;font-weight:700;fill:var(--t-surface)">Pop!</text>
          <path d="M74,424 l-10,8 l4,0 z" style="fill:var(--t-soft);stroke:var(--sun);stroke-width:2"/>
        </svg>
      </div>

      <div class="caption">
        <p class="cap-text">와! <span class="en">Bubbles!</span> 거품이야!<br><span class="en">Pop, pop, pop!</span></p>
      </div>
    </div>

    <div class="btns">
      <button class="btn-side" aria-label="3번 이어 듣기">
        <svg width="28" height="22" viewBox="0 0 28 22" aria-hidden="true">
          <path d="M20 3 L25 8 L20 13" stroke-width="2.5" style="fill:none;stroke:var(--t-ink)"/>
          <path d="M4 17 C4 9 10 4 18 6" stroke-width="2.5" style="fill:none;stroke:var(--t-ink)"/>
          <text x="3" y="22" font-size="9" font-weight="700" style="fill:var(--t-ink);font-family:var(--t-en)">x3</text>
        </svg>
        <span class="btn-lbl">3번&#10;이어 듣기</span>
      </button>

      <button class="btn-play" aria-label="일시정지, 현재 1분 08초">
        <span class="btn-time">1:08</span>
        <span class="btn-total">/ 2:19</span>
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <rect x="3" y="2" width="5" height="16" rx="2.5" style="fill:var(--t-ink)"/>
          <rect x="12" y="2" width="5" height="16" rx="2.5" style="fill:var(--t-ink)"/>
        </svg>
      </button>

      <button class="btn-side" aria-label="조금 천천히">
        <svg width="28" height="22" viewBox="0 0 28 22" aria-hidden="true">
          <ellipse cx="14" cy="11" rx="8" ry="6" style="fill:none;stroke:var(--t-ink);stroke-width:2.5"/>
          <line x1="6" y1="11" x2="2" y2="11" stroke-width="2.5" style="stroke:var(--t-ink)"/>
          <line x1="22" y1="11" x2="26" y2="11" stroke-width="2.5" style="stroke:var(--t-ink)"/>
        </svg>
        <span class="btn-lbl">조금&#10;천천히</span>
      </button>
    </div>
  </div>

</body>
</html>
