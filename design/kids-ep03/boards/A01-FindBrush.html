<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390">
  <title>A01 칫솔 찾기 — Brush, Brush, Brush!</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    body { background:var(--t-bg); font-family:var(--t-body); color:var(--t-ink); width:390px; margin:0; height:844px; overflow:hidden; }

    /* top bar */
    .top-bar { height:36px; background:var(--t-bg); display:flex; align-items:center; padding:0 12px; gap:8px; }
    .top-title { font-family:var(--t-en); font-size:11px; font-weight:700; color:var(--t-ink); flex-shrink:0; letter-spacing:.02em; }
    .step-dots { display:flex; gap:5px; flex:1; justify-content:center; align-items:center; }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--t-surface); opacity:.28; }
    .dot.on { opacity:1; width:18px; border-radius:4px; }
    .listen-sw { display:flex; align-items:center; gap:4px; flex-shrink:0; }
    .sw-lbl { font-family:var(--t-kr); font-size:9px; color:var(--t-ink); opacity:.6; }
    .sw-track { width:28px; height:14px; background:var(--t-ink); border-radius:7px; opacity:.2; }

    /* device */
    .device { background:var(--t-surface); border-radius:24px 24px 26px 26px; border-bottom:9px solid var(--t-surface-2); margin:0 6px; padding:12px 10px 14px; }

    /* screen */
    .screen { background:var(--t-screen); border-radius:16px; overflow:hidden; border:3px solid var(--t-surface-2); margin-bottom:10px; }
    @keyframes bezel-blink { 0%,100%{ border-color:var(--t-glow); } 50%{ border-color:var(--t-surface-2); } }
    .screen.waiting { border-color:var(--t-glow); animation:bezel-blink 1.8s ease-in-out infinite; }

    /* stage */
    .stage { width:100%; height:480px; overflow:hidden; line-height:0; position:relative; }
    .stage svg { display:block; width:100%; height:480px; }

    /* caption */
    .caption { background:var(--t-screen); padding:10px 14px 8px; }
    .cap-text { font-family:var(--t-kr); font-size:14px; color:var(--t-paper); line-height:1.55; text-align:center; margin:0; }
    .cap-text .en { font-family:var(--t-en); font-size:17px; font-weight:700; color:var(--t-glow); }
    .wait-bar { display:flex; align-items:center; justify-content:center; gap:8px; padding:5px 0 6px; }
    .wait-lbl { font-family:var(--t-kr); font-size:11px; color:var(--t-glow); }
    .timer-ring { width:22px; height:22px; flex-shrink:0; }

    /* buttons */
    .btns { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .btn-side { background:var(--t-paper); border:none; border-bottom:5px solid var(--t-surface-2); border-radius:14px; padding:9px 6px 7px; display:flex; flex-direction:column; align-items:center; gap:4px; width:78px; cursor:pointer; }
    .btn-lbl { font-family:var(--t-kr); font-size:10px; color:var(--t-ink); text-align:center; line-height:1.3; white-space:pre-line; }
    .btn-play { background:var(--t-soft); border:none; border-bottom:6px solid var(--t-surface-2); border-radius:40px; width:84px; height:78px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; }
    .btn-time { font-family:var(--t-en); font-size:14px; font-weight:700; color:var(--t-ink); }
    .btn-total { font-family:var(--t-en); font-size:9px; color:var(--t-ink); opacity:.5; }

    /* bottom hint */
    .bott-hint { text-align:center; padding:7px 0 4px; display:flex; flex-direction:column; align-items:center; gap:2px; }
    .bott-hint-txt { font-family:var(--t-kr); font-size:10px; color:var(--t-ink); opacity:.42; }

    /* ws tag on stage */
    .ws-tag { position:absolute; top:10px; right:10px; background:var(--t-soft); border-radius:8px; padding:4px 9px; font-family:var(--t-kr); font-size:11px; color:var(--t-ink); border:2px solid var(--sun); z-index:5; line-height:1; }
  </style>
</head>
<body class="t-toy">

  <div class="top-bar">
    <span class="top-title">Brush, Brush, Brush!</span>
    <div class="step-dots" aria-label="장면 1/6">
      <span class="dot on"></span><span class="dot"></span><span class="dot"></span>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="listen-sw" aria-label="그냥 듣기 꺼짐">
      <span class="sw-lbl">그냥 듣기</span>
      <div class="sw-track"></div>
    </div>
  </div>

  <div class="device">
    <div class="screen waiting" aria-label="칫솔 찾기 장면, 기다리는 중">

      <div class="stage">
        <div class="ws-tag">학습지 1번</div>

        <svg viewBox="0 0 352 480" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">
          <!-- background warm tile -->
          <rect width="352" height="480" style="fill:var(--t-paper)"/>
          <!-- tile grid -->
          <g style="stroke:var(--t-soft);stroke-width:1.5;fill:none">
            <line x1="0" y1="96" x2="352" y2="96"/><line x1="0" y1="192" x2="352" y2="192"/>
            <line x1="0" y1="288" x2="352" y2="288"/>
            <line x1="88" y1="0" x2="88" y2="288"/><line x1="176" y1="0" x2="176" y2="288"/><line x1="264" y1="0" x2="264" y2="288"/>
          </g>
          <!-- mirror on wall (top-right) -->
          <rect x="214" y="18" width="122" height="82" rx="14" style="fill:var(--card);stroke:var(--ink);stroke-width:2.5"/>
          <line x1="228" y1="34" x2="248" y2="24" style="stroke:var(--t-soft);stroke-width:1.5"/>
          <line x1="228" y1="50" x2="260" y2="30" style="stroke:var(--t-soft);stroke-width:1.5"/>
          <!-- counter shelf -->
          <rect x="0" y="330" width="352" height="150" style="fill:var(--dog)"/>
          <rect x="0" y="322" width="352" height="10" style="fill:var(--hair)"/>
          <!-- bathroom vanity cabinet (replaces confusing sink) -->
          <rect x="104" y="342" width="136" height="82" rx="12" style="fill:var(--t-paper);stroke:var(--ink);stroke-width:2.5"/>
          <line x1="104" y1="383" x2="240" y2="383" style="stroke:var(--ink);stroke-width:2"/>
          <circle cx="172" cy="363" r="5" style="fill:var(--dog);stroke:var(--ink);stroke-width:1.5"/>
          <circle cx="172" cy="403" r="5" style="fill:var(--dog);stroke:var(--ink);stroke-width:1.5"/>
          <!-- cup (left on counter) -->
          <rect x="34" y="278" width="36" height="50" rx="5" style="fill:var(--sun);stroke:var(--ink);stroke-width:2.5"/>
          <rect x="34" y="278" width="36" height="10" rx="4" style="fill:var(--ink);opacity:.14"/>

          <!-- Biscuit (center-right, fully inside stage, peeking over counter) -->
          <circle cx="214" cy="302" r="44" style="fill:var(--dog);stroke:var(--ink);stroke-width:2.5"/>
          <!-- ears -->
          <ellipse cx="184" cy="286" rx="18" ry="26" style="fill:var(--hair);stroke:var(--ink);stroke-width:2"/>
          <ellipse cx="244" cy="286" rx="18" ry="26" style="fill:var(--hair);stroke:var(--ink);stroke-width:2"/>
          <!-- eyes -->
          <circle cx="202" cy="294" r="4.5" style="fill:var(--ink)"/>
          <circle cx="226" cy="294" r="4.5" style="fill:var(--ink)"/>
          <circle cx="204" cy="291" r="1.8" style="fill:var(--card)"/>
          <circle cx="228" cy="291" r="1.8" style="fill:var(--card)"/>
          <!-- nose -->
          <ellipse cx="214" cy="310" rx="6" ry="4" style="fill:var(--ink)"/>
          <!-- cheeks -->
          <ellipse cx="192" cy="316" rx="9" ry="6" style="fill:var(--cheek);opacity:.6"/>
          <ellipse cx="236" cy="316" rx="9" ry="6" style="fill:var(--cheek);opacity:.6"/>

          <!-- TOOTHBRUSH clearly in mouth, sticking right -->
          <!-- handle -->
          <rect x="226" y="312" width="82" height="12" rx="6" style="fill:var(--t-surface);stroke:var(--ink);stroke-width:2"/>
          <!-- bristle head block -->
          <rect x="304" y="304" width="30" height="18" rx="6" style="fill:var(--card);stroke:var(--ink);stroke-width:2"/>
          <!-- bristles (bright mint) -->
          <g style="stroke:var(--t-glow);stroke-width:3.5;stroke-linecap:round">
            <line x1="310" y1="304" x2="310" y2="293"/>
            <line x1="318" y1="304" x2="318" y2="293"/>
            <line x1="326" y1="304" x2="326" y2="293"/>
          </g>
          <!-- HINT RING pulsing around bristles -->
          <circle cx="318" cy="300" r="24" style="fill:none;stroke:var(--t-glow);stroke-width:3.5">
            <animate attributeName="r" values="22;32;22" dur="1.6s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
          </circle>

          <!-- Lily (left, looking puzzled) -->
          <!-- shirt / body -->
          <path d="M18,260 q52,30 104,0 l6,24 q-52,14-116,0 z" style="fill:var(--t-screen)"/>
          <!-- head -->
          <circle cx="70" cy="196" r="52" style="fill:var(--skin);stroke:var(--ink);stroke-width:2.5"/>
          <!-- hair -->
          <path d="M20,182 q6-56 50-56 q44,0 50,56 q-22-20-50-22 q-28,2-50,22 z" style="fill:var(--hair)"/>
          <!-- pigtails -->
          <path d="M20,166 q-28,6-22,40 q14-6 18-24" style="fill:var(--hair)"/>
          <path d="M120,166 q28,6 22,40 q-14-6-18-24" style="fill:var(--hair)"/>
          <!-- hair ties -->
          <circle cx="24" cy="162" r="7" style="fill:var(--sun);stroke:var(--ink);stroke-width:2"/>
          <circle cx="116" cy="162" r="7" style="fill:var(--sun);stroke:var(--ink);stroke-width:2"/>
          <!-- eyes (wide, puzzled) -->
          <circle cx="56" cy="196" r="6" style="fill:var(--ink)"/>
          <circle cx="84" cy="196" r="6" style="fill:var(--ink)"/>
          <circle cx="58" cy="193" r="2" style="fill:var(--card)"/>
          <circle cx="86" cy="193" r="2" style="fill:var(--card)"/>
          <!-- cheeks -->
          <ellipse cx="42" cy="212" rx="10" ry="6" style="fill:var(--cheek);opacity:.65"/>
          <ellipse cx="98" cy="212" rx="10" ry="6" style="fill:var(--cheek);opacity:.65"/>
          <!-- puzzled mouth (slight frown) -->
          <path d="M58,224 q12,8 24,0" style="fill:none;stroke:var(--ink);stroke-width:2.5"/>
          <!-- question eyebrow right up -->
          <path d="M78,180 q8,-8 12,-4" style="fill:none;stroke:var(--ink);stroke-width:2.5"/>

          <!-- speech bubble -->
          <rect x="90" y="122" width="152" height="54" rx="14" style="fill:var(--t-soft);stroke:var(--sun);stroke-width:2"/>
          <path d="M104,172 l-18,18 l8,0 z" style="fill:var(--t-soft);stroke:var(--sun);stroke-width:2"/>
          <text x="106" y="146" style="font-family:var(--t-kr);font-size:13px;fill:var(--t-ink)">칫솔이 어디 있지?</text>
          <text x="106" y="166" style="font-family:var(--t-kr);font-size:12px;fill:var(--t-ink);opacity:.72">찾아볼까요!</text>

          <!-- 5-second arc timer (top-center of stage, subtle) -->
          <!-- full circle track -->
          <circle cx="176" cy="24" r="12" style="fill:none;stroke:var(--t-soft);stroke-width:3.5"/>
          <!-- arc: ~60% elapsed, 40% remaining; circumference≈75.4; 40%=30.2, gap=45.2 -->
          <circle cx="176" cy="24" r="12" style="fill:none;stroke:var(--t-glow);stroke-width:3.5;stroke-dasharray:30 45.4;transform:rotate(-90deg);transform-origin:176px 24px"/>
        </svg>
      </div>

      <div class="caption">
        <p class="cap-text">칫솔이 어디 있지?<br>학습지 1번 그림에서 칫솔을 찾아볼까?</p>
        <div class="wait-bar">
          <span class="wait-lbl">릴리가 기다려요</span>
          <svg class="timer-ring" viewBox="0 0 22 22" aria-hidden="true">
            <circle cx="11" cy="11" r="8" style="fill:none;stroke:var(--t-screen);stroke-width:3"/>
            <circle cx="11" cy="11" r="8" style="fill:none;stroke:var(--t-glow);stroke-width:3;stroke-dasharray:20 30;transform:rotate(-90deg);transform-origin:11px 11px"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="btns">
      <button class="btn-side" aria-label="3번 이어 듣기">
        <svg width="28" height="22" viewBox="0 0 28 22" aria-hidden="true">
          <path d="M20 3 L25 8 L20 13" stroke-width="2.5" style="fill:none;stroke:var(--t-ink)"/>
          <path d="M4 17 C4 9 10 4 18 6" stroke-width="2.5" style="fill:none;stroke:var(--t-ink)"/>
          <text x="3" y="22" font-size="9" font-weight="700" style="fill:var(--t-ink);font-family:var(--t-en)">x3</text>
        </svg>
        <span class="btn-lbl">3번&#10;이어 듣기</span>
      </button>

      <button class="btn-play" aria-label="재생, 현재 0분 31초">
        <span class="btn-time">0:31</span>
        <span class="btn-total">/ 2:19</span>
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <polygon points="5,3 17,10 5,17" style="fill:var(--t-ink)"/>
        </svg>
      </button>

      <button class="btn-side" aria-label="조금 천천히">
        <svg width="28" height="22" viewBox="0 0 28 22" aria-hidden="true">
          <ellipse cx="14" cy="11" rx="8" ry="6" style="fill:none;stroke:var(--t-ink);stroke-width:2.5"/>
          <line x1="6" y1="11" x2="2" y2="11" stroke-width="2.5" style="stroke:var(--t-ink)"/>
          <line x1="22" y1="11" x2="26" y2="11" stroke-width="2.5" style="stroke:var(--t-ink)"/>
        </svg>
        <span class="btn-lbl">조금&#10;천천히</span>
      </button>
    </div>
  </div>

  <div class="bott-hint" aria-label="부모님 화면 안내">
    <span class="bott-hint-txt">아래로 내리면 부모님 화면</span>
    <svg width="14" height="8" viewBox="0 0 14 8" aria-hidden="true">
      <path d="M2 2 L7 6 L12 2" stroke-width="2" style="fill:none;stroke:var(--t-ink);opacity:.35"/>
    </svg>
  </div>

</body>
</html>
