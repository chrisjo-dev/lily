<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390">
  <title>Brush, Brush, Brush! — 잘 자</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    body {
      background: var(--t-bg); color: var(--t-ink); font-family: var(--t-body);
      width: 390px; margin: 0 auto; overflow-x: hidden;
    }
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; height: 52px;
      background: var(--t-surface); border-bottom: 1.5px solid var(--t-soft);
    }
    .top-title { font-family: var(--t-en); font-size: 11px; color: var(--t-sub); letter-spacing: 0.03em; }
    .prog-dots { display: flex; align-items: center; gap: 5px; }
    .pdot { width: 8px; height: 8px; border-radius: 50%; background: var(--t-soft); }
    .pdot.done { background: var(--t-accent); opacity: 0.38; }
    .pdot.now  { width: 22px; border-radius: 4px; background: var(--t-accent); }
    .listen-sw { display: flex; align-items: center; gap: 5px; font-family: var(--t-kr); font-size: 10px; color: var(--t-sub); }
    .sw-track { width: 28px; height: 16px; background: var(--t-soft); border-radius: 8px; position: relative; }
    .sw-thumb { position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; background: var(--t-surface); border-radius: 50%; }

    /* 무대: 높이를 350px으로 줄여 아래 컨텐츠가 844px 안에 들어오게 함 */
    .stage { width: 390px; height: 350px; position: relative; overflow: hidden; display: block; }

    .caption-strip {
      background: var(--t-surface); padding: 11px 22px 9px;
      border-top: 1.5px solid var(--t-soft); border-bottom: 1.5px solid var(--t-soft);
    }
    .caption-text {
      font-family: var(--t-kr); font-size: 17px; line-height: 1.5;
      color: var(--t-ink); margin: 0; text-align: center; word-break: keep-all;
    }
    .en { font-family: var(--t-en); font-size: 19px; color: var(--t-accent); font-weight: 700; }

    /* 컨트롤: 패딩 줄여서 높이 절약 */
    .controls { background: var(--t-bg); padding: 10px 18px 9px; }
    .ctrl-top { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
    .play-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--t-accent); border: none; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; }
    .prog-wrap { flex: 1; }
    .prog-track { height: 4px; background: var(--t-soft); border-radius: 2px; margin-bottom: 4px; }
    .prog-fill { width: 95%; height: 100%; background: var(--t-accent); border-radius: 2px; }
    .time-row { display: flex; justify-content: space-between; font-family: var(--t-en); font-size: 11px; color: var(--t-sub); }
    .ctrl-btns { display: flex; gap: 7px; }
    .ctrl-btn { flex: 1; border: 1.5px solid var(--t-soft); background: var(--t-surface); border-radius: 10px; padding: 7px 6px; font-family: var(--t-kr); font-size: 11px; color: var(--t-sub); text-align: center; cursor: pointer; }

    /* 마감 카드: 패딩과 스티커 슬롯 높이를 줄여 전체 높이 절약 */
    .end-card {
      background: var(--t-surface);
      border-top: 1.5px solid var(--t-soft);
      padding: 14px 18px 12px;
    }
    .end-label {
      font-family: var(--t-kr); font-size: 11px; color: var(--t-sub);
      letter-spacing: 0.06em; text-align: center; margin: 0 0 11px;
    }
    .sticker-row {
      display: flex; gap: 10px; justify-content: center; margin-bottom: 14px;
    }
    .sticker-slot {
      width: 96px; height: 72px; border-radius: 16px;
      background: var(--t-soft);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 3px;
    }
    .sticker-slot img { width: 44px; height: 38px; object-fit: contain; }
    .sticker-word { font-family: var(--t-en); font-size: 10px; color: var(--t-accent); font-weight: 700; }
    .end-btns { display: flex; gap: 10px; }
    .end-btn {
      flex: 1; border: 2px solid var(--t-accent); background: var(--t-surface);
      border-radius: 13px; padding: 12px 8px;
      font-family: var(--t-kr); font-size: 13px; color: var(--t-accent);
      text-align: center; cursor: pointer;
    }
    .end-btn.primary { background: var(--t-accent); color: var(--t-surface); }

    /* 부모 힌트 */
    .parent-hint {
      display: flex; align-items: center; justify-content: center; gap: 5px;
      padding: 7px 16px 8px; background: var(--t-bg);
      font-family: var(--t-kr); font-size: 10px; color: var(--t-sub);
    }

    /* 애니메이션: 첫 프레임(0%)을 정지 렌더에서도 보이는 값으로 설정 */
    .lamp-glow {
      /* 정지 상태에서도 opacity:0.38로 보임 */
      animation: glow 2s ease-in-out infinite;
    }
    @keyframes glow { 0%,100%{opacity:0.38} 50%{opacity:0.65} }

    .hint-ring {
      /* 정지 상태에서도 opacity:0.55로 보임 */
      animation: hpulse 2s ease-in-out infinite;
    }
    @keyframes hpulse { 0%,100%{opacity:0.55} 50%{opacity:0.18} }

    .star-twinkle {
      /* 정지 상태에서도 opacity:0.85로 보임 */
      animation: twinkle 3s ease-in-out infinite;
    }
    .star-twinkle.d1 { animation-delay: 1.1s; }
    .star-twinkle.d2 { animation-delay: 2.2s; }
    @keyframes twinkle { 0%,100%{opacity:0.85} 50%{opacity:0.28} }
  </style>
</head>
<body class="t-book">

  <header class="top-bar">
    <span class="top-title">Brush, Brush, Brush!</span>
    <div class="prog-dots" aria-label="진행 6/6">
      <span class="pdot done"></span><span class="pdot done"></span>
      <span class="pdot done"></span><span class="pdot done"></span>
      <span class="pdot done"></span><span class="pdot now"></span>
    </div>
    <div class="listen-sw">
      <span>그냥 듣기</span>
      <span class="sw-track"><span class="sw-thumb"></span></span>
    </div>
  </header>

  <!-- 무대: 350px -->
  <div class="stage" role="img" aria-label="침실 장면. 릴리가 잠자리에 들었어요. 조명을 꺼 봐요.">
    <svg width="390" height="350" viewBox="0 0 390 350" xmlns="http://www.w3.org/2000/svg">

      <!-- 배경 (wash-1 하늘빛) -->
      <rect x="0" y="0" width="390" height="350" style="fill:var(--t-wash-1)"/>
      <!-- 바닥 (wash-2) -->
      <rect x="0" y="244" width="390" height="106" style="fill:var(--t-wash-2); opacity:0.7"/>

      <!-- 달 -->
      <circle cx="66" cy="58" r="32" style="fill:var(--t-wash-3)"/>
      <circle cx="80" cy="46" r="24" style="fill:var(--t-wash-1)"/>

      <!-- 별 1 (항상 보임: opacity 0.85 @ 0% 프레임) -->
      <g class="star-twinkle" style="opacity:0.85">
        <line x1="162" y1="36" x2="162" y2="50" style="stroke:var(--t-sub); stroke-width:2; stroke-linecap:round"/>
        <line x1="155" y1="43" x2="169" y2="43" style="stroke:var(--t-sub); stroke-width:2; stroke-linecap:round"/>
      </g>
      <!-- 별 2 -->
      <g class="star-twinkle d1" style="opacity:0.85">
        <line x1="244" y1="22" x2="244" y2="34" style="stroke:var(--t-sub); stroke-width:1.5; stroke-linecap:round"/>
        <line x1="238" y1="28" x2="250" y2="28" style="stroke:var(--t-sub); stroke-width:1.5; stroke-linecap:round"/>
      </g>
      <!-- 별 3 -->
      <g class="star-twinkle d2" style="opacity:0.85">
        <line x1="330" y1="40" x2="330" y2="52" style="stroke:var(--t-sub); stroke-width:2; stroke-linecap:round"/>
        <line x1="324" y1="46" x2="336" y2="46" style="stroke:var(--t-sub); stroke-width:2; stroke-linecap:round"/>
      </g>

      <!-- 침대 프레임 (wash-2) -->
      <rect x="16" y="228" width="270" height="120" rx="10" style="fill:var(--t-wash-2)"/>
      <!-- 헤드보드 -->
      <rect x="16" y="200" width="270" height="44" rx="10" style="fill:var(--t-wash-2)"/>
      <rect x="26" y="208" width="250" height="28" rx="7" style="fill:var(--t-surface); opacity:0.55"/>
      <!-- 이불 (wash-3) -->
      <rect x="20" y="258" width="262" height="88" rx="8" style="fill:var(--t-wash-3)"/>
      <!-- 이불 주름 -->
      <path d="M20 278 q65 -12 130 0 q65 12 132 0" style="fill:none; stroke:var(--t-soft); stroke-width:1.5; opacity:0.7"/>
      <!-- 베개 -->
      <rect x="22" y="228" width="90" height="36" rx="11" style="fill:var(--t-surface)"/>

      <!-- 릴리 머리 (베개 위) -->
      <circle cx="72" cy="244" r="26" style="fill:var(--skin)"/>
      <path d="M46 228 q14 -28 26 -28 q12 0 26 28 q-12 -10 -26 -12 q-14 2 -26 12 z" style="fill:var(--hair)"/>
      <path d="M46 228 q-16 4 -12 24 q5 -4 7 -14" style="fill:var(--hair)"/>
      <circle cx="34" cy="252" r="5" style="fill:var(--sun)"/>
      <path d="M98 228 q16 4 12 24 q-5 -4 -7 -14" style="fill:var(--hair)"/>
      <circle cx="110" cy="252" r="5" style="fill:var(--sun)"/>
      <!-- 눈 감음 -->
      <path d="M58 244 q7 -7 14 0" style="fill:none; stroke:var(--ink); stroke-width:2.5; stroke-linecap:round"/>
      <path d="M76 244 q7 -7 14 0" style="fill:none; stroke:var(--ink); stroke-width:2.5; stroke-linecap:round"/>
      <!-- 볼 -->
      <ellipse cx="52" cy="252" rx="8" ry="5" style="fill:var(--cheek); opacity:0.6"/>
      <ellipse cx="92" cy="252" rx="8" ry="5" style="fill:var(--cheek); opacity:0.6"/>

      <!-- 사이드 테이블 -->
      <rect x="290" y="236" width="82" height="96" rx="7" style="fill:var(--t-surface); stroke:var(--t-soft); stroke-width:1.5"/>

      <!-- 램프 글로우: opacity:0.38 = 0% 프레임 → 정지 렌더에서도 보임 -->
      <circle cx="332" cy="210" r="38" class="lamp-glow" style="fill:var(--t-wash-3); opacity:0.38"/>

      <!-- 램프 전등갓 (wash-3 켜짐) -->
      <path d="M308 210 q24 -38 48 0 z" style="fill:var(--t-wash-3)"/>
      <!-- 램프 몸통 -->
      <rect x="326" y="210" width="12" height="38" rx="5" style="fill:var(--t-sub); opacity:0.4"/>

      <!-- 힌트 링: opacity:0.55 = 0% 프레임 → 정지 렌더에서도 보임 -->
      <circle cx="332" cy="210" r="46" class="hint-ring" style="fill:none; stroke:var(--t-accent); stroke-width:2; opacity:0.55"/>

      <!-- 손가락 포인터 (램프 아래) -->
      <ellipse cx="318" cy="178" rx="8" ry="12" style="fill:var(--skin); stroke:var(--ink); stroke-width:1.5; opacity:0.85"/>
      <rect x="312" y="166" width="5" height="13" rx="2.5" style="fill:var(--skin); stroke:var(--ink); stroke-width:1; opacity:0.85"/>
      <rect x="317" y="163" width="5" height="16" rx="2.5" style="fill:var(--skin); stroke:var(--ink); stroke-width:1; opacity:0.85"/>
      <rect x="322" y="165" width="5" height="14" rx="2.5" style="fill:var(--skin); stroke:var(--ink); stroke-width:1; opacity:0.85"/>

      <!-- Good night! 텍스트 -->
      <text x="192" y="96" style="font-family:var(--t-en); font-size:28px; font-weight:700; fill:var(--t-accent); text-anchor:middle; opacity:0.92">Good night!</text>

      <!-- 페이지 모서리 글로우 -->
      <rect x="334" y="300" width="56" height="50" rx="25" style="fill:var(--t-wash-3); opacity:0.35"/>

    </svg>
  </div>

  <!-- 캡션 -->
  <div class="caption-strip">
    <p class="caption-text"><span class="en">Good night!</span> 오늘 밤 양치할 때 말해 봐. <span class="en">Bye-bye!</span></p>
  </div>

  <!-- 컨트롤 -->
  <div class="controls">
    <div class="ctrl-top">
      <button class="play-btn" aria-label="재생">
        <svg width="14" height="14" viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg">
          <polygon points="3,1 13,7 3,13" style="fill:var(--t-surface)"/>
        </svg>
      </button>
      <div class="prog-wrap">
        <div class="prog-track"><div class="prog-fill"></div></div>
        <div class="time-row"><span>2:12</span><span>2:19</span></div>
      </div>
    </div>
    <div class="ctrl-btns">
      <button class="ctrl-btn">3번 이어 듣기</button>
      <button class="ctrl-btn">조금 천천히</button>
    </div>
  </div>

  <!-- 마감 카드: 오늘 배운 단어 + 버튼 -->
  <div class="end-card">
    <p class="end-label">오늘 배운 단어</p>
    <div class="sticker-row">
      <div class="sticker-slot">
        <img src="../assets/word-brush.svg" alt="brush my teeth 그림">
        <span class="sticker-word">brush</span>
      </div>
      <div class="sticker-slot">
        <img src="../assets/word-bubbles.svg" alt="bubbles 그림">
        <span class="sticker-word">bubbles</span>
      </div>
      <div class="sticker-slot">
        <img src="../assets/word-clean.svg" alt="all clean 그림">
        <span class="sticker-word">all clean</span>
      </div>
    </div>
    <div class="end-btns">
      <button class="end-btn primary">한 번 더 듣기</button>
      <button class="end-btn">부모님 화면</button>
    </div>
  </div>

  <!-- 부모 힌트 -->
  <div class="parent-hint">
    <span>아래로 내리면 부모님 화면</span>
    <svg width="12" height="12" viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 4 l4 4 l4 -4" style="fill:none; stroke:var(--t-sub); stroke-width:1.5; stroke-linecap:round"/>
    </svg>
  </div>

</body>
</html>
