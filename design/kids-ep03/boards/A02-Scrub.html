<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390">
  <title>A02 이 닦기 — Brush, Brush, Brush!</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    body { background:var(--t-bg); font-family:var(--t-body); color:var(--t-ink); width:390px; margin:0; height:844px; overflow:hidden; }
    .top-bar { height:36px; background:var(--t-bg); display:flex; align-items:center; padding:0 12px; gap:8px; }
    .top-title { font-family:var(--t-en); font-size:11px; font-weight:700; color:var(--t-ink); flex-shrink:0; letter-spacing:.02em; }
    .step-dots { display:flex; gap:5px; flex:1; justify-content:center; align-items:center; }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--t-surface); opacity:.28; }
    .dot.on { opacity:1; width:18px; border-radius:4px; }
    .listen-sw { display:flex; align-items:center; gap:4px; flex-shrink:0; }
    .sw-lbl { font-family:var(--t-kr); font-size:9px; color:var(--t-ink); opacity:.6; }
    .sw-track { width:28px; height:14px; background:var(--t-ink); border-radius:7px; opacity:.2; }
    .device { background:var(--t-surface); border-radius:24px 24px 26px 26px; border-bottom:9px solid var(--t-surface-2); margin:0 6px; padding:12px 10px 14px; }
    .screen { background:var(--t-screen); border-radius:16px; overflow:hidden; border:3px solid var(--t-surface-2); margin-bottom:10px; }
    .stage { width:100%; height:480px; overflow:hidden; line-height:0; position:relative; }
    .stage svg { display:block; width:100%; height:480px; }
    .caption { background:var(--t-screen); padding:10px 14px 12px; }
    .cap-text { font-family:var(--t-kr); font-size:14px; color:var(--t-paper); line-height:1.55; text-align:center; margin:0; }
    .cap-text .en { font-family:var(--t-en); font-size:17px; font-weight:700; color:var(--t-glow); }
    .btns { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .btn-side { background:var(--t-paper); border:none; border-bottom:5px solid var(--t-surface-2); border-radius:14px; padding:9px 6px 7px; display:flex; flex-direction:column; align-items:center; gap:4px; width:78px; cursor:pointer; }
    .btn-lbl { font-family:var(--t-kr); font-size:10px; color:var(--t-ink); text-align:center; line-height:1.3; white-space:pre-line; }
    .btn-play { background:var(--t-soft); border:none; border-bottom:6px solid var(--t-surface-2); border-radius:40px; width:84px; height:78px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; }
    .btn-time { font-family:var(--t-en); font-size:14px; font-weight:700; color:var(--t-ink); }
    .btn-total { font-family:var(--t-en); font-size:9px; color:var(--t-ink); opacity:.5; }
  </style>
</head>
<body class="t-toy">

  <div class="top-bar">
    <span class="top-title">Brush, Brush, Brush!</span>
    <div class="step-dots" aria-label="장면 2/6">
      <span class="dot"></span><span class="dot on"></span><span class="dot"></span>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="listen-sw" aria-label="그냥 듣기 꺼짐">
      <span class="sw-lbl">그냥 듣기</span>
      <div class="sw-track"></div>
    </div>
  </div>

  <div class="device">
    <div class="screen" aria-label="이 닦기 장면, 진행 중">

      <div class="stage">
        <svg viewBox="0 0 352 480" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">
          <!-- face close-up background -->
          <rect width="352" height="480" style="fill:var(--skin)"/>

          <!-- cheek blush areas -->
          <ellipse cx="64" cy="240" rx="56" ry="80" style="fill:var(--cheek);opacity:.28"/>
          <ellipse cx="288" cy="240" rx="56" ry="80" style="fill:var(--cheek);opacity:.28"/>

          <!-- dark mouth interior -->
          <rect x="40" y="190" width="272" height="130" rx="8" style="fill:var(--t-screen)"/>

          <!-- upper lip -->
          <path d="M40,190 q58,-44 136,-36 q78,-8 136,36 z" style="fill:var(--cheek);stroke:var(--ink);stroke-width:2"/>

          <!-- lower lip -->
          <path d="M40,320 q58,52 136,44 q78,8 136,-44 z" style="fill:var(--cheek);stroke:var(--ink);stroke-width:2"/>

          <!-- teeth row (6 teeth) -->
          <!-- left 3: clean (sparkle) -->
          <rect x="42" y="196" width="52" height="78" rx="6" style="fill:var(--card);stroke:var(--ink);stroke-width:1.5"/>
          <rect x="98" y="196" width="52" height="78" rx="6" style="fill:var(--card);stroke:var(--ink);stroke-width:1.5"/>
          <rect x="154" y="196" width="52" height="78" rx="6" style="fill:var(--card);stroke:var(--ink);stroke-width:1.5"/>
          <!-- right 3: germs -->
          <rect x="210" y="196" width="52" height="78" rx="6" style="fill:var(--card);stroke:var(--ink);stroke-width:1.5"/>
          <rect x="266" y="196" width="36" height="78" rx="6" style="fill:var(--card);stroke:var(--ink);stroke-width:1.5"/>
          <!-- germ spots on right teeth -->
          <circle cx="232" cy="226" r="8" style="fill:var(--t-surface);opacity:.7"/>
          <circle cx="222" cy="248" r="5" style="fill:var(--t-surface);opacity:.5"/>
          <circle cx="245" cy="250" r="6" style="fill:var(--t-surface-2);opacity:.6"/>
          <circle cx="279" cy="230" r="7" style="fill:var(--t-surface);opacity:.7"/>
          <circle cx="290" cy="254" r="5" style="fill:var(--t-surface-2);opacity:.5"/>

          <!-- sparkle stars on clean (left) teeth -->
          <!-- star at (68, 220) -->
          <path d="M68,212 l3,8 l8,0 l-6.5,5 l2.5,8 l-7,-5 l-7,5 l2.5,-8 l-6.5,-5 l8,0 z" style="fill:var(--t-glow);stroke:none"/>
          <!-- star at (124, 240) -->
          <path d="M124,232 l2.5,7 l7,0 l-5.5,4.5 l2,7 l-6,-4.5 l-6,4.5 l2,-7 l-5.5,-4.5 l7,0 z" style="fill:var(--t-glow);stroke:none"/>
          <!-- star at (180, 218) -->
          <path d="M180,210 l2.5,7 l7,0 l-5.5,4.5 l2,7 l-6,-4.5 l-6,4.5 l2,-7 l-5.5,-4.5 l7,0 z" style="fill:var(--t-glow);stroke:none"/>

          <!-- toothbrush mid-swipe across teeth -->
          <!-- handle -->
          <rect x="30" y="162" width="120" height="20" rx="10" style="fill:var(--sun);stroke:var(--ink);stroke-width:2.5"/>
          <!-- head -->
          <rect x="142" y="156" width="56" height="32" rx="8" style="fill:var(--card);stroke:var(--ink);stroke-width:2.5"/>
          <!-- bristles -->
          <g style="stroke:var(--t-glow);stroke-width:3">
            <line x1="148" y1="156" x2="148" y2="146"/>
            <line x1="157" y1="156" x2="157" y2="146"/>
            <line x1="166" y1="156" x2="166" y2="146"/>
            <line x1="175" y1="156" x2="175" y2="146"/>
            <line x1="184" y1="156" x2="184" y2="146"/>
            <line x1="193" y1="156" x2="193" y2="146"/>
          </g>

          <!-- swipe trail (motion blur effect) -->
          <path d="M30,172 q80,-12 160,0" style="fill:none;stroke:var(--t-glow);stroke-width:6;opacity:.4;stroke-dasharray:8,6"/>

          <!-- floating text "Brush, brush, brush" -->
          <text x="176" y="88" text-anchor="middle" style="font-family:var(--t-en);font-size:30px;font-weight:700;fill:var(--t-surface);stroke:var(--t-paper);stroke-width:4;paint-order:stroke">Brush,</text>
          <text x="176" y="126" text-anchor="middle" style="font-family:var(--t-en);font-size:30px;font-weight:700;fill:var(--t-surface);stroke:var(--t-paper);stroke-width:4;paint-order:stroke">brush, brush!</text>

          <!-- finger swipe hint at bottom -->
          <path d="M60,440 q120,-20 230,0" style="fill:none;stroke:var(--t-glow);stroke-width:4;opacity:.6;stroke-dasharray:10,7"/>
          <!-- Arrows showing direction -->
          <path d="M272,434 l12,0 l-6,-8 M272,434 l12,0 l-6,8" style="fill:none;stroke:var(--t-glow);stroke-width:3;opacity:.6"/>
        </svg>
      </div>

      <div class="caption">
        <p class="cap-text"><span class="en">Brush, brush, brush.</span> 친구도 같이!</p>
      </div>
    </div>

    <div class="btns">
      <button class="btn-side" aria-label="3번 이어 듣기">
        <svg width="28" height="22" viewBox="0 0 28 22" aria-hidden="true">
          <path d="M20 3 L25 8 L20 13" stroke-width="2.5" style="fill:none;stroke:var(--t-ink)"/>
          <path d="M4 17 C4 9 10 4 18 6" stroke-width="2.5" style="fill:none;stroke:var(--t-ink)"/>
          <text x="3" y="22" font-size="9" font-weight="700" style="fill:var(--t-ink);font-family:var(--t-en)">x3</text>
        </svg>
        <span class="btn-lbl">3번&#10;이어 듣기</span>
      </button>

      <button class="btn-play" aria-label="일시정지, 현재 0분 52초">
        <span class="btn-time">0:52</span>
        <span class="btn-total">/ 2:19</span>
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <rect x="3" y="2" width="5" height="16" rx="2.5" style="fill:var(--t-ink)"/>
          <rect x="12" y="2" width="5" height="16" rx="2.5" style="fill:var(--t-ink)"/>
        </svg>
      </button>

      <button class="btn-side" aria-label="조금 천천히">
        <svg width="28" height="22" viewBox="0 0 28 22" aria-hidden="true">
          <ellipse cx="14" cy="11" rx="8" ry="6" style="fill:none;stroke:var(--t-ink);stroke-width:2.5"/>
          <line x1="6" y1="11" x2="2" y2="11" stroke-width="2.5" style="stroke:var(--t-ink)"/>
          <line x1="22" y1="11" x2="26" y2="11" stroke-width="2.5" style="stroke:var(--t-ink)"/>
        </svg>
        <span class="btn-lbl">조금&#10;천천히</span>
      </button>
    </div>
  </div>

</body>
</html>
