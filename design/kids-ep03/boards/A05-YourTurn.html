<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390">
  <title>A05 친구 차례 — Brush, Brush, Brush!</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    body { background:var(--t-bg); font-family:var(--t-body); color:var(--t-ink); width:390px; margin:0; height:844px; overflow:hidden; }
    .top-bar { height:36px; background:var(--t-bg); display:flex; align-items:center; padding:0 12px; gap:8px; }
    .top-title { font-family:var(--t-en); font-size:11px; font-weight:700; color:var(--t-ink); flex-shrink:0; letter-spacing:.02em; }
    .step-dots { display:flex; gap:5px; flex:1; justify-content:center; align-items:center; }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--t-surface); opacity:.28; }
    .dot.on { opacity:1; width:18px; border-radius:4px; }
    .listen-sw { display:flex; align-items:center; gap:4px; flex-shrink:0; }
    .sw-lbl { font-family:var(--t-kr); font-size:9px; color:var(--t-ink); opacity:.6; }
    .sw-track { width:28px; height:14px; background:var(--t-ink); border-radius:7px; opacity:.2; }
    .device { background:var(--t-surface); border-radius:24px 24px 26px 26px; border-bottom:9px solid var(--t-surface-2); margin:0 6px; padding:12px 10px 14px; }
    .screen { background:var(--t-screen); border-radius:16px; overflow:hidden; border:3px solid var(--t-surface-2); margin-bottom:10px; }
    @keyframes bezel-blink { 0%,100%{ border-color:var(--t-glow); } 50%{ border-color:var(--t-surface-2); } }
    .screen.waiting { border-color:var(--t-glow); animation:bezel-blink 1.8s ease-in-out infinite; }
    .stage { width:100%; height:480px; overflow:hidden; line-height:0; position:relative; }
    .stage svg { display:block; width:100%; height:480px; }
    .caption { background:var(--t-screen); padding:10px 14px 8px; }
    .cap-text { font-family:var(--t-kr); font-size:14px; color:var(--t-paper); line-height:1.55; text-align:center; margin:0; }
    .cap-text .en { font-family:var(--t-en); font-size:17px; font-weight:700; color:var(--t-glow); }
    .wait-bar { display:flex; align-items:center; justify-content:center; gap:8px; padding:5px 0 6px; }
    .wait-lbl { font-family:var(--t-kr); font-size:11px; color:var(--t-glow); }
    .timer-ring { width:22px; height:22px; flex-shrink:0; }
    .btns { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .btn-side { background:var(--t-paper); border:none; border-bottom:5px solid var(--t-surface-2); border-radius:14px; padding:9px 6px 7px; display:flex; flex-direction:column; align-items:center; gap:4px; width:78px; cursor:pointer; }
    .btn-lbl { font-family:var(--t-kr); font-size:10px; color:var(--t-ink); text-align:center; line-height:1.3; white-space:pre-line; }
    .btn-play { background:var(--t-soft); border:none; border-bottom:6px solid var(--t-surface-2); border-radius:40px; width:84px; height:78px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; }
    .btn-time { font-family:var(--t-en); font-size:14px; font-weight:700; color:var(--t-ink); }
    .btn-total { font-family:var(--t-en); font-size:9px; color:var(--t-ink); opacity:.5; }
    .ws-tag { position:absolute; top:10px; right:10px; background:var(--t-soft); border-radius:8px; padding:4px 9px; font-family:var(--t-kr); font-size:11px; color:var(--t-ink); border:2px solid var(--sun); z-index:5; line-height:1; }
  </style>
</head>
<body class="t-toy">

  <div class="top-bar">
    <span class="top-title">Brush, Brush, Brush!</span>
    <div class="step-dots" aria-label="장면 5/6">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="dot"></span><span class="dot on"></span><span class="dot"></span>
    </div>
    <div class="listen-sw" aria-label="그냥 듣기 꺼짐">
      <span class="sw-lbl">그냥 듣기</span>
      <div class="sw-track"></div>
    </div>
  </div>

  <div class="device">
    <div class="screen waiting" aria-label="친구 차례 장면, 따라 말하기 기다리는 중">

      <div class="stage">
        <div class="ws-tag">학습지 3번</div>

        <svg viewBox="0 0 352 480" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">
          <!-- background -->
          <rect width="352" height="480" style="fill:var(--t-paper)"/>
          <!-- subtle floor line -->
          <rect x="0" y="380" width="352" height="100" style="fill:var(--t-soft)"/>

          <!-- Lily (right side, smaller, pointing at child) -->
          <!-- shirt/body -->
          <path d="M236,322 q52,24 88,0 l4,18 q-42,12-96,0 z" style="fill:var(--t-screen)"/>
          <!-- head -->
          <circle cx="276" cy="268" r="48" style="fill:var(--skin);stroke:var(--ink);stroke-width:2.5"/>
          <!-- hair -->
          <path d="M232,254 q6-50 44-50 q38,0 44,50 q-18-18-44-20 q-26,2-44,20 z" style="fill:var(--hair)"/>
          <!-- pigtails -->
          <path d="M232,240 q-24,6-18,36 q12-6 14-22" style="fill:var(--hair)"/>
          <path d="M320,240 q24,6 18,36 q-12-6-14-22" style="fill:var(--hair)"/>
          <!-- hair ties -->
          <circle cx="234" cy="234" r="6" style="fill:var(--sun);stroke:var(--ink);stroke-width:1.5"/>
          <circle cx="318" cy="234" r="6" style="fill:var(--sun);stroke:var(--ink);stroke-width:1.5"/>
          <!-- eyes -->
          <circle cx="262" cy="268" r="5" style="fill:var(--ink)"/>
          <circle cx="290" cy="268" r="5" style="fill:var(--ink)"/>
          <circle cx="264" cy="265" r="2" style="fill:var(--card)"/>
          <circle cx="292" cy="265" r="2" style="fill:var(--card)"/>
          <!-- cheeks -->
          <ellipse cx="248" cy="282" rx="9" ry="5" style="fill:var(--cheek);opacity:.65"/>
          <ellipse cx="304" cy="282" rx="9" ry="5" style="fill:var(--cheek);opacity:.65"/>
          <!-- friendly smile -->
          <path d="M260,290 q16,16 32,0" style="fill:none;stroke:var(--ink);stroke-width:2.5"/>
          <!-- arm pointing left -->
          <path d="M236,310 q-30,-10 -60,-4" style="fill:none;stroke:var(--skin);stroke-width:14"/>
          <path d="M236,310 q-30,-10 -60,-4" style="fill:none;stroke:var(--ink);stroke-width:2"/>
          <!-- pointing hand -->
          <path d="M176,302 q-10,0 -14,8 q4,2 8,0 q-2,6 2,8 q4,-2 6,-6 q0,6 4,8 q4,-2 4,-8 q4,4 6,0 q-2,-6,-6,-10 z" style="fill:var(--skin);stroke:var(--ink);stroke-width:1.5"/>

          <!-- speech bubble from Lily (above her head, clear of button) -->
          <rect x="176" y="86" width="150" height="64" rx="14" style="fill:var(--t-soft);stroke:var(--sun);stroke-width:2"/>
          <path d="M252,150 l-10,22 l16,0 z" style="fill:var(--t-soft);stroke:var(--sun);stroke-width:2"/>
          <text x="251" y="112" text-anchor="middle" style="font-family:var(--t-kr);font-size:12px;fill:var(--t-ink)">따라 해 봐!</text>
          <text x="251" y="138" text-anchor="middle" style="font-family:var(--t-en);font-size:19px;font-weight:700;fill:var(--t-surface)">Bubbles.</text>

          <!-- BIG "말했어요" BUTTON (center-left) -->
          <!-- outer pulse ring -->
          <circle cx="126" cy="200" r="92" style="fill:none;stroke:var(--t-glow);stroke-width:2.5;opacity:.35">
            <animate attributeName="r" values="86;98;86" dur="2s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values=".5;.1;.5" dur="2s" repeatCount="indefinite"/>
          </circle>
          <!-- button shadow (pressed edge) -->
          <circle cx="126" cy="207" r="80" style="fill:var(--t-surface-2)"/>
          <!-- button face -->
          <circle cx="126" cy="200" r="80" style="fill:var(--t-surface)"/>
          <!-- button text -->
          <text x="126" y="190" text-anchor="middle" style="font-family:var(--t-kr);font-size:20px;fill:var(--t-paper)">말했어요!</text>
          <text x="126" y="216" text-anchor="middle" style="font-family:var(--t-en);font-size:13px;fill:var(--t-glow)">Bubbles</text>

          <!-- sticker board (bottom) -->
          <rect x="12" y="396" width="328" height="72" rx="16" style="fill:var(--dog);stroke:var(--hair);stroke-width:2"/>
          <!-- slot 1: filled (brush my teeth sticker) -->
          <rect x="20" y="404" width="94" height="56" rx="12" style="fill:var(--sun);stroke:var(--ink);stroke-width:2"/>
          <image href="../assets/word-brush.svg" x="26" y="408" width="82" height="48"/>
          <!-- slot 2: being filled (bubbles sticker flying in from above) -->
          <rect x="126" y="404" width="94" height="56" rx="12" style="fill:var(--t-soft);stroke:var(--t-glow);stroke-width:2.5;stroke-dasharray:6,4"/>
          <!-- sticker "in flight" — offset upward -->
          <g opacity=".88">
            <rect x="130" y="358" width="86" height="52" rx="10" style="fill:var(--card);stroke:var(--t-glow);stroke-width:2"/>
            <image href="../assets/word-bubbles.svg" x="134" y="362" width="78" height="44"/>
          </g>
          <!-- arrow showing sticker moving down -->
          <line x1="173" y1="408" x2="173" y2="400" stroke-width="2" style="stroke:var(--t-glow)"/>
          <path d="M168,408 l5,8 l5,-8" style="fill:var(--t-glow);stroke:none"/>
          <!-- slot 3: empty -->
          <rect x="232" y="404" width="94" height="56" rx="12" style="fill:var(--t-paper);stroke:var(--t-soft);stroke-width:2"/>
          <text x="279" y="436" text-anchor="middle" style="font-family:var(--t-kr);font-size:11px;fill:var(--t-ink);opacity:.4">?</text>
        </svg>
      </div>

      <div class="caption">
        <p class="cap-text">이제 친구 차례야! 내가 말하면 따라 해 봐.</p>
        <div class="wait-bar">
          <span class="wait-lbl">릴리가 기다려요</span>
          <svg class="timer-ring" viewBox="0 0 22 22" aria-hidden="true">
            <circle cx="11" cy="11" r="8" style="fill:none;stroke:var(--t-screen);stroke-width:3"/>
            <circle cx="11" cy="11" r="8" style="fill:none;stroke:var(--t-glow);stroke-width:3;stroke-dasharray:20 30;transform:rotate(-90deg);transform-origin:11px 11px"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="btns">
      <button class="btn-side" aria-label="3번 이어 듣기">
        <svg width="28" height="22" viewBox="0 0 28 22" aria-hidden="true">
          <path d="M20 3 L25 8 L20 13" stroke-width="2.5" style="fill:none;stroke:var(--t-ink)"/>
          <path d="M4 17 C4 9 10 4 18 6" stroke-width="2.5" style="fill:none;stroke:var(--t-ink)"/>
          <text x="3" y="22" font-size="9" font-weight="700" style="fill:var(--t-ink);font-family:var(--t-en)">x3</text>
        </svg>
        <span class="btn-lbl">3번&#10;이어 듣기</span>
      </button>

      <button class="btn-play" aria-label="재생, 현재 1분 48초">
        <span class="btn-time">1:48</span>
        <span class="btn-total">/ 2:19</span>
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <polygon points="5,3 17,10 5,17" style="fill:var(--t-ink)"/>
        </svg>
      </button>

      <button class="btn-side" aria-label="조금 천천히">
        <svg width="28" height="22" viewBox="0 0 28 22" aria-hidden="true">
          <ellipse cx="14" cy="11" rx="8" ry="6" style="fill:none;stroke:var(--t-ink);stroke-width:2.5"/>
          <line x1="6" y1="11" x2="2" y2="11" stroke-width="2.5" style="stroke:var(--t-ink)"/>
          <line x1="22" y1="11" x2="26" y2="11" stroke-width="2.5" style="stroke:var(--t-ink)"/>
        </svg>
        <span class="btn-lbl">조금&#10;천천히</span>
      </button>
    </div>
  </div>

</body>
</html>
