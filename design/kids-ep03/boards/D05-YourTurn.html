<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390">
  <title>D05 — 친구 차례</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    body { width: 390px; max-width: 390px; min-height: 844px; max-height: 844px; overflow: hidden; margin: 0 auto; background: var(--t-bg); font-family: var(--t-kr); }

    .top-bar { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--t-bg); }
    .ep-title { font-family: var(--t-en); font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.72); letter-spacing: 0.01em; }
    .progress-dots { display: flex; gap: 5px; align-items: center; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.28); }
    .dot.active { width: 14px; height: 14px; background: var(--t-accent); }
    .dot.done { background: rgba(255,255,255,0.55); }
    .skip-wrap { display: flex; align-items: center; gap: 5px; font-size: 11px; font-family: var(--t-kr); color: rgba(255,255,255,0.6); }
    .track { width: 34px; height: 18px; background: rgba(255,255,255,0.18); border-radius: 9px; position: relative; }
    .thumb { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,0.45); position: absolute; top: 2px; left: 2px; }

    .stage { width: 390px; height: 636px; overflow: hidden; background: var(--t-bg); position: relative; }

    .caption-strip { background: var(--t-surface); padding: 12px 20px 14px; height: 88px; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
    .wait-tag { display: inline-flex; align-items: center; gap: 6px; background: var(--t-soft); border-radius: 20px; padding: 3px 10px 3px 7px; font-size: 12px; color: var(--t-bg); width: fit-content; }
    .caption-line { font-family: var(--t-kr); font-size: 20px; color: var(--t-ink); line-height: 1.4; }
    .caption-line .en { font-family: var(--t-en); color: var(--t-bg); font-weight: 700; }

    .parent-ctrl { height: 68px; background: var(--t-surface); border-top: 1.5px solid var(--t-line); display: flex; align-items: center; padding: 0 14px; gap: 8px; }
    .pp-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--t-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .track-wrap { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .audio-bar { height: 4px; background: var(--t-line); border-radius: 2px; overflow: hidden; }
    .audio-fill { height: 100%; background: var(--t-bg); border-radius: 2px; }
    .audio-time { font-family: var(--t-en); font-size: 11px; color: var(--t-sub); display: flex; justify-content: space-between; }
    .ctrl-btns { display: flex; gap: 5px; }
    .ctrl-btn { font-family: var(--t-kr); font-size: 10px; color: var(--t-sub); background: var(--t-soft); border-radius: 8px; padding: 5px 9px; white-space: nowrap; }

    @keyframes countdown5s { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 44; } }
    .timer-arc { animation: countdown5s 5s linear forwards; transform-origin: 9px 9px; transform: rotate(-90deg); }

    @keyframes sticker-fly { 0% { transform: translateX(80px) translateY(-60px) rotate(20deg) scale(0.5); opacity: 0; } 100% { transform: translateX(0) translateY(0) rotate(0deg) scale(1); opacity: 1; } }
    .sticker-fly { animation: sticker-fly 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards; }

    /* Big say button */
    .say-btn {
      position: absolute;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: var(--t-accent);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      left: 50%; transform: translateX(-50%);
      top: 306px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.22), 0 0 0 10px rgba(255,212,0,0.2);
    }
    .say-btn-text { font-family: var(--t-kr); font-size: 24px; color: var(--t-ink); font-weight: 400; line-height: 1.2; text-align: center; }
    .say-btn-sub { font-family: var(--t-kr); font-size: 13px; color: var(--t-ink); opacity: 0.6; margin-top: 4px; }

    /* Sticker row */
    .sticker-row {
      position: absolute;
      bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; align-items: center;
    }
    .sticker-slot {
      width: 72px; height: 72px; border-radius: 14px;
      border: 2.5px dashed rgba(255,255,255,0.4);
      display: flex; align-items: center; justify-content: center;
    }
    .sticker-slot.filled {
      border: 2.5px solid rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.12);
    }
    .sticker-slot.active {
      border: 2.5px solid var(--t-accent);
      background: rgba(255,212,0,0.15);
    }
    .sticker-label { font-family: var(--t-en); font-size: 9px; color: rgba(255,255,255,0.7); text-align: center; margin-top: 3px; }

    /* ws link */
    .ws-link {
      position: absolute;
      bottom: 100px; right: 16px;
      background: var(--t-surface);
      border-radius: 10px;
      padding: 6px 12px;
      font-family: var(--t-kr);
      font-size: 11px;
      color: var(--t-sub);
      display: flex; align-items: center; gap: 4px;
    }
    .ws-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--t-accent); flex-shrink: 0; }
  </style>
</head>
<body class="t-split">

  <!-- TOP BAR -->
  <div class="top-bar">
    <span class="ep-title">Brush, Brush, Brush!</span>
    <div class="progress-dots" aria-label="5/6 장면">
      <span class="dot done"></span>
      <span class="dot done"></span>
      <span class="dot done"></span>
      <span class="dot done"></span>
      <span class="dot active" aria-label="5번"></span>
      <span class="dot"></span>
    </div>
    <div class="skip-wrap">
      <span>그냥 듣기</span>
      <div class="track" role="switch" aria-checked="false" aria-label="그냥 듣기">
        <div class="thumb"></div>
      </div>
    </div>
  </div>

  <!-- STAGE -->
  <div class="stage" aria-label="친구 차례 장면">
    <svg width="390" height="636" viewBox="0 0 390 636" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">
      <!-- Background -->
      <rect width="390" height="636" style="fill: var(--t-bg)"/>

      <!-- Lily (left side, smaller, saying "Bubbles.") -->
      <!-- Lily shirt -->
      <path d="M-10 560 q4 -68 34 -92 h60 q30 24 34 92 z" style="fill: var(--sky)"/>
      <!-- Lily head -->
      <circle cx="90" cy="232" r="74" style="fill: var(--skin); stroke: var(--ink); stroke-width: 2.5"/>
      <!-- Hair -->
      <path d="M18 222 q8 -74 72 -76 q64 2 72 76 q-36 -32 -72 -34 q-36 2 -72 34 z" style="fill: var(--hair)"/>
      <!-- Left pigtail -->
      <path d="M18 210 q-38 18 -30 72 q22 -16 28 -46" style="fill: var(--hair)"/>
      <circle cx="-6" cy="278" r="12" style="fill: var(--sun); stroke: var(--ink); stroke-width: 1.5"/>
      <!-- Right pigtail -->
      <path d="M162 210 q38 18 30 72 q-22 -16 -28 -46" style="fill: var(--hair)"/>
      <circle cx="186" cy="278" r="12" style="fill: var(--sun); stroke: var(--ink); stroke-width: 1.5"/>
      <!-- Eyes -->
      <circle cx="72" cy="236" r="12" style="fill: var(--card)"/>
      <circle cx="108" cy="236" r="12" style="fill: var(--card)"/>
      <circle cx="74" cy="238" r="7" style="fill: var(--ink)"/>
      <circle cx="110" cy="238" r="7" style="fill: var(--ink)"/>
      <circle cx="76" cy="235" r="3" style="fill: var(--card)"/>
      <circle cx="112" cy="235" r="3" style="fill: var(--card)"/>
      <!-- Cheeks -->
      <ellipse cx="58" cy="254" rx="16" ry="9" style="fill: var(--cheek); fill-opacity: 0.7"/>
      <ellipse cx="122" cy="254" rx="16" ry="9" style="fill: var(--cheek); fill-opacity: 0.7"/>
      <!-- Smile -->
      <path d="M72 264 q18 18 36 0" style="fill: none; stroke: var(--ink); stroke-width: 2.5"/>

      <!-- Speech bubble from Lily -->
      <rect x="170" y="168" width="186" height="72" rx="18" style="fill: var(--card); stroke: var(--card); stroke-width: 2"/>
      <!-- Bubble tail -->
      <path d="M182 226 L162 252 L200 232 Z" style="fill: var(--card)"/>
      <!-- "Bubbles." text in bubble -->
      <text x="263" y="196" text-anchor="middle" style="font-family: var(--t-en); font-size: 28px; font-weight: 700; fill: var(--t-bg);">Bubbles.</text>
      <text x="263" y="224" text-anchor="middle" style="font-family: var(--t-kr); font-size: 15px; fill: var(--t-sub);">따라 해 봐!</text>
    </svg>

    <!-- Big "말했어요" button (YELLOW = touch target) -->
    <div class="say-btn" role="button" aria-label="말했어요 버튼 - 따라 말하면 누르세요">
      <span class="say-btn-text">말했어요</span>
      <span class="say-btn-sub">눌러요</span>
    </div>

    <!-- Sticker board -->
    <div class="sticker-row" aria-label="스티커 모으기">
      <!-- Slot 1: filled (brush my teeth) -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
        <div class="sticker-slot filled">
          <img src="../assets/word-brush.svg" alt="brush my teeth 스티커" width="44" height="40" style="object-fit: contain;">
        </div>
        <span class="sticker-label">brush my<br>teeth</span>
      </div>
      <!-- Slot 2: active (bubbles - being filled now, sticker flying in) -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
        <div class="sticker-slot active">
          <img src="../assets/word-bubbles.svg" alt="bubbles 스티커" width="44" height="40" style="object-fit: contain;" class="sticker-fly">
        </div>
        <span class="sticker-label" style="color: var(--t-accent);">bubbles</span>
      </div>
      <!-- Slot 3: empty (all clean) -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
        <div class="sticker-slot">
          <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
            <circle cx="14" cy="14" r="10" style="fill: none; stroke: rgba(255,255,255,0.35); stroke-width: 2; stroke-dasharray: 5 4"/>
          </svg>
        </div>
        <span class="sticker-label">all clean</span>
      </div>
    </div>

    <!-- Worksheet 3 link -->
    <div class="ws-link" aria-label="학습지 3번과 연결됩니다">
      <span class="ws-dot" aria-hidden="true"></span>
      학습지 3번에도 붙여요
    </div>
  </div>

  <!-- CAPTION STRIP -->
  <div class="caption-strip">
    <div class="wait-tag">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <circle cx="9" cy="9" r="7" style="fill: none; stroke: var(--t-bg); stroke-width: 2; stroke-opacity: 0.35"/>
        <circle class="timer-arc" cx="9" cy="9" r="7" style="fill: none; stroke: var(--t-bg); stroke-width: 2; stroke-dasharray: 44 44;"/>
      </svg>
      릴리가 기다려요
    </div>
    <div class="caption-line">내가 말하면 따라 해 봐.</div>
  </div>

  <!-- PARENT CONTROLS -->
  <div class="parent-ctrl" aria-label="재생 조작">
    <div class="pp-btn" aria-label="일시정지">
      <svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true">
        <rect x="1" y="1" width="4" height="16" rx="2" style="fill: var(--card)"/>
        <rect x="9" y="1" width="4" height="16" rx="2" style="fill: var(--card)"/>
      </svg>
    </div>
    <div class="track-wrap">
      <div class="audio-bar"><div class="audio-fill" style="width: 77%"></div></div>
      <div class="audio-time"><span>1:48</span><span>2:19</span></div>
    </div>
    <div class="ctrl-btns">
      <div class="ctrl-btn">3번 이어 듣기</div>
      <div class="ctrl-btn">조금 천천히</div>
    </div>
  </div>

</body>
</html>
