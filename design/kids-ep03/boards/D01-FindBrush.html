<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390">
  <title>D01 — 칫솔 찾기</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    body { width: 390px; max-width: 390px; min-height: 844px; max-height: 844px; overflow: hidden; margin: 0 auto; background: var(--t-bg); font-family: var(--t-kr); }

    .top-bar { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--t-bg); }
    .ep-title { font-family: var(--t-en); font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.72); letter-spacing: 0.01em; }
    .progress-dots { display: flex; gap: 5px; align-items: center; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.28); }
    .dot.active { width: 14px; height: 14px; background: var(--t-accent); }
    .skip-wrap { display: flex; align-items: center; gap: 5px; font-size: 11px; font-family: var(--t-kr); color: rgba(255,255,255,0.6); }
    .track { width: 34px; height: 18px; background: rgba(255,255,255,0.18); border-radius: 9px; position: relative; }
    .thumb { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,0.45); position: absolute; top: 2px; left: 2px; }

    .stage { width: 390px; height: 612px; overflow: hidden; background: var(--t-bg); position: relative; }

    .caption-strip { background: var(--t-surface); padding: 12px 20px 14px; height: 88px; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
    .wait-tag { display: inline-flex; align-items: center; gap: 6px; background: var(--t-soft); border-radius: 20px; padding: 3px 10px 3px 7px; font-size: 12px; color: var(--t-bg); width: fit-content; }
    .caption-line { font-family: var(--t-kr); font-size: 20px; color: var(--t-ink); line-height: 1.4; }
    .caption-line .en { font-family: var(--t-en); color: var(--t-bg); font-weight: 700; }

    .parent-ctrl { height: 68px; background: var(--t-surface); border-top: 1.5px solid var(--t-line); display: flex; align-items: center; padding: 0 14px; gap: 8px; }
    .pp-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--t-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .track-wrap { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .audio-bar { height: 4px; background: var(--t-line); border-radius: 2px; overflow: hidden; }
    .audio-fill { height: 100%; background: var(--t-bg); border-radius: 2px; }
    .audio-time { font-family: var(--t-en); font-size: 11px; color: var(--t-sub); display: flex; justify-content: space-between; }
    .ctrl-btns { display: flex; gap: 5px; }
    .ctrl-btn { font-family: var(--t-kr); font-size: 10px; color: var(--t-sub); background: var(--t-soft); border-radius: 8px; padding: 5px 9px; white-space: nowrap; }

    .parent-hint { height: 24px; background: var(--t-surface); display: flex; align-items: center; justify-content: center; gap: 4px; font-family: var(--t-kr); font-size: 11px; color: var(--t-sub); border-top: 1px solid var(--t-line); }

    @keyframes countdown5s { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 44; } }
    @keyframes pulse-ring { 0% { transform: scale(0.85); opacity: 0.9; } 100% { transform: scale(1.8); opacity: 0; } }
    .timer-arc { animation: countdown5s 5s linear forwards; transform-origin: 9px 9px; transform: rotate(-90deg); }
    .hint-ring { position: absolute; width: 72px; height: 72px; border-radius: 50%; border: 4px solid var(--t-accent); animation: pulse-ring 1.6s ease-out infinite; pointer-events: none; }

    .ws-tag { position: absolute; bottom: 16px; left: 16px; background: var(--t-surface); border-radius: 10px; padding: 6px 12px; font-family: var(--t-kr); font-size: 12px; color: var(--t-ink); display: flex; align-items: center; gap: 5px; }
    .ws-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--t-accent); flex-shrink: 0; }
  </style>
</head>
<body class="t-split">

  <!-- TOP BAR -->
  <div class="top-bar">
    <span class="ep-title">Brush, Brush, Brush!</span>
    <div class="progress-dots" aria-label="1/6 장면">
      <span class="dot active" aria-label="1번"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <div class="skip-wrap">
      <span>그냥 듣기</span>
      <div class="track" role="switch" aria-checked="false" aria-label="그냥 듣기">
        <div class="thumb"></div>
      </div>
    </div>
  </div>

  <!-- STAGE -->
  <div class="stage" aria-label="칫솔 찾기 장면">
    <svg width="390" height="612" viewBox="0 0 390 612" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">

      <!-- Background -->
      <rect width="390" height="612" style="fill: var(--t-bg)"/>

      <!-- Bathroom wall tiles (subtle grid) -->
      <g style="stroke: var(--card); stroke-opacity: 0.1; stroke-width: 1; fill: none;">
        <line x1="0" y1="60" x2="390" y2="60"/>
        <line x1="0" y1="120" x2="390" y2="120"/>
        <line x1="0" y1="180" x2="390" y2="180"/>
        <line x1="0" y1="240" x2="390" y2="240"/>
        <line x1="0" y1="300" x2="390" y2="300"/>
        <line x1="0" y1="360" x2="390" y2="360"/>
        <line x1="65" y1="0" x2="65" y2="380"/>
        <line x1="130" y1="0" x2="130" y2="380"/>
        <line x1="195" y1="0" x2="195" y2="380"/>
        <line x1="260" y1="0" x2="260" y2="380"/>
        <line x1="325" y1="0" x2="325" y2="380"/>
      </g>

      <!-- Floor -->
      <rect x="0" y="400" width="390" height="212" style="fill: var(--sky); fill-opacity: 0.25"/>
      <!-- Floor tiles -->
      <g style="stroke: var(--card); stroke-opacity: 0.12; stroke-width: 1; fill: none;">
        <line x1="0" y1="460" x2="390" y2="460"/>
        <line x1="0" y1="530" x2="390" y2="530"/>
        <line x1="78" y1="400" x2="78" y2="612"/>
        <line x1="156" y1="400" x2="156" y2="612"/>
        <line x1="234" y1="400" x2="234" y2="612"/>
        <line x1="312" y1="400" x2="312" y2="612"/>
      </g>

      <!-- Counter shelf -->
      <rect x="0" y="388" width="390" height="20" rx="0" style="fill: var(--sky)"/>
      <rect x="0" y="388" width="390" height="8" style="fill: var(--card); fill-opacity: 0.4"/>

      <!-- Sink basin -->
      <ellipse cx="190" cy="400" rx="88" ry="24" style="fill: var(--card); stroke: var(--sky); stroke-width: 2"/>
      <ellipse cx="190" cy="396" rx="66" ry="16" style="fill: var(--sky); fill-opacity: 0.5"/>
      <!-- Faucet -->
      <rect x="180" y="358" width="20" height="34" rx="8" style="fill: var(--card); stroke: var(--sky); stroke-width: 1.5"/>
      <rect x="168" y="355" width="44" height="10" rx="5" style="fill: var(--card); stroke: var(--sky); stroke-width: 1.5"/>

      <!-- Cup (right side of counter) -->
      <path d="M306 378 L312 406 L340 406 L346 378 Z" style="fill: var(--sky); stroke: var(--card); stroke-opacity: 0.5; stroke-width: 1.5"/>
      <rect x="304" y="373" width="44" height="8" rx="4" style="fill: var(--sky)"/>

      <!-- Mirror on wall -->
      <rect x="108" y="40" width="174" height="134" rx="16" style="fill: var(--sky)"/>
      <rect x="116" y="48" width="158" height="118" rx="12" style="fill: var(--card); fill-opacity: 0.75"/>
      <line x1="132" y1="62" x2="158" y2="86" style="stroke: var(--sky); stroke-width: 2.5; stroke-opacity: 0.7"/>
      <line x1="132" y1="80" x2="168" y2="98" style="stroke: var(--sky); stroke-width: 2.5; stroke-opacity: 0.7"/>

      <!-- Lily (left, looking confused, searching) -->
      <!-- Lily shirt/body -->
      <path d="M30 612 q6 -100 44 -128 h72 q38 28 44 128 z" style="fill: var(--sky)"/>
      <!-- Lily head -->
      <circle cx="116" cy="330" r="60" style="fill: var(--skin); stroke: var(--ink); stroke-width: 2.5"/>
      <!-- Hair top -->
      <path d="M58 320 q8 -62 58 -64 q50 2 58 64 q-30 -28 -58 -30 q-28 2 -58 30 z" style="fill: var(--hair)"/>
      <!-- Left pigtail -->
      <path d="M60 308 q-30 16 -24 54 q18 -12 22 -34" style="fill: var(--hair)"/>
      <circle cx="40" cy="358" r="9" style="fill: var(--sun); stroke: var(--ink); stroke-width: 1.5"/>
      <!-- Right pigtail -->
      <path d="M172 308 q30 16 24 54 q-18 -12 -22 -34" style="fill: var(--hair)"/>
      <circle cx="192" cy="358" r="9" style="fill: var(--sun); stroke: var(--ink); stroke-width: 1.5"/>
      <!-- Eyes (wide, searching) -->
      <circle cx="99" cy="334" r="10" style="fill: var(--card)"/>
      <circle cx="133" cy="334" r="10" style="fill: var(--card)"/>
      <circle cx="101" cy="335" r="6" style="fill: var(--ink)"/>
      <circle cx="135" cy="335" r="6" style="fill: var(--ink)"/>
      <circle cx="102" cy="333" r="2.5" style="fill: var(--card)"/>
      <circle cx="136" cy="333" r="2.5" style="fill: var(--card)"/>
      <!-- Cheeks -->
      <ellipse cx="85" cy="352" rx="13" ry="8" style="fill: var(--cheek); fill-opacity: 0.7"/>
      <ellipse cx="147" cy="352" rx="13" ry="8" style="fill: var(--cheek); fill-opacity: 0.7"/>
      <!-- Puzzled mouth -->
      <path d="M100 362 q16 8 26 0" style="fill: none; stroke: var(--ink); stroke-width: 2.5"/>
      <!-- Question mark -->
      <text x="160" y="308" style="font-family: var(--t-kr); font-size: 36px; fill: var(--t-accent);">?</text>

      <!-- Biscuit (center-right, holding toothbrush) -->
      <!-- Biscuit body -->
      <ellipse cx="286" cy="498" rx="78" ry="48" style="fill: var(--dog); stroke: var(--ink); stroke-width: 2.5"/>
      <!-- Biscuit tail -->
      <path d="M358 486 q36 -24 32 -52" style="fill: none; stroke: var(--dog); stroke-width: 14; stroke-linecap: round"/>
      <path d="M358 486 q36 -24 32 -52" style="fill: none; stroke: var(--ink); stroke-width: 2.5"/>
      <!-- Biscuit head -->
      <circle cx="286" cy="376" r="60" style="fill: var(--dog); stroke: var(--ink); stroke-width: 2.5"/>
      <!-- Biscuit ears -->
      <ellipse cx="242" cy="354" rx="24" ry="42" style="fill: var(--hair); stroke: var(--ink); stroke-width: 2"/>
      <ellipse cx="330" cy="354" rx="24" ry="42" style="fill: var(--hair); stroke: var(--ink); stroke-width: 2"/>
      <!-- Snout -->
      <ellipse cx="286" cy="398" rx="26" ry="18" style="fill: var(--skin); stroke: var(--ink); stroke-width: 2"/>
      <!-- Nose -->
      <ellipse cx="286" cy="391" rx="9" ry="7" style="fill: var(--ink)"/>
      <ellipse cx="284" cy="389" rx="3" ry="2" style="fill: var(--card); fill-opacity: 0.6"/>
      <!-- Eyes -->
      <circle cx="264" cy="368" r="8" style="fill: var(--ink)"/>
      <circle cx="308" cy="368" r="8" style="fill: var(--ink)"/>
      <circle cx="266" cy="366" r="3" style="fill: var(--card)"/>
      <circle cx="310" cy="366" r="3" style="fill: var(--card)"/>
      <!-- Brow (happy/mischievous) -->
      <path d="M255 356 q9 -8 20 -4" style="fill: none; stroke: var(--ink); stroke-width: 2.5"/>
      <path d="M315 354 q9 4 16 9" style="fill: none; stroke: var(--ink); stroke-width: 2.5"/>
      <!-- Cheeks -->
      <ellipse cx="254" cy="384" rx="11" ry="7" style="fill: var(--cheek); fill-opacity: 0.6"/>
      <ellipse cx="318" cy="384" rx="11" ry="7" style="fill: var(--cheek); fill-opacity: 0.6"/>
      <!-- Mouth open, holding toothbrush -->
      <path d="M268 408 q18 14 36 0" style="fill: none; stroke: var(--ink); stroke-width: 2.5"/>

      <!-- Toothbrush peeking from Biscuit's mouth (yellow handle = TOUCHABLE) -->
      <!-- Handle -->
      <rect x="268" y="410" width="12" height="58" rx="6" style="fill: var(--t-accent); stroke: var(--ink); stroke-width: 2"/>
      <!-- Neck -->
      <rect x="265" y="402" width="18" height="16" rx="5" style="fill: var(--card); stroke: var(--ink); stroke-width: 2"/>
      <!-- Head with bristles (partially under snout) -->
      <rect x="256" y="390" width="34" height="20" rx="6" style="fill: var(--card); stroke: var(--ink); stroke-width: 2"/>
      <g style="stroke: var(--t-bg); stroke-width: 2; stroke-linecap: round">
        <line x1="263" y1="392" x2="263" y2="400"/>
        <line x1="270" y1="392" x2="270" y2="400"/>
        <line x1="277" y1="392" x2="277" y2="400"/>
        <line x1="284" y1="392" x2="284" y2="400"/>
      </g>

      <!-- Biscuit front paws on counter -->
      <ellipse cx="230" cy="466" rx="26" ry="18" style="fill: var(--dog); stroke: var(--ink); stroke-width: 2"/>
      <ellipse cx="342" cy="466" rx="26" ry="18" style="fill: var(--dog); stroke: var(--ink); stroke-width: 2"/>
      <!-- Paw toes -->
      <g style="fill: var(--dog); stroke: var(--ink); stroke-width: 1.5">
        <circle cx="220" cy="462" r="5"/><circle cx="230" cy="459" r="5"/><circle cx="240" cy="462" r="5"/>
        <circle cx="332" cy="462" r="5"/><circle cx="342" cy="459" r="5"/><circle cx="352" cy="462" r="5"/>
      </g>
    </svg>

    <!-- Hint ring near toothbrush -->
    <div class="hint-ring" style="top: 398px; left: 252px;" aria-hidden="true"></div>

    <!-- Worksheet tag -->
    <div class="ws-tag">
      <span class="ws-dot" aria-hidden="true"></span>
      학습지 1번
    </div>
  </div>

  <!-- CAPTION STRIP -->
  <div class="caption-strip">
    <div class="wait-tag">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <circle cx="9" cy="9" r="7" style="fill: none; stroke: var(--t-bg); stroke-width: 2; stroke-opacity: 0.35"/>
        <circle class="timer-arc" cx="9" cy="9" r="7" style="fill: none; stroke: var(--t-bg); stroke-width: 2; stroke-dasharray: 44 44;"/>
      </svg>
      릴리가 기다려요
    </div>
    <div class="caption-line">칫솔이 어디 있지? 찾아볼까?</div>
  </div>

  <!-- PARENT CONTROLS -->
  <div class="parent-ctrl" aria-label="재생 조작">
    <div class="pp-btn" aria-label="일시정지">
      <svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true">
        <rect x="1" y="1" width="4" height="16" rx="2" style="fill: var(--card)"/>
        <rect x="9" y="1" width="4" height="16" rx="2" style="fill: var(--card)"/>
      </svg>
    </div>
    <div class="track-wrap">
      <div class="audio-bar"><div class="audio-fill" style="width: 22%"></div></div>
      <div class="audio-time"><span>0:31</span><span>2:19</span></div>
    </div>
    <div class="ctrl-btns">
      <div class="ctrl-btn">3번 이어 듣기</div>
      <div class="ctrl-btn">조금 천천히</div>
    </div>
  </div>

  <!-- PARENT HINT -->
  <div class="parent-hint">
    아래로 내리면 부모님 화면
    <svg width="12" height="8" viewBox="0 0 12 8" aria-hidden="true">
      <path d="M1 1 L6 7 L11 1" style="fill: none; stroke: var(--t-sub); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"/>
    </svg>
  </div>

</body>
</html>
