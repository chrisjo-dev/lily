<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390">
  <title>A04 반짝 — Brush, Brush, Brush!</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    body { background:var(--t-bg); font-family:var(--t-body); color:var(--t-ink); width:390px; margin:0; height:844px; overflow:hidden; }
    .top-bar { height:36px; background:var(--t-bg); display:flex; align-items:center; padding:0 12px; gap:8px; }
    .top-title { font-family:var(--t-en); font-size:11px; font-weight:700; color:var(--t-ink); flex-shrink:0; letter-spacing:.02em; }
    .step-dots { display:flex; gap:5px; flex:1; justify-content:center; align-items:center; }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--t-surface); opacity:.28; }
    .dot.on { opacity:1; width:18px; border-radius:4px; }
    .listen-sw { display:flex; align-items:center; gap:4px; flex-shrink:0; }
    .sw-lbl { font-family:var(--t-kr); font-size:9px; color:var(--t-ink); opacity:.6; }
    .sw-track { width:28px; height:14px; background:var(--t-ink); border-radius:7px; opacity:.2; }
    .device { background:var(--t-surface); border-radius:24px 24px 26px 26px; border-bottom:9px solid var(--t-surface-2); margin:0 6px; padding:12px 10px 14px; }
    .screen { background:var(--t-screen); border-radius:16px; overflow:hidden; border:3px solid var(--t-surface-2); margin-bottom:10px; }
    .stage { width:100%; height:480px; overflow:hidden; line-height:0; position:relative; }
    .stage svg { display:block; width:100%; height:480px; }
    .caption { background:var(--t-screen); padding:10px 14px 12px; }
    .cap-text { font-family:var(--t-kr); font-size:14px; color:var(--t-paper); line-height:1.55; text-align:center; margin:0; }
    .cap-text .en { font-family:var(--t-en); font-size:17px; font-weight:700; color:var(--t-glow); }
    .btns { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .btn-side { background:var(--t-paper); border:none; border-bottom:5px solid var(--t-surface-2); border-radius:14px; padding:9px 6px 7px; display:flex; flex-direction:column; align-items:center; gap:4px; width:78px; cursor:pointer; }
    .btn-lbl { font-family:var(--t-kr); font-size:10px; color:var(--t-ink); text-align:center; line-height:1.3; white-space:pre-line; }
    .btn-play { background:var(--t-soft); border:none; border-bottom:6px solid var(--t-surface-2); border-radius:40px; width:84px; height:78px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; }
    .btn-time { font-family:var(--t-en); font-size:14px; font-weight:700; color:var(--t-ink); }
    .btn-total { font-family:var(--t-en); font-size:9px; color:var(--t-ink); opacity:.5; }
  </style>
</head>
<body class="t-toy">

  <div class="top-bar">
    <span class="top-title">Brush, Brush, Brush!</span>
    <div class="step-dots" aria-label="장면 4/6">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="dot on"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="listen-sw" aria-label="그냥 듣기 꺼짐">
      <span class="sw-lbl">그냥 듣기</span>
      <div class="sw-track"></div>
    </div>
  </div>

  <div class="device">
    <div class="screen" aria-label="반짝 장면, 이가 깨끗해졌어요">

      <div class="stage">
        <svg viewBox="0 0 352 480" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">
          <!-- warm background -->
          <rect width="352" height="480" style="fill:var(--t-soft)"/>
          <!-- "All clean!" big text header -->
          <text x="176" y="56" text-anchor="middle" style="font-family:var(--t-en);font-size:42px;font-weight:700;fill:var(--t-surface);stroke:var(--t-paper);stroke-width:4;paint-order:stroke">All clean!</text>

          <!-- Lily face (close-up, big smile) centered -->
          <!-- body/shirt hint -->
          <path d="M36,460 q140,40 280,0 l0,40 l-280,0 z" style="fill:var(--t-screen)"/>
          <!-- neck -->
          <rect x="148" y="380" width="56" height="48" rx="12" style="fill:var(--skin);stroke:var(--ink);stroke-width:2"/>
          <!-- head -->
          <circle cx="176" cy="258" r="130" style="fill:var(--skin);stroke:var(--ink);stroke-width:2.5"/>
          <!-- hair -->
          <path d="M50,234 q10-120 126-124 q116,-4 126,124 q-46-44-126-48 q-80,4-126,48 z" style="fill:var(--hair)"/>
          <!-- pigtail left -->
          <path d="M50,210 q-56,12-44,78 q26-12 34-46" style="fill:var(--hair)"/>
          <!-- pigtail right -->
          <path d="M302,210 q56,12 44,78 q-26-12-34-46" style="fill:var(--hair)"/>
          <!-- hair ties -->
          <circle cx="50" cy="204" r="14" style="fill:var(--sun);stroke:var(--ink);stroke-width:2.5"/>
          <circle cx="302" cy="204" r="14" style="fill:var(--sun);stroke:var(--ink);stroke-width:2.5"/>
          <!-- eyes (happy, curved) -->
          <path d="M132,252 q18,-22 36,0" style="fill:none;stroke:var(--ink);stroke-width:5"/>
          <path d="M184,252 q18,-22 36,0" style="fill:none;stroke:var(--ink);stroke-width:5"/>
          <!-- cheeks (big happy) -->
          <ellipse cx="98" cy="290" rx="24" ry="14" style="fill:var(--cheek);opacity:.65"/>
          <ellipse cx="254" cy="290" rx="24" ry="14" style="fill:var(--cheek);opacity:.65"/>
          <!-- BIG HAPPY MOUTH -->
          <path d="M106,304 q70,90 140,0 z" style="fill:var(--card);stroke:var(--ink);stroke-width:2.5"/>
          <!-- upper lip -->
          <path d="M106,304 q70,-14 140,0" style="fill:none;stroke:var(--cheek);stroke-width:6"/>

          <!-- TEETH inside the smile -->
          <!-- 5 teeth visible -->
          <rect x="114" y="308" width="32" height="38" rx="5" style="fill:var(--card);stroke:var(--ink);stroke-width:1.5"/>
          <rect x="150" y="308" width="32" height="44" rx="5" style="fill:var(--card);stroke:var(--ink);stroke-width:1.5"/>
          <rect x="186" y="308" width="32" height="46" rx="5" style="fill:var(--card);stroke:var(--ink);stroke-width:1.5"/>
          <rect x="222" y="308" width="32" height="44" rx="5" style="fill:var(--card);stroke:var(--ink);stroke-width:1.5"/>
          <rect x="258" y="308" width="24" height="38" rx="5" style="fill:var(--card);stroke:var(--ink);stroke-width:1.5"/>

          <!-- SPARKLE feedback on 3 teeth (just tapped) -->
          <!-- large 4-point star on center tooth (186) -->
          <path d="M202,310 l4,12 l12,4 l-12,4 l-4,12 l-4,-12 l-12,-4 l12,-4 z" style="fill:var(--t-glow);stroke:none"/>
          <!-- smaller star on left tooth -->
          <path d="M130,312 l3,8 l8,3 l-8,3 l-3,8 l-3,-8 l-8,-3 l8,-3 z" style="fill:var(--t-glow);stroke:none"/>
          <!-- smaller star on right -->
          <path d="M238,314 l3,8 l8,3 l-8,3 l-3,8 l-3,-8 l-8,-3 l8,-3 z" style="fill:var(--t-glow);stroke:none"/>

          <!-- sparkle burst lines radiating from center tooth -->
          <g style="stroke:var(--t-glow);stroke-width:2.5">
            <line x1="202" y1="294" x2="202" y2="284"/>
            <line x1="224" y1="298" x2="232" y2="290"/>
            <line x1="180" y1="298" x2="172" y2="290"/>
            <line x1="212" y1="292" x2="218" y2="282"/>
            <line x1="192" y1="292" x2="186" y2="282"/>
          </g>

          <!-- tap ripple on teeth (just tapped) -->
          <circle cx="202" cy="328" r="18" style="fill:none;stroke:var(--t-glow);stroke-width:2;opacity:.6"/>
          <circle cx="202" cy="328" r="28" style="fill:none;stroke:var(--t-glow);stroke-width:1.5;opacity:.3"/>

          <!-- floating sparkles around face -->
          <g style="fill:var(--sun);stroke:none">
            <path d="M42,120 l2.5,7 l7,0 l-5.5,4.5 l2,7 l-6,-4.5 l-6,4.5 l2,-7 l-5.5,-4.5 l7,0 z"/>
            <path d="M310,100 l2,6 l6,0 l-4.5,3.5 l1.5,6 l-5,-3.5 l-5,3.5 l1.5,-6 l-4.5,-3.5 l6,0 z"/>
            <path d="M316,370 l2,6 l6,0 l-4.5,3.5 l1.5,6 l-5,-3.5 l-5,3.5 l1.5,-6 l-4.5,-3.5 l6,0 z"/>
            <path d="M36,370 l2.5,7 l7,0 l-5.5,4.5 l2,7 l-6,-4.5 l-6,4.5 l2,-7 l-5.5,-4.5 l7,0 z"/>
          </g>
        </svg>
      </div>

      <div class="caption">
        <p class="cap-text"><span class="en">All clean!</span> 깨끗해! 활짝 웃어 봐!</p>
      </div>
    </div>

    <div class="btns">
      <button class="btn-side" aria-label="3번 이어 듣기">
        <svg width="28" height="22" viewBox="0 0 28 22" aria-hidden="true">
          <path d="M20 3 L25 8 L20 13" stroke-width="2.5" style="fill:none;stroke:var(--t-ink)"/>
          <path d="M4 17 C4 9 10 4 18 6" stroke-width="2.5" style="fill:none;stroke:var(--t-ink)"/>
          <text x="3" y="22" font-size="9" font-weight="700" style="fill:var(--t-ink);font-family:var(--t-en)">x3</text>
        </svg>
        <span class="btn-lbl">3번&#10;이어 듣기</span>
      </button>

      <button class="btn-play" aria-label="일시정지, 현재 1분 30초">
        <span class="btn-time">1:30</span>
        <span class="btn-total">/ 2:19</span>
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <rect x="3" y="2" width="5" height="16" rx="2.5" style="fill:var(--t-ink)"/>
          <rect x="12" y="2" width="5" height="16" rx="2.5" style="fill:var(--t-ink)"/>
        </svg>
      </button>

      <button class="btn-side" aria-label="조금 천천히">
        <svg width="28" height="22" viewBox="0 0 28 22" aria-hidden="true">
          <ellipse cx="14" cy="11" rx="8" ry="6" style="fill:none;stroke:var(--t-ink);stroke-width:2.5"/>
          <line x1="6" y1="11" x2="2" y2="11" stroke-width="2.5" style="stroke:var(--t-ink)"/>
          <line x1="22" y1="11" x2="26" y2="11" stroke-width="2.5" style="stroke:var(--t-ink)"/>
        </svg>
        <span class="btn-lbl">조금&#10;천천히</span>
      </button>
    </div>
  </div>

</body>
</html>
