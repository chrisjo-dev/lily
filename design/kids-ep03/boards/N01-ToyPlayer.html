<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390">
  <title>Brush, Brush, Brush! — 매일 외국어 읽기</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    body {
      background: var(--t-bg);
      font-family: var(--t-body);
      color: var(--t-ink);
      width: 390px;
      margin: 0 auto;
    }

    /* ── Site mark ── */
    .site-mark {
      text-align: center;
      padding: 14px 0 6px;
      font-size: 10px;
      color: var(--t-ink);
      opacity: 0.48;
      letter-spacing: 0.08em;
      font-family: var(--t-body);
    }

    /* ── Toy area ── */
    .toy-area {
      padding: 4px 22px 0;
    }

    /* Episode card slotted into the top of the toy */
    .episode-card {
      background: var(--t-paper);
      border-radius: 14px 14px 0 0;
      margin: 0 14px;
      padding: 11px 16px 22px;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      border: 2.5px solid var(--t-surface-2);
      border-bottom: none;
    }
    /* Tab notch at top of episode card */
    .episode-card::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 5px;
      background: var(--t-soft);
      border-radius: 0 0 4px 4px;
    }
    .ep-eyebrow {
      font-size: 9px;
      font-family: var(--t-body);
      color: var(--t-surface);
      letter-spacing: 0.12em;
      margin-top: 4px;
    }
    .ep-title {
      font-family: var(--t-en);
      font-size: 21px;
      font-weight: 700;
      color: var(--t-ink);
      text-align: center;
      line-height: 1.2;
      margin: 0;
    }
    .ep-badges {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 2px;
    }
    .ep-badge {
      font-size: 10px;
      font-family: var(--t-body);
      color: var(--t-surface);
      background: var(--t-soft);
      padding: 2px 9px;
      border-radius: 6px;
    }

    /* ── Toy body ── */
    .toy-body {
      background: var(--t-surface);
      border-radius: 28px;
      padding: 18px 16px 22px;
      border-bottom: 9px solid var(--t-surface-2);
      position: relative;
      z-index: 1;
    }

    /* Screen window */
    .screen-window {
      background: var(--t-screen);
      border-radius: 18px;
      overflow: hidden;
      border: 3px solid var(--t-surface-2);
      margin-bottom: 14px;
    }
    .scene-wrap {
      overflow: hidden;
      line-height: 0;
    }
    .scene-wrap img {
      width: 100%;
      display: block;
    }
    .current-line-bar {
      background: var(--t-screen);
      padding: 10px 14px 12px;
      text-align: center;
    }
    .current-line-text {
      font-family: var(--t-kr);
      font-size: 15px;
      color: var(--t-glow);
      line-height: 1.6;
      letter-spacing: 0.01em;
    }
    .current-line-text .en-word {
      font-family: var(--t-en);
      font-size: 18px;
      font-weight: 700;
    }

    /* Progress row */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 0 2px;
    }
    .prog-time {
      font-family: var(--t-en);
      font-size: 11px;
      color: var(--t-paper);
      opacity: 0.8;
      min-width: 30px;
      flex-shrink: 0;
    }
    .prog-time.right {
      text-align: right;
    }
    .prog-track {
      flex: 1;
      height: 7px;
      background: var(--t-surface-2);
      border-radius: 4px;
      overflow: visible;
      position: relative;
    }
    .prog-fill {
      height: 100%;
      width: 49%;
      background: var(--t-glow);
      border-radius: 4px;
      position: relative;
    }
    .prog-fill::after {
      content: "";
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      background: var(--t-paper);
      border-radius: 50%;
      border: 2px solid var(--t-glow);
    }

    /* ── Physical buttons ── */
    .buttons-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    /* Base fat button */
    .toy-btn {
      cursor: pointer;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: var(--t-paper);
      border-radius: 18px;
      border-bottom: 5px solid var(--t-surface-2);
      padding: 10px 8px 8px;
      border-top: none;
      border-left: none;
      border-right: none;
    }
    .toy-btn-label {
      font-family: var(--t-kr);
      font-size: 10px;
      color: var(--t-ink);
      text-align: center;
      line-height: 1.35;
      white-space: pre-line;
    }

    /* Knob buttons (rectangular) */
    .knob-btn {
      width: 78px;
      height: 72px;
    }

    /* Play/pause big center button */
    .play-btn {
      width: 88px;
      height: 88px;
      border-radius: 44px;
      background: var(--t-soft);
      border-bottom: 6px solid var(--t-surface-2);
      border-top: none;
      border-left: none;
      border-right: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .play-btn .toy-btn-label {
      font-size: 9px;
    }

    /* ── Word cards section ── */
    .words-section {
      padding: 18px 0 0;
    }
    .words-label {
      font-family: var(--t-kr);
      font-size: 12px;
      color: var(--t-ink);
      opacity: 0.6;
      text-align: center;
      margin-bottom: 10px;
    }
    .word-cards {
      display: flex;
      gap: 9px;
      justify-content: center;
    }
    .word-card {
      background: var(--t-paper);
      border-radius: 16px;
      padding: 10px 7px 9px;
      width: 104px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      border-bottom: 4px solid var(--t-surface-2);
      border-top: none;
      border-left: none;
      border-right: none;
      outline: none;
    }
    .word-card.active {
      outline: 2.5px solid var(--t-glow);
      outline-offset: -1px;
    }
    .word-card-icon {
      width: 60px;
      height: 50px;
    }
    .word-card-en {
      font-family: var(--t-en);
      font-size: 11px;
      font-weight: 700;
      color: var(--t-ink);
      text-align: center;
      line-height: 1.3;
    }
    .word-card-kr {
      font-family: var(--t-body);
      font-size: 10px;
      color: var(--t-ink);
      opacity: 0.55;
      text-align: center;
    }
    .word-card-playing {
      display: none;
      font-family: var(--t-kr);
      font-size: 9px;
      color: var(--t-glow);
      background: var(--t-screen);
      padding: 1px 7px;
      border-radius: 4px;
    }
    .word-card.active .word-card-playing {
      display: block;
    }

    /* ── Parent area ── */
    .parent-area {
      background: var(--t-paper);
      margin-top: 26px;
      border-radius: 26px 26px 0 0;
      padding: 22px 20px 44px;
    }
    .parent-heading {
      font-family: var(--t-kr);
      font-size: 11px;
      color: var(--t-ink);
      opacity: 0.45;
      letter-spacing: 0.06em;
      text-align: center;
      margin-bottom: 14px;
    }

    /* Parent nav pills */
    .parent-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .parent-tab {
      flex: 1;
      background: var(--t-bg);
      border: none;
      border-radius: 12px;
      padding: 9px 6px;
      font-size: 13px;
      font-family: var(--t-kr);
      color: var(--t-ink);
      opacity: 0.65;
      cursor: pointer;
      text-align: center;
    }
    .parent-tab.active {
      background: var(--t-surface);
      color: var(--t-paper);
      opacity: 1;
    }

    /* 학습지 section */
    .section-label {
      font-family: var(--t-kr);
      font-size: 13px;
      color: var(--t-ink);
      opacity: 0.5;
      margin-bottom: 10px;
    }
    .activity-list {
      list-style: none;
      margin: 0 0 14px;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .activity-list li {
      font-size: 14px;
      font-family: var(--t-body);
      color: var(--t-ink);
      line-height: 1.5;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .act-num {
      font-family: var(--t-en);
      font-size: 11px;
      font-weight: 700;
      color: var(--t-surface);
      background: var(--t-soft);
      border-radius: 5px;
      padding: 1px 6px;
      flex-shrink: 0;
    }
    .worksheet-thumb {
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1.5px solid var(--t-bg);
      max-height: 180px;
    }
    .worksheet-thumb img {
      width: 100%;
      display: block;
      object-fit: cover;
      object-position: top;
    }
    .dl-btn {
      display: block;
      width: 100%;
      background: var(--t-surface);
      color: var(--t-paper);
      text-align: center;
      padding: 14px;
      border-radius: 14px;
      font-family: var(--t-kr);
      font-size: 15px;
      border: none;
      border-bottom: 4px solid var(--t-surface-2);
      cursor: pointer;
      letter-spacing: 0.01em;
    }

    /* 부모님께 section */
    .tips-section {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1.5px solid var(--t-bg);
    }
    .tips-heading {
      font-family: var(--t-kr);
      font-size: 14px;
      color: var(--t-ink);
      margin-bottom: 12px;
    }
    .tips {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tip-item {
      display: flex;
      gap: 9px;
      align-items: flex-start;
    }
    .tip-dot {
      width: 7px;
      height: 7px;
      background: var(--t-surface);
      border-radius: 50%;
      margin-top: 7px;
      flex-shrink: 0;
    }
    .tip-text {
      margin: 0;
      font-size: 13px;
      font-family: var(--t-body);
      color: var(--t-ink);
      line-height: 1.65;
      opacity: 0.85;
    }
    .tip-text .en-inline {
      font-family: var(--t-en);
      font-size: 13px;
      font-weight: 700;
    }

    /* 대본 보기 folded */
    .script-section {
      margin-top: 16px;
      border-top: 1.5px solid var(--t-bg);
      padding-top: 16px;
    }
    .script-fold {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .script-fold-label {
      font-family: var(--t-kr);
      font-size: 14px;
      color: var(--t-ink);
      opacity: 0.65;
    }
    .fold-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
    }
  </style>
</head>
<body class="t-toy">

  <!-- Site mark -->
  <div class="site-mark">매일 외국어 읽기</div>

  <!-- Toy area -->
  <div class="toy-area">

    <!-- Episode card slotted into top of toy -->
    <div class="episode-card">
      <span class="ep-eyebrow">에피소드</span>
      <h1 class="ep-title">Brush, Brush, Brush!</h1>
      <div class="ep-badges">
        <span class="ep-badge">5~8세</span>
        <span class="ep-badge">2분</span>
      </div>
    </div>

    <!-- Toy body -->
    <div class="toy-body">

      <!-- Screen window -->
      <div class="screen-window">
        <div class="scene-wrap">
          <img src="../assets/lily-scene.svg" alt="릴리와 비스킷이 이를 닦는 장면" width="320" height="218">
        </div>
        <div class="current-line-bar">
          <p class="current-line-text">
            와! <span class="en-word">Bubbles!</span> 거품이야!<br><span class="en-word">Bubbles!</span>
          </p>
        </div>
      </div>

      <!-- Progress -->
      <div class="progress-row">
        <span class="prog-time">1:08</span>
        <div class="prog-track">
          <div class="prog-fill"></div>
        </div>
        <span class="prog-time right">2:19</span>
      </div>

      <!-- Physical buttons -->
      <div class="buttons-row">

        <!-- 3번 이어 듣기 knob -->
        <button class="toy-btn knob-btn" aria-label="3번 이어 듣기">
          <svg width="30" height="26" viewBox="0 0 30 26" aria-hidden="true">
            <path d="M22 4 L26 9 L22 14" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" style="stroke:var(--t-ink)"/>
            <path d="M4 18 C4 11 10 6 18 8" stroke-width="2.8" stroke-linecap="round" fill="none" style="stroke:var(--t-ink)"/>
            <text x="5" y="24" font-size="9" font-weight="700" style="fill:var(--t-ink);font-family:var(--t-en)">x3</text>
          </svg>
          <span class="toy-btn-label">3번&#10;이어 듣기</span>
        </button>

        <!-- Play/Pause big button -->
        <button class="play-btn" aria-label="일시정지">
          <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
            <rect x="4" y="3" width="7" height="20" rx="3" style="fill:var(--t-ink)"/>
            <rect x="15" y="3" width="7" height="20" rx="3" style="fill:var(--t-ink)"/>
          </svg>
          <span class="toy-btn-label">재생 중</span>
        </button>

        <!-- 조금 천천히 knob -->
        <button class="toy-btn knob-btn" aria-label="조금 천천히">
          <svg width="30" height="26" viewBox="0 0 30 26" aria-hidden="true">
            <!-- Tortoise shell shape (slow) -->
            <ellipse cx="15" cy="13" rx="9" ry="7" fill="none" stroke-width="2.5" style="stroke:var(--t-ink)"/>
            <line x1="6" y1="13" x2="2" y2="13" stroke-width="2.5" stroke-linecap="round" style="stroke:var(--t-ink)"/>
            <line x1="24" y1="13" x2="20" y2="13" stroke-width="2.5" stroke-linecap="round" style="stroke:var(--t-ink)"/>
            <!-- slower chevron pair -->
            <path d="M11 9 L15 13 L11 17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" style="stroke:var(--t-ink); opacity:0.45"/>
          </svg>
          <span class="toy-btn-label">조금&#10;천천히</span>
        </button>

      </div>
    </div><!-- /toy-body -->
  </div><!-- /toy-area -->

  <!-- Word cards drop zone -->
  <div class="words-section">
    <p class="words-label">오늘의 단어</p>
    <div class="word-cards">

      <button class="word-card" aria-label="brush my teeth 듣기">
        <img class="word-card-icon" src="../assets/word-brush.svg" alt="brush my teeth" width="60" height="50">
        <span class="word-card-en">brush my teeth</span>
        <span class="word-card-kr">이를 닦아요</span>
      </button>

      <button class="word-card active" aria-label="bubbles 듣기, 지금 재생 중">
        <img class="word-card-icon" src="../assets/word-bubbles.svg" alt="bubbles" width="60" height="50">
        <span class="word-card-en">bubbles</span>
        <span class="word-card-kr">거품</span>
        <span class="word-card-playing">재생 중</span>
      </button>

      <button class="word-card" aria-label="all clean 듣기">
        <img class="word-card-icon" src="../assets/word-clean.svg" alt="all clean" width="60" height="50">
        <span class="word-card-en">all clean</span>
        <span class="word-card-kr">깨끗해</span>
      </button>

    </div>
  </div>

  <!-- Parent area -->
  <div class="parent-area">

    <p class="parent-heading">부모님 영역</p>

    <!-- Parent nav -->
    <div class="parent-nav" role="tablist">
      <button class="parent-tab active" role="tab" aria-selected="true">학습지</button>
      <button class="parent-tab" role="tab" aria-selected="false">부모님께</button>
      <button class="parent-tab" role="tab" aria-selected="false">대본 보기</button>
    </div>

    <!-- 학습지 content -->
    <section aria-label="학습지">
      <div class="worksheet-thumb">
        <img src="../assets/worksheet.png" alt="학습지 미리보기" width="350">
      </div>
      <ul class="activity-list">
        <li><span class="act-num">1</span> 그림에서 칫솔 찾기</li>
        <li><span class="act-num">2</span> 오려서 노는 단어 카드</li>
        <li><span class="act-num">3</span> 말할 때마다 스티커</li>
        <li><span class="act-num">4</span> 릴리 색칠하기</li>
      </ul>
      <button class="dl-btn">학습지 받기 (A4)</button>
    </section>

    <!-- 부모님께 tips -->
    <section class="tips-section" aria-label="부모님께">
      <p class="tips-heading">부모님께</p>
      <div class="tips">
        <div class="tip-item">
          <span class="tip-dot"></span>
          <p class="tip-text">여러 번 들려주세요. 반복이 가장 좋은 방법이에요.</p>
        </div>
        <div class="tip-item">
          <span class="tip-dot"></span>
          <p class="tip-text">실제 양치 시간에 <span class="en-inline">Brush my teeth!</span> 한 번 말해 주세요.</p>
        </div>
        <div class="tip-item">
          <span class="tip-dot"></span>
          <p class="tip-text">아이가 따라 하지 않아도 괜찮아요.</p>
        </div>
      </div>
    </section>

    <!-- 대본 보기 folded -->
    <section class="script-section" aria-label="대본 보기">
      <div class="script-fold">
        <span class="script-fold-label">대본 보기</span>
        <span class="fold-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 6 L8 10 L12 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" style="stroke:var(--t-ink); opacity:0.45"/>
          </svg>
        </span>
      </div>
    </section>

  </div><!-- /parent-area -->

</body>
</html>
