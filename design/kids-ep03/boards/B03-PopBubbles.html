<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390">
  <title>Brush, Brush, Brush! — 거품 터뜨리기</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    body {
      background: var(--t-bg); color: var(--t-ink); font-family: var(--t-body);
      width: 390px; margin: 0 auto; overflow-x: hidden;
    }
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; height: 52px;
      background: var(--t-surface); border-bottom: 1.5px solid var(--t-soft);
    }
    .top-title { font-family: var(--t-en); font-size: 11px; color: var(--t-sub); letter-spacing: 0.03em; }
    .prog-dots { display: flex; align-items: center; gap: 5px; }
    .pdot { width: 8px; height: 8px; border-radius: 50%; background: var(--t-soft); }
    .pdot.done { background: var(--t-accent); opacity: 0.38; }
    .pdot.now  { width: 22px; border-radius: 4px; background: var(--t-accent); }
    .listen-sw { display: flex; align-items: center; gap: 5px; font-family: var(--t-kr); font-size: 10px; color: var(--t-sub); }
    .sw-track { width: 28px; height: 16px; background: var(--t-soft); border-radius: 8px; position: relative; }
    .sw-thumb { position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; background: var(--t-surface); border-radius: 50%; }

    .stage { width: 390px; height: 538px; position: relative; overflow: hidden; display: block; }

    .caption-strip {
      background: var(--t-surface);
      padding: 12px 24px 10px;
      border-top: 1.5px solid var(--t-soft); border-bottom: 1.5px solid var(--t-soft);
    }
    .wait-tag {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--t-soft); border-radius: 99px; padding: 3px 11px;
      font-family: var(--t-kr); font-size: 11px; color: var(--t-accent); margin-bottom: 7px;
    }
    .wait-dot { width: 6px; height: 6px; background: var(--t-accent); border-radius: 50%; animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }
    .caption-text { font-family: var(--t-kr); font-size: 19px; line-height: 1.55; color: var(--t-ink); margin: 0; text-align: center; word-break: keep-all; }
    .en { font-family: var(--t-en); font-size: 21px; color: var(--t-accent); font-weight: 700; }

    .controls { background: var(--t-bg); padding: 11px 18px 10px; }
    .ctrl-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .play-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--t-accent); border: none; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; }
    .prog-wrap { flex: 1; }
    .prog-track { height: 4px; background: var(--t-soft); border-radius: 2px; margin-bottom: 4px; }
    .prog-fill { width: 49%; height: 100%; background: var(--t-accent); border-radius: 2px; }
    .time-row { display: flex; justify-content: space-between; font-family: var(--t-en); font-size: 11px; color: var(--t-sub); }
    .ctrl-btns { display: flex; gap: 7px; }
    .ctrl-btn { flex: 1; border: 1.5px solid var(--t-soft); background: var(--t-surface); border-radius: 10px; padding: 8px 6px; font-family: var(--t-kr); font-size: 11px; color: var(--t-sub); text-align: center; cursor: pointer; }

    /* 5초 링 */
    .ring-drain { animation: drain5 5s linear; transform-origin: 353px 44px; }
    @keyframes drain5 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 126; } }
    /* 터진 거품 burst */
    .pop-burst { animation: popOut 0.4s ease-out both; transform-origin: center; }
    @keyframes popOut { 0%{opacity:0; transform:scale(0.3)} 60%{opacity:1; transform:scale(1.1)} 100%{opacity:1; transform:scale(1)} }
    /* 남은 거품 살랑살랑 */
    .bubble-float { animation: float 2.8s ease-in-out infinite; }
    .bubble-float:nth-child(2) { animation-duration: 3.2s; }
    .bubble-float:nth-child(3) { animation-duration: 2.5s; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    /* 힌트 링 */
    .hint-ring { animation: hpulse 2s ease-in-out infinite; }
    @keyframes hpulse { 0%,100%{opacity:0.5} 50%{opacity:0.18} }
  </style>
</head>
<body class="t-book">

  <header class="top-bar">
    <span class="top-title">Brush, Brush, Brush!</span>
    <div class="prog-dots" aria-label="진행 3/6">
      <span class="pdot done"></span><span class="pdot done"></span>
      <span class="pdot now"></span>
      <span class="pdot"></span><span class="pdot"></span><span class="pdot"></span>
    </div>
    <div class="listen-sw">
      <span>그냥 듣기</span>
      <span class="sw-track"><span class="sw-thumb"></span></span>
    </div>
  </header>

  <div class="stage" role="img" aria-label="거품 터뜨리기. 거품 5개 중 2개가 터졌어요.">
    <svg width="390" height="538" viewBox="0 0 390 538" xmlns="http://www.w3.org/2000/svg">

      <!-- 배경 (wash-1 하늘빛) -->
      <rect x="0" y="0" width="390" height="538" style="fill:var(--t-wash-1)"/>

      <!-- 배경 색 블록 장식 -->
      <rect x="0" y="380" width="390" height="158" style="fill:var(--t-wash-2); opacity:0.6"/>
      <ellipse cx="195" cy="380" rx="250" ry="28" style="fill:var(--t-wash-2); opacity:0.6"/>

      <!-- 큰 BUBBLES 텍스트 (배경처럼) -->
      <text x="195" y="108" style="font-family:var(--t-en); font-size:72px; font-weight:700; fill:var(--t-surface); opacity:0.55; text-anchor:middle; letter-spacing:-2px">Bubbles</text>
      <!-- 앞쪽 BUBBLES 텍스트 -->
      <text x="195" y="104" style="font-family:var(--t-en); font-size:68px; font-weight:700; fill:var(--t-accent); opacity:0.9; text-anchor:middle; letter-spacing:-2px">Bubbles</text>

      <!-- ── 터진 거품 2개 ── -->
      <!-- 터진 거품 1 (왼쪽 위) -->
      <g class="pop-burst" style="transform-origin:105px 210px">
        <!-- 터짐 방사형 선들 -->
        <line x1="105" y1="170" x2="105" y2="155" style="stroke:var(--t-accent); stroke-width:3; stroke-linecap:round; opacity:0.7"/>
        <line x1="138" y1="182" x2="150" y2="172" style="stroke:var(--t-accent); stroke-width:3; stroke-linecap:round; opacity:0.7"/>
        <line x1="148" y1="213" x2="163" y2="215" style="stroke:var(--t-accent); stroke-width:3; stroke-linecap:round; opacity:0.7"/>
        <line x1="130" y1="242" x2="138" y2="254" style="stroke:var(--t-accent); stroke-width:3; stroke-linecap:round; opacity:0.7"/>
        <line x1="72" y1="248" x2="64" y2="258" style="stroke:var(--t-accent); stroke-width:3; stroke-linecap:round; opacity:0.7"/>
        <line x1="58" y1="215" x2="44" y2="217" style="stroke:var(--t-accent); stroke-width:3; stroke-linecap:round; opacity:0.7"/>
        <line x1="66" y1="183" x2="55" y2="173" style="stroke:var(--t-accent); stroke-width:3; stroke-linecap:round; opacity:0.7"/>
        <!-- 터진 중심 -->
        <circle cx="105" cy="212" r="28" style="fill:var(--t-wash-3); opacity:0.6"/>
        <!-- Pop 텍스트 -->
        <text x="105" y="218" style="font-family:var(--t-en); font-size:16px; font-weight:700; fill:var(--t-accent); text-anchor:middle">Pop!</text>
        <!-- 작은 방울들 -->
        <circle cx="86" cy="188" r="5" style="fill:var(--t-surface); stroke:var(--t-accent); stroke-width:1.5; opacity:0.8"/>
        <circle cx="126" cy="192" r="4" style="fill:var(--t-surface); stroke:var(--t-accent); stroke-width:1.5; opacity:0.7"/>
        <circle cx="118" cy="238" r="4" style="fill:var(--t-surface); stroke:var(--t-accent); stroke-width:1.5; opacity:0.7"/>
        <circle cx="90" cy="241" r="3" style="fill:var(--t-surface); stroke:var(--t-accent); stroke-width:1.5; opacity:0.6"/>
      </g>

      <!-- 터진 거품 2 (오른쪽 위) - 방금 탭됨 -->
      <g class="pop-burst" style="transform-origin:290px 188px">
        <line x1="290" y1="152" x2="290" y2="138" style="stroke:var(--t-accent); stroke-width:3; stroke-linecap:round; opacity:0.8"/>
        <line x1="320" y1="163" x2="332" y2="153" style="stroke:var(--t-accent); stroke-width:3; stroke-linecap:round; opacity:0.8"/>
        <line x1="327" y1="192" x2="341" y2="193" style="stroke:var(--t-accent); stroke-width:3; stroke-linecap:round; opacity:0.8"/>
        <line x1="310" y1="218" x2="318" y2="228" style="stroke:var(--t-accent); stroke-width:3; stroke-linecap:round; opacity:0.8"/>
        <line x1="260" y1="220" x2="252" y2="230" style="stroke:var(--t-accent); stroke-width:3; stroke-linecap:round; opacity:0.8"/>
        <line x1="248" y1="192" x2="235" y2="193" style="stroke:var(--t-accent); stroke-width:3; stroke-linecap:round; opacity:0.8"/>
        <line x1="258" y1="163" x2="246" y2="152" style="stroke:var(--t-accent); stroke-width:3; stroke-linecap:round; opacity:0.8"/>
        <circle cx="290" cy="188" r="32" style="fill:var(--t-wash-3); opacity:0.7"/>
        <text x="290" y="194" style="font-family:var(--t-en); font-size:16px; font-weight:700; fill:var(--t-accent); text-anchor:middle">Pop!</text>
        <circle cx="268" cy="164" r="6" style="fill:var(--t-surface); stroke:var(--t-accent); stroke-width:1.5; opacity:0.8"/>
        <circle cx="314" cy="166" r="5" style="fill:var(--t-surface); stroke:var(--t-accent); stroke-width:1.5; opacity:0.7"/>
        <circle cx="316" cy="214" r="5" style="fill:var(--t-surface); stroke:var(--t-accent); stroke-width:1.5; opacity:0.7"/>
        <circle cx="264" cy="213" r="4" style="fill:var(--t-surface); stroke:var(--t-accent); stroke-width:1.5; opacity:0.6"/>
      </g>

      <!-- ── 남은 거품 3개 ── -->
      <!-- 거품 3 (아래 왼쪽 큰 것) -->
      <g class="bubble-float">
        <circle cx="130" cy="360" r="52"
          style="fill:var(--t-surface); stroke:var(--t-soft); stroke-width:3; opacity:0.88"/>
        <circle cx="114" cy="342" r="10"
          style="fill:var(--t-surface); opacity:0.55"/>
      </g>
      <!-- 힌트 링 -->
      <circle cx="130" cy="360" r="62" class="hint-ring"
        style="fill:none; stroke:var(--t-accent); stroke-width:2"/>

      <!-- 거품 4 (아래 중간) -->
      <g class="bubble-float" style="animation-delay:0.4s">
        <circle cx="236" cy="390" r="44"
          style="fill:var(--t-surface); stroke:var(--t-soft); stroke-width:3; opacity:0.88"/>
        <circle cx="222" cy="374" r="8"
          style="fill:var(--t-surface); opacity:0.55"/>
      </g>

      <!-- 거품 5 (오른쪽 중간) -->
      <g class="bubble-float" style="animation-delay:0.9s">
        <circle cx="340" cy="350" r="36"
          style="fill:var(--t-surface); stroke:var(--t-soft); stroke-width:3; opacity:0.88"/>
        <circle cx="328" cy="338" r="7"
          style="fill:var(--t-surface); opacity:0.55"/>
      </g>

      <!-- 손가락 포인터 (거품 3 쪽으로) -->
      <ellipse cx="130" cy="432" rx="10" ry="14" style="fill:var(--skin); stroke:var(--ink); stroke-width:1.5; opacity:0.9"/>
      <rect x="124" y="420" width="7" height="14" rx="3" style="fill:var(--skin); stroke:var(--ink); stroke-width:1; opacity:0.9"/>
      <rect x="131" y="418" width="7" height="16" rx="3" style="fill:var(--skin); stroke:var(--ink); stroke-width:1; opacity:0.9"/>
      <rect x="138" y="420" width="7" height="14" rx="3" style="fill:var(--skin); stroke:var(--ink); stroke-width:1; opacity:0.9"/>

      <!-- 5초 링 -->
      <circle cx="353" cy="44" r="20" style="fill:none; stroke:var(--t-soft); stroke-width:2"/>
      <circle cx="353" cy="44" r="20" class="ring-drain"
        style="fill:none; stroke:var(--t-accent); stroke-width:2; stroke-dasharray:126; stroke-linecap:round; transform:rotate(-90deg); transform-origin:353px 44px"/>
      <text x="353" y="49" style="font-family:var(--t-en); font-size:11px; fill:var(--t-sub); text-anchor:middle">5</text>

      <!-- 페이지 모서리 글로우 -->
      <rect x="330" y="478" width="60" height="60" rx="30" style="fill:var(--t-wash-3); opacity:0.3"/>

    </svg>
  </div>

  <div class="caption-strip">
    <div class="wait-tag"><span class="wait-dot"></span>릴리가 기다려요</div>
    <p class="caption-text">와! <span class="en">Bubbles!</span> 거품이야!</p>
  </div>

  <div class="controls">
    <div class="ctrl-top">
      <button class="play-btn" aria-label="일시정지">
        <svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="2" width="3.5" height="12" rx="1.2" style="fill:var(--t-surface)"/>
          <rect x="9.5" y="2" width="3.5" height="12" rx="1.2" style="fill:var(--t-surface)"/>
        </svg>
      </button>
      <div class="prog-wrap">
        <div class="prog-track"><div class="prog-fill"></div></div>
        <div class="time-row"><span>1:08</span><span>2:19</span></div>
      </div>
    </div>
    <div class="ctrl-btns">
      <button class="ctrl-btn">3번 이어 듣기</button>
      <button class="ctrl-btn">조금 천천히</button>
    </div>
  </div>

</body>
</html>
