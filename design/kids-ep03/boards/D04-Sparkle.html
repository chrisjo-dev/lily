<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390">
  <title>D04 — 반짝</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    body { width: 390px; max-width: 390px; min-height: 844px; max-height: 844px; overflow: hidden; margin: 0 auto; background: var(--t-bg); font-family: var(--t-kr); }

    .top-bar { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--t-bg); }
    .ep-title { font-family: var(--t-en); font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.72); letter-spacing: 0.01em; }
    .progress-dots { display: flex; gap: 5px; align-items: center; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.28); }
    .dot.active { width: 14px; height: 14px; background: var(--t-accent); }
    .dot.done { background: rgba(255,255,255,0.55); }
    .skip-wrap { display: flex; align-items: center; gap: 5px; font-size: 11px; font-family: var(--t-kr); color: rgba(255,255,255,0.6); }
    .track { width: 34px; height: 18px; background: rgba(255,255,255,0.18); border-radius: 9px; position: relative; }
    .thumb { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,0.45); position: absolute; top: 2px; left: 2px; }

    .stage { width: 390px; height: 636px; overflow: hidden; background: var(--t-bg); position: relative; }

    .caption-strip { background: var(--t-surface); padding: 12px 20px 14px; height: 88px; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
    .caption-line { font-family: var(--t-kr); font-size: 20px; color: var(--t-ink); line-height: 1.4; }
    .caption-line .en { font-family: var(--t-en); color: var(--t-bg); font-weight: 700; }

    .parent-ctrl { height: 68px; background: var(--t-surface); border-top: 1.5px solid var(--t-line); display: flex; align-items: center; padding: 0 14px; gap: 8px; }
    .pp-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--t-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .track-wrap { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .audio-bar { height: 4px; background: var(--t-line); border-radius: 2px; overflow: hidden; }
    .audio-fill { height: 100%; background: var(--t-bg); border-radius: 2px; }
    .audio-time { font-family: var(--t-en); font-size: 11px; color: var(--t-sub); display: flex; justify-content: space-between; }
    .ctrl-btns { display: flex; gap: 5px; }
    .ctrl-btn { font-family: var(--t-kr); font-size: 10px; color: var(--t-sub); background: var(--t-soft); border-radius: 8px; padding: 5px 9px; white-space: nowrap; }

    @keyframes sparkle-spin { 0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; } 50% { transform: scale(1.3) rotate(20deg); opacity: 0.8; } }
    @keyframes sparkle-spin2 { 0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.9; } 50% { transform: scale(1.25) rotate(-15deg); opacity: 0.7; } }
    .sp1 { animation: sparkle-spin 1.2s ease-in-out infinite; transform-origin: center; }
    .sp2 { animation: sparkle-spin2 1.4s ease-in-out 0.3s infinite; transform-origin: center; }
    .sp3 { animation: sparkle-spin 1.6s ease-in-out 0.6s infinite; transform-origin: center; }
    .sp4 { animation: sparkle-spin2 1.3s ease-in-out 0.9s infinite; transform-origin: center; }
  </style>
</head>
<body class="t-split">

  <!-- TOP BAR -->
  <div class="top-bar">
    <span class="ep-title">Brush, Brush, Brush!</span>
    <div class="progress-dots" aria-label="4/6 장면">
      <span class="dot done"></span>
      <span class="dot done"></span>
      <span class="dot done"></span>
      <span class="dot active" aria-label="4번"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <div class="skip-wrap">
      <span>그냥 듣기</span>
      <div class="track" role="switch" aria-checked="false" aria-label="그냥 듣기">
        <div class="thumb"></div>
      </div>
    </div>
  </div>

  <!-- STAGE -->
  <div class="stage" aria-label="반짝 장면, 이를 눌러서 반짝이게 해요">
    <svg width="390" height="636" viewBox="0 0 390 636" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">

      <!-- Background -->
      <rect width="390" height="636" style="fill: var(--t-bg)"/>

      <!-- Lily close-up - large face, centered -->
      <!-- Shirt (bottom) -->
      <path d="M50 636 q8 -120 56 -152 h178 q48 32 56 152 z" style="fill: var(--sky)"/>

      <!-- Neck -->
      <rect x="166" y="460" width="58" height="52" rx="12" style="fill: var(--skin)"/>

      <!-- Head (big, centered) -->
      <circle cx="195" cy="320" r="148" style="fill: var(--skin); stroke: var(--ink); stroke-width: 3"/>

      <!-- Hair top -->
      <path d="M50 304 q10 -148 145 -152 q135 4 145 152 q-72 -62 -145 -66 q-73 4 -145 66 z" style="fill: var(--hair)"/>

      <!-- Left pigtail -->
      <path d="M50 288 q-72 28 -56 118 q40 -24 48 -76" style="fill: var(--hair)"/>
      <circle cx="0" cy="400" r="22" style="fill: var(--sun); stroke: var(--ink); stroke-width: 2"/>

      <!-- Right pigtail -->
      <path d="M340 288 q72 28 56 118 q-40 -24 -48 -76" style="fill: var(--hair)"/>
      <circle cx="390" cy="400" r="22" style="fill: var(--sun); stroke: var(--ink); stroke-width: 2"/>

      <!-- Eyes (extra happy, crescents) -->
      <!-- Left eye -->
      <circle cx="152" cy="308" r="22" style="fill: var(--card)"/>
      <circle cx="156" cy="312" r="14" style="fill: var(--ink)"/>
      <circle cx="159" cy="308" r="5" style="fill: var(--card)"/>
      <!-- Right eye -->
      <circle cx="238" cy="308" r="22" style="fill: var(--card)"/>
      <circle cx="242" cy="312" r="14" style="fill: var(--ink)"/>
      <circle cx="245" cy="308" r="5" style="fill: var(--card)"/>

      <!-- Cheeks (big rosy) -->
      <ellipse cx="112" cy="348" rx="30" ry="18" style="fill: var(--cheek); fill-opacity: 0.7"/>
      <ellipse cx="278" cy="348" rx="30" ry="18" style="fill: var(--cheek); fill-opacity: 0.7"/>

      <!-- Wide open happy mouth -->
      <!-- Upper lip (cheek pink) -->
      <path d="M98 374 q97 -22 194 0 q-48 22 -97 24 q-49 -2 -97 -24 z" style="fill: var(--cheek); stroke: var(--ink); stroke-width: 2.5"/>
      <!-- Dark mouth cavity -->
      <ellipse cx="195" cy="432" rx="97" ry="60" style="fill: var(--ink)"/>
      <!-- Lower lip (cheek pink) -->
      <path d="M98 472 q97 34 194 0 q-48 -20 -97 -22 q-49 2 -97 22 z" style="fill: var(--cheek); stroke: var(--ink); stroke-width: 2.5"/>
      <!-- Pink tongue in lower mouth -->
      <ellipse cx="195" cy="462" rx="60" ry="26" style="fill: var(--cheek)"/>
      <!-- Teeth row along top of open mouth (inside cavity) -->
      <rect x="104" y="374" width="38" height="42" rx="7" style="fill: var(--card); stroke: var(--ink); stroke-width: 2"/>
      <rect x="146" y="372" width="42" height="44" rx="7" style="fill: var(--card); stroke: var(--ink); stroke-width: 2"/>
      <rect x="192" y="372" width="42" height="44" rx="7" style="fill: var(--card); stroke: var(--ink); stroke-width: 2"/>
      <rect x="238" y="374" width="38" height="42" rx="7" style="fill: var(--card); stroke: var(--ink); stroke-width: 2"/>
      <!-- Shine lines on teeth -->
      <line x1="120" y1="380" x2="126" y2="392" style="stroke: var(--sky); stroke-width: 2.5; stroke-opacity: 0.7"/>
      <line x1="162" y1="378" x2="168" y2="390" style="stroke: var(--sky); stroke-width: 2.5; stroke-opacity: 0.7"/>

      <!-- Large sparkle stars (yellow touch feedback) — static SVG, on blue background around face for max contrast -->
      <!-- Sparkle 1: upper-left blue zone -->
      <g transform="translate(56, 238)">
        <path d="M0 -32 L8 -8 L32 0 L8 8 L0 32 L-8 8 L-32 0 L-8 -8 Z" style="fill: var(--t-accent); stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round"/>
        <circle cx="0" cy="0" r="8" style="fill: var(--card)"/>
      </g>
      <!-- Sparkle 2: upper-right blue zone -->
      <g transform="translate(334, 238)">
        <path d="M0 -30 L7.5 -7.5 L30 0 L7.5 7.5 L0 30 L-7.5 7.5 L-30 0 L-7.5 -7.5 Z" style="fill: var(--t-accent); stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round"/>
        <circle cx="0" cy="0" r="7" style="fill: var(--card)"/>
      </g>
      <!-- Sparkle 3: lower-left blue zone -->
      <g transform="translate(58, 448)">
        <path d="M0 -28 L7 -7 L28 0 L7 7 L0 28 L-7 7 L-28 0 L-7 -7 Z" style="fill: var(--t-accent); stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round"/>
        <circle cx="0" cy="0" r="6.5" style="fill: var(--card)"/>
      </g>
      <!-- Sparkle 4: lower-right blue zone -->
      <g transform="translate(332, 448)">
        <path d="M0 -26 L6.5 -6.5 L26 0 L6.5 6.5 L0 26 L-6.5 6.5 L-26 0 L-6.5 -6.5 Z" style="fill: var(--t-accent); stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round"/>
        <circle cx="0" cy="0" r="6" style="fill: var(--card)"/>
      </g>

      <!-- "All clean!" above the head on blue background (solid white, high contrast) -->
      <text x="195" y="66" text-anchor="middle" style="font-family: var(--t-en); font-size: 58px; font-weight: 700; fill: var(--card);">All clean!</text>
      <text x="195" y="112" text-anchor="middle" style="font-family: var(--t-kr); font-size: 26px; fill: var(--card);">깨끗해!</text>
    </svg>
  </div>

  <!-- CAPTION STRIP -->
  <div class="caption-strip">
    <div class="caption-line"><span class="en">All clean!</span> 깨끗해! 활짝 웃어 봐!</div>
  </div>

  <!-- PARENT CONTROLS -->
  <div class="parent-ctrl" aria-label="재생 조작">
    <div class="pp-btn" aria-label="일시정지">
      <svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true">
        <rect x="1" y="1" width="4" height="16" rx="2" style="fill: var(--card)"/>
        <rect x="9" y="1" width="4" height="16" rx="2" style="fill: var(--card)"/>
      </svg>
    </div>
    <div class="track-wrap">
      <div class="audio-bar"><div class="audio-fill" style="width: 64%"></div></div>
      <div class="audio-time"><span>1:30</span><span>2:19</span></div>
    </div>
    <div class="ctrl-btns">
      <div class="ctrl-btn">3번 이어 듣기</div>
      <div class="ctrl-btn">조금 천천히</div>
    </div>
  </div>

</body>
</html>
