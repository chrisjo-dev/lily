<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390">
  <title>A06 잘 자 — Brush, Brush, Brush!</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    body { background:var(--t-bg); font-family:var(--t-body); color:var(--t-ink); width:390px; margin:0; height:844px; overflow:hidden; }
    .top-bar { height:36px; background:var(--t-bg); display:flex; align-items:center; padding:0 12px; gap:8px; }
    .top-title { font-family:var(--t-en); font-size:11px; font-weight:700; color:var(--t-ink); flex-shrink:0; letter-spacing:.02em; }
    .step-dots { display:flex; gap:5px; flex:1; justify-content:center; align-items:center; }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--t-surface); opacity:.28; }
    .dot.on { opacity:1; width:18px; border-radius:4px; }
    .listen-sw { display:flex; align-items:center; gap:4px; flex-shrink:0; }
    .sw-lbl { font-family:var(--t-kr); font-size:9px; color:var(--t-ink); opacity:.6; }
    .sw-track { width:28px; height:14px; background:var(--t-ink); border-radius:7px; opacity:.2; }
    .device { background:var(--t-surface); border-radius:24px 24px 26px 26px; border-bottom:9px solid var(--t-surface-2); margin:0 6px; padding:12px 10px 14px; }
    .screen { background:var(--t-screen); border-radius:16px; overflow:hidden; border:3px solid var(--t-surface-2); margin-bottom:10px; }
    @keyframes bezel-blink { 0%,100%{ border-color:var(--t-glow); } 50%{ border-color:var(--t-surface-2); } }
    .screen.waiting { border-color:var(--t-glow); animation:bezel-blink 1.8s ease-in-out infinite; }
    .stage { width:100%; height:480px; overflow:hidden; line-height:0; position:relative; }
    .stage svg { display:block; width:100%; height:480px; }
    .caption { background:var(--t-screen); padding:10px 14px 8px; }
    .cap-text { font-family:var(--t-kr); font-size:14px; color:var(--t-paper); line-height:1.55; text-align:center; margin:0; }
    .cap-text .en { font-family:var(--t-en); font-size:17px; font-weight:700; color:var(--t-glow); }
    .wait-bar { display:flex; align-items:center; justify-content:center; gap:8px; padding:5px 0 6px; }
    .wait-lbl { font-family:var(--t-kr); font-size:11px; color:var(--t-glow); }
    .timer-ring { width:22px; height:22px; flex-shrink:0; }
    .btns { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .btn-side { background:var(--t-paper); border:none; border-bottom:5px solid var(--t-surface-2); border-radius:14px; padding:9px 6px 7px; display:flex; flex-direction:column; align-items:center; gap:4px; width:78px; cursor:pointer; }
    .btn-lbl { font-family:var(--t-kr); font-size:10px; color:var(--t-ink); text-align:center; line-height:1.3; white-space:pre-line; }
    .btn-play { background:var(--t-soft); border:none; border-bottom:6px solid var(--t-surface-2); border-radius:40px; width:84px; height:78px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; }
    .btn-time { font-family:var(--t-en); font-size:14px; font-weight:700; color:var(--t-ink); }
    .btn-total { font-family:var(--t-en); font-size:9px; color:var(--t-ink); opacity:.5; }
    .bott-hint { text-align:center; padding:7px 0 4px; display:flex; flex-direction:column; align-items:center; gap:2px; }
    .bott-hint-txt { font-family:var(--t-kr); font-size:10px; color:var(--t-ink); opacity:.42; }
  </style>
</head>
<body class="t-toy">

  <div class="top-bar">
    <span class="top-title">Brush, Brush, Brush!</span>
    <div class="step-dots" aria-label="장면 6/6">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="dot"></span><span class="dot"></span><span class="dot on"></span>
    </div>
    <div class="listen-sw" aria-label="그냥 듣기 꺼짐">
      <span class="sw-lbl">그냥 듣기</span>
      <div class="sw-track"></div>
    </div>
  </div>

  <div class="device">
    <div class="screen waiting" aria-label="잘 자 장면, 램프 끄기 기다리는 중">

      <div class="stage">
        <svg viewBox="0 0 352 480" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round">
          <!-- ── BEDROOM (top zone, y 0-265) ── -->
          <rect width="352" height="266" style="fill:var(--t-screen)"/>
          <!-- floor strip -->
          <rect x="0" y="244" width="352" height="22" style="fill:var(--hair);opacity:.35"/>

          <!-- stars -->
          <g style="fill:var(--t-soft);stroke:none;opacity:.75">
            <circle cx="36" cy="24" r="2"/><circle cx="86" cy="14" r="1.5"/>
            <circle cx="155" cy="22" r="2"/><circle cx="200" cy="10" r="1.5"/>
            <circle cx="265" cy="26" r="2"/><circle cx="318" cy="14" r="2"/>
            <circle cx="308" cy="48" r="1.5"/><circle cx="58" cy="60" r="1.5"/>
          </g>

          <!-- window (left wall) -->
          <rect x="16" y="20" width="108" height="102" rx="10" style="fill:var(--t-screen);stroke:var(--dog);stroke-width:4"/>
          <line x1="70" y1="20" x2="70" y2="122" stroke-width="4" style="stroke:var(--dog)"/>
          <line x1="16" y1="71" x2="124" y2="71" stroke-width="4" style="stroke:var(--dog)"/>
          <!-- moon -->
          <circle cx="48" cy="52" r="22" style="fill:var(--sun);stroke:none"/>
          <circle cx="58" cy="46" r="18" style="fill:var(--t-screen);stroke:none"/>
          <!-- star near moon -->
          <path d="M88,30 l2,5 l5,0 l-4,3 l1.5,5 l-4.5,-3 l-4.5,3 l1.5,-5 l-4,-3 l5,0 z" style="fill:var(--t-soft);stroke:none"/>

          <!-- bed headboard -->
          <rect x="146" y="186" width="196" height="14" rx="7" style="fill:var(--hair)"/>
          <!-- bed body -->
          <rect x="150" y="200" width="190" height="60" rx="7" style="fill:var(--dog);opacity:.8"/>
          <!-- pillow -->
          <rect x="166" y="206" width="58" height="36" rx="10" style="fill:var(--t-paper);stroke:var(--dog);stroke-width:2"/>
          <!-- blanket -->
          <path d="M150,225 q95,20 190,0 l0,35 q-95,14-190,0 z" style="fill:var(--t-surface);opacity:.55"/>
          <!-- Lily sleeping -->
          <circle cx="192" cy="218" r="22" style="fill:var(--skin);stroke:var(--ink);stroke-width:2"/>
          <path d="M172,208 q4-24 20-24 q16,0 20,24 q-8-9-20-10 q-12,1-20,10 z" style="fill:var(--hair)"/>
          <circle cx="174" cy="203" r="3.5" style="fill:var(--sun);stroke:var(--ink);stroke-width:1.5"/>
          <circle cx="210" cy="203" r="3.5" style="fill:var(--sun);stroke:var(--ink);stroke-width:1.5"/>
          <path d="M184,217 q8,-5 8,0" style="fill:none;stroke:var(--ink);stroke-width:2"/>
          <path d="M196,217 q8,-5 8,0" style="fill:none;stroke:var(--ink);stroke-width:2"/>
          <ellipse cx="178" cy="226" rx="7" ry="4" style="fill:var(--cheek);opacity:.6"/>
          <ellipse cx="206" cy="226" rx="7" ry="4" style="fill:var(--cheek);opacity:.6"/>

          <!-- nightstand -->
          <rect x="298" y="218" width="48" height="32" rx="6" style="fill:var(--hair)"/>
          <!-- lamp base -->
          <rect x="314" y="192" width="14" height="28" rx="4" style="fill:var(--dog)"/>
          <!-- lamp shade -->
          <path d="M296,192 l-6,-46 l52,0 l-6,46 z" style="fill:var(--sun);stroke:var(--ink);stroke-width:2"/>
          <!-- lamp glow -->
          <circle cx="321" cy="158" r="30" style="fill:var(--sun);opacity:.20;stroke:none"/>
          <circle cx="321" cy="158" r="48" style="fill:var(--sun);opacity:.09;stroke:none"/>
          <circle cx="321" cy="178" r="8" style="fill:var(--sun);stroke:var(--ink);stroke-width:1.5"/>
          <!-- HINT RING -->
          <circle cx="321" cy="165" r="40" style="fill:none;stroke:var(--t-glow);stroke-width:3">
            <animate attributeName="r" values="36;48;36" dur="1.8s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/>
          </circle>
          <!-- tap label -->
          <rect x="280" y="112" width="72" height="22" rx="8" style="fill:var(--t-glow)"/>
          <text x="316" y="127" text-anchor="middle" style="font-family:var(--t-kr);font-size:11px;fill:var(--t-screen)">불 꺼요!</text>

          <!-- 5s timer arc -->
          <circle cx="176" cy="18" r="11" style="fill:none;stroke:var(--t-soft);stroke-width:3;opacity:.4"/>
          <circle cx="176" cy="18" r="11" style="fill:none;stroke:var(--t-glow);stroke-width:3;stroke-dasharray:28 41;transform:rotate(-90deg);transform-origin:176px 18px"/>

          <!-- ── END CARD (bottom zone, y 270-480) ── -->
          <rect x="0" y="268" width="352" height="212" rx="0" style="fill:var(--t-screen)"/>
          <!-- top border accent -->
          <rect x="0" y="268" width="352" height="3" style="fill:var(--t-glow)"/>

          <!-- "오늘의 단어" label -->
          <text x="176" y="290" text-anchor="middle" style="font-family:var(--t-kr);font-size:11px;fill:var(--t-glow);opacity:.85">오늘의 단어</text>

          <!-- 3 earned sticker slots -->
          <rect x="10" y="298" width="100" height="68" rx="12" style="fill:var(--sun);stroke:var(--ink);stroke-width:1.5"/>
          <image href="../assets/word-brush.svg" x="16" y="302" width="88" height="60"/>
          <rect x="126" y="298" width="100" height="68" rx="12" style="fill:var(--t-glow);stroke:var(--ink);stroke-width:1.5"/>
          <image href="../assets/word-bubbles.svg" x="132" y="302" width="88" height="60"/>
          <rect x="242" y="298" width="100" height="68" rx="12" style="fill:var(--sun);stroke:var(--ink);stroke-width:1.5"/>
          <image href="../assets/word-clean.svg" x="248" y="302" width="88" height="60"/>

          <!-- Action buttons — full text, clearly visible -->
          <!-- "한 번 더 듣기" -->
          <rect x="10" y="380" width="156" height="46" rx="14" style="fill:var(--t-paper)"/>
          <rect x="10" y="386" width="156" height="46" rx="14" style="fill:var(--t-paper);opacity:.0"/>
          <!-- pressed-edge shadow -->
          <rect x="10" y="420" width="156" height="6" rx="3" style="fill:var(--t-soft);opacity:.5"/>
          <text x="88" y="408" text-anchor="middle" style="font-family:var(--t-kr);font-size:13px;fill:var(--t-ink)">한 번 더 듣기</text>
          <!-- "부모님 화면" -->
          <rect x="182" y="380" width="156" height="46" rx="14" style="fill:var(--t-surface)"/>
          <rect x="182" y="420" width="156" height="6" rx="3" style="fill:var(--t-surface-2);opacity:.7"/>
          <text x="260" y="408" text-anchor="middle" style="font-family:var(--t-kr);font-size:13px;fill:var(--t-paper)">부모님 화면</text>

          <!-- "Brush my teeth! Bye-bye!" small line -->
          <text x="176" y="448" text-anchor="middle" style="font-family:var(--t-en);font-size:13px;font-weight:700;fill:var(--t-glow);opacity:.75">Brush my teeth! Bye-bye!</text>
        </svg>
      </div>

      <div class="caption">
        <p class="cap-text"><span class="en">Good night, friend!</span><br>오늘 밤 이 닦을 때 말해 봐.</p>
        <div class="wait-bar">
          <span class="wait-lbl">릴리가 기다려요</span>
          <svg class="timer-ring" viewBox="0 0 22 22" aria-hidden="true">
            <circle cx="11" cy="11" r="8" style="fill:none;stroke:var(--t-screen);stroke-width:3"/>
            <circle cx="11" cy="11" r="8" style="fill:none;stroke:var(--t-glow);stroke-width:3;stroke-dasharray:20 30;transform:rotate(-90deg);transform-origin:11px 11px"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="btns">
      <button class="btn-side" aria-label="3번 이어 듣기">
        <svg width="28" height="22" viewBox="0 0 28 22" aria-hidden="true">
          <path d="M20 3 L25 8 L20 13" stroke-width="2.5" style="fill:none;stroke:var(--t-ink)"/>
          <path d="M4 17 C4 9 10 4 18 6" stroke-width="2.5" style="fill:none;stroke:var(--t-ink)"/>
          <text x="3" y="22" font-size="9" font-weight="700" style="fill:var(--t-ink);font-family:var(--t-en)">x3</text>
        </svg>
        <span class="btn-lbl">3번&#10;이어 듣기</span>
      </button>

      <button class="btn-play" aria-label="재생, 현재 2분 12초">
        <span class="btn-time">2:12</span>
        <span class="btn-total">/ 2:19</span>
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <polygon points="5,3 17,10 5,17" style="fill:var(--t-ink)"/>
        </svg>
      </button>

      <button class="btn-side" aria-label="조금 천천히">
        <svg width="28" height="22" viewBox="0 0 28 22" aria-hidden="true">
          <ellipse cx="14" cy="11" rx="8" ry="6" style="fill:none;stroke:var(--t-ink);stroke-width:2.5"/>
          <line x1="6" y1="11" x2="2" y2="11" stroke-width="2.5" style="stroke:var(--t-ink)"/>
          <line x1="22" y1="11" x2="26" y2="11" stroke-width="2.5" style="stroke:var(--t-ink)"/>
        </svg>
        <span class="btn-lbl">조금&#10;천천히</span>
      </button>
    </div>
  </div>

  <div class="bott-hint" aria-label="부모님 화면 안내">
    <span class="bott-hint-txt">아래로 내리면 부모님 화면</span>
    <svg width="14" height="8" viewBox="0 0 14 8" aria-hidden="true">
      <path d="M2 2 L7 6 L12 2" stroke-width="2" style="fill:none;stroke:var(--t-ink);opacity:.35"/>
    </svg>
  </div>

</body>
</html>
