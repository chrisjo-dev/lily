<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390">
  <title>Brush, Brush, Brush! — 칫솔 찾기</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    body {
      background: var(--t-bg);
      color: var(--t-ink);
      font-family: var(--t-body);
      width: 390px;
      margin: 0 auto;
      overflow-x: hidden;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 52px;
      background: var(--t-surface);
      border-bottom: 1.5px solid var(--t-line);
    }
    .top-title { font-family: var(--t-en); font-size: 11px; color: var(--t-sub); letter-spacing: 0.03em; }
    .prog-dots { display: flex; align-items: center; gap: 5px; }
    .pdot { width: 8px; height: 8px; border-radius: 50%; background: var(--t-soft); }
    .pdot.now { width: 22px; border-radius: 4px; background: var(--t-accent); }
    .listen-sw { display: flex; align-items: center; gap: 5px; font-family: var(--t-kr); font-size: 10px; color: var(--t-sub); }
    .sw-track { width: 28px; height: 16px; background: var(--t-soft); border-radius: 8px; position: relative; }
    .sw-thumb { position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; background: var(--t-surface-2); border-radius: 50%; }
    .stage { width: 390px; height: 580px; position: relative; overflow: hidden; display: block; }
    .caption-strip {
      background: var(--t-surface);
      padding: 12px 24px 10px;
      border-top: 1.5px solid var(--t-line);
      border-bottom: 1.5px solid var(--t-line);
    }
    .wait-tag {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--t-soft); border-radius: 99px;
      padding: 3px 11px;
      font-family: var(--t-kr); font-size: 11px; color: var(--t-accent);
      margin-bottom: 7px;
    }
    .wait-dot { width: 6px; height: 6px; background: var(--t-accent); border-radius: 50%; animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }
    .caption-text { font-family: var(--t-kr); font-size: 19px; line-height: 1.55; color: var(--t-ink); margin: 0; text-align: center; word-break: keep-all; }
    .en { font-family: var(--t-en); font-size: 21px; color: var(--t-accent); font-weight: 700; }
    .controls { background: var(--t-bg); padding: 11px 18px 10px; }
    .ctrl-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .play-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--t-soft); border: none; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; }
    .prog-wrap { flex: 1; }
    .prog-track { height: 4px; background: var(--t-soft); border-radius: 2px; margin-bottom: 4px; }
    .prog-fill { width: 22%; height: 100%; background: var(--t-accent); border-radius: 2px; }
    .time-row { display: flex; justify-content: space-between; font-family: var(--t-en); font-size: 11px; color: var(--t-sub); }
    .ctrl-btns { display: flex; gap: 7px; }
    .ctrl-btn { flex: 1; border: 1.5px solid var(--t-line); background: var(--t-surface); border-radius: 10px; padding: 8px 6px; font-family: var(--t-kr); font-size: 11px; color: var(--t-sub); text-align: center; cursor: pointer; }
    .parent-hint { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 7px 16px 8px; background: var(--t-bg); font-family: var(--t-kr); font-size: 10px; color: var(--t-sub); opacity: 0.55; }
    .ring-drain { animation: drain5 5s linear; transform-origin: 353px 44px; }
    @keyframes drain5 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 113; } }
    .hint-ring { animation: hpulse 2.2s ease-in-out infinite; }
    @keyframes hpulse { 0%,100%{ opacity: 0.6; } 50%{ opacity: 0.18; } }
  </style>
</head>
<body class="t-night">

  <header class="top-bar">
    <span class="top-title">Brush, Brush, Brush!</span>
    <div class="prog-dots" aria-label="진행 1/6">
      <span class="pdot now"></span>
      <span class="pdot"></span><span class="pdot"></span>
      <span class="pdot"></span><span class="pdot"></span><span class="pdot"></span>
    </div>
    <div class="listen-sw">
      <span>그냥 듣기</span>
      <span class="sw-track"><span class="sw-thumb"></span></span>
    </div>
  </header>

  <div class="stage" role="img" aria-label="욕실 장면. 비스킷이 칫솔을 입에 물고 있어요.">
    <svg width="390" height="580" viewBox="0 0 390 580" xmlns="http://www.w3.org/2000/svg">

      <!-- 어두운 욕실 벽 -->
      <rect width="390" height="580" style="fill:var(--t-surface)"/>

      <!-- 바닥 -->
      <rect x="0" y="470" width="390" height="110" style="fill:var(--t-surface-2)"/>
      <line x1="0" y1="470" x2="390" y2="470" style="stroke:var(--t-line); stroke-width:1.5"/>

      <!-- 타일 그리드 -->
      <line x1="0" y1="130" x2="390" y2="130" style="stroke:var(--t-line); stroke-width:0.5; opacity:0.3"/>
      <line x1="0" y1="260" x2="390" y2="260" style="stroke:var(--t-line); stroke-width:0.5; opacity:0.3"/>
      <line x1="0" y1="390" x2="390" y2="390" style="stroke:var(--t-line); stroke-width:0.5; opacity:0.3"/>
      <line x1="97" y1="0" x2="97" y2="470" style="stroke:var(--t-line); stroke-width:0.5; opacity:0.3"/>
      <line x1="195" y1="0" x2="195" y2="470" style="stroke:var(--t-line); stroke-width:0.5; opacity:0.3"/>
      <line x1="292" y1="0" x2="292" y2="470" style="stroke:var(--t-line); stroke-width:0.5; opacity:0.3"/>

      <!-- 별 -->
      <circle cx="44" cy="32" r="1.2" style="fill:var(--t-moon)" opacity="0.45"/>
      <circle cx="166" cy="18" r="1" style="fill:var(--t-moon)" opacity="0.35"/>
      <circle cx="345" cy="95" r="0.9" style="fill:var(--t-moon)" opacity="0.28"/>

      <!-- 거울 (오른쪽 위) -->
      <rect x="250" y="28" width="122" height="100" rx="10" style="fill:var(--t-soft); stroke:var(--t-line); stroke-width:1.5"/>
      <rect x="258" y="36" width="106" height="84" rx="8" style="fill:var(--t-surface-2)"/>
      <line x1="270" y1="54" x2="300" y2="46" style="stroke:var(--t-line); stroke-width:1; opacity:0.5"/>
      <line x1="270" y1="70" x2="316" y2="58" style="stroke:var(--t-line); stroke-width:1; opacity:0.5"/>

      <!-- 선반 -->
      <rect x="0" y="438" width="390" height="36" style="fill:var(--t-soft)"/>
      <!-- 세면대 -->
      <ellipse cx="195" cy="452" rx="76" ry="22" style="fill:var(--t-surface); stroke:var(--t-line); stroke-width:1.5"/>
      <!-- 수도꼭지 -->
      <rect x="183" y="428" width="24" height="13" rx="5" style="fill:var(--t-sub); opacity:0.5"/>
      <!-- 치약 왼쪽 -->
      <rect x="28" y="426" width="52" height="14" rx="7" style="fill:var(--t-accent); opacity:0.45"/>
      <circle cx="28" cy="433" r="7" style="fill:var(--t-soft)"/>
      <!-- 컵 오른쪽 -->
      <rect x="298" y="408" width="32" height="36" rx="5" style="fill:var(--t-soft)"/>

      <!-- 무드등 글로우 (바닥 오른쪽) -->
      <ellipse cx="355" cy="540" rx="65" ry="38" style="fill:var(--t-accent)" opacity="0.06"/>

      <!-- ===== 비스킷 (tan 강아지 — 처진 긴 귀 + 주둥이) ===== -->
      <!-- 몸통 (넓고 낮게) -->
      <ellipse cx="200" cy="350" rx="72" ry="44" style="fill:var(--dog)"/>
      <ellipse cx="200" cy="350" rx="72" ry="44" style="fill:none; stroke:var(--ink); stroke-width:2"/>
      <!-- 뒷다리 -->
      <ellipse cx="150" cy="390" rx="22" ry="13" style="fill:var(--dog); stroke:var(--ink); stroke-width:1.5"/>
      <ellipse cx="250" cy="390" rx="22" ry="13" style="fill:var(--dog); stroke:var(--ink); stroke-width:1.5"/>
      <!-- 꼬리 -->
      <path d="M 268 320 q 50 -26 44 -66" style="fill:none; stroke:var(--dog); stroke-width:14; stroke-linecap:round"/>
      <path d="M 268 320 q 50 -26 44 -66" style="fill:none; stroke:var(--ink); stroke-width:2; stroke-linecap:round"/>
      <!-- 긴 처진 귀 (lily-scene.svg 참조 형태) -->
      <path d="M158 228 q-42 12 -34 74 q22 -6 32 -34" style="fill:var(--hair)"/>
      <path d="M242 228 q42 12 34 74 q-22 -6 -32 -34" style="fill:var(--hair)"/>
      <!-- 머리 -->
      <circle cx="200" cy="256" r="64" style="fill:var(--dog); stroke:var(--ink); stroke-width:2"/>
      <!-- 주둥이/스너트 (개답게 돌출) -->
      <ellipse cx="208" cy="278" rx="28" ry="19" style="fill:var(--dog)"/>
      <ellipse cx="208" cy="278" rx="28" ry="19" style="fill:none; stroke:var(--ink); stroke-width:1.5"/>
      <!-- 눈 -->
      <circle cx="181" cy="244" r="8" style="fill:var(--ink)"/>
      <circle cx="184" cy="241" r="2.8" style="fill:var(--t-moon)"/>
      <circle cx="219" cy="244" r="8" style="fill:var(--ink)"/>
      <circle cx="222" cy="241" r="2.8" style="fill:var(--t-moon)"/>
      <!-- 코 -->
      <ellipse cx="208" cy="270" rx="9" ry="6" style="fill:var(--ink)"/>
      <!-- 뺨 -->
      <ellipse cx="172" cy="270" rx="11" ry="7" style="fill:var(--cheek)" opacity="0.4"/>
      <ellipse cx="232" cy="270" rx="11" ry="7" style="fill:var(--cheek)" opacity="0.4"/>
      <!-- 칫솔 (입에 물고 있는 것 — 찾을 것!) -->
      <rect x="207" y="271" width="78" height="13" rx="6" style="fill:var(--sun)"/>
      <!-- 칫솔 머리 -->
      <rect x="278" y="263" width="26" height="22" rx="4" style="fill:var(--t-moon); stroke:var(--t-line); stroke-width:1"/>
      <!-- 칫솔모 -->
      <rect x="281" y="259" width="4" height="8" rx="2" style="fill:var(--t-sub)"/>
      <rect x="288" y="259" width="4" height="8" rx="2" style="fill:var(--t-sub)"/>
      <rect x="295" y="259" width="4" height="8" rx="2" style="fill:var(--t-sub)"/>

      <!-- 호박색 힌트 글로우 링 (칫솔 중심) -->
      <circle cx="274" cy="268" r="62" class="hint-ring"
        style="fill:none; stroke:var(--t-accent); stroke-width:3"/>
      <circle cx="274" cy="268" r="78" style="fill:none; stroke:var(--t-accent); stroke-width:1; opacity:0.25"/>
      <circle cx="274" cy="268" r="92" style="fill:none; stroke:var(--t-accent); stroke-width:1; opacity:0.10"/>

      <!-- 5초 링 (오른쪽 위) -->
      <circle cx="353" cy="44" r="22" style="fill:var(--t-surface-2)"/>
      <circle cx="353" cy="44" r="18" style="fill:none; stroke:var(--t-line); stroke-width:2"/>
      <circle cx="353" cy="44" r="18" class="ring-drain"
        style="fill:none; stroke:var(--t-accent); stroke-width:2.5;
               stroke-dasharray:113; stroke-linecap:round;
               transform:rotate(-90deg); transform-origin:353px 44px"/>
      <text x="353" y="49" style="font-family:var(--t-en); font-size:11px; fill:var(--t-sub); text-anchor:middle">5</text>

      <!-- 학습지 1번 태그 -->
      <rect x="12" y="14" width="82" height="26" rx="13" style="fill:var(--t-soft)"/>
      <text x="53" y="31" style="font-family:var(--t-kr); font-size:11px; fill:var(--t-accent); text-anchor:middle">학습지 1번</text>

    </svg>
  </div>

  <div class="caption-strip">
    <div class="wait-tag">
      <span class="wait-dot"></span>
      릴리가 기다려요
    </div>
    <p class="caption-text">칫솔이 어디 있지? 그림에서 칫솔을 찾아봐!</p>
  </div>

  <div class="controls">
    <div class="ctrl-top">
      <button class="play-btn" aria-label="일시정지">
        <svg width="16" height="16" viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12" rx="1.2" style="fill:var(--t-sub)"/><rect x="9.5" y="2" width="3.5" height="12" rx="1.2" style="fill:var(--t-sub)"/></svg>
      </button>
      <div class="prog-wrap">
        <div class="prog-track"><div class="prog-fill"></div></div>
        <div class="time-row"><span>0:31</span><span>2:19</span></div>
      </div>
    </div>
    <div class="ctrl-btns">
      <button class="ctrl-btn">3번 이어 듣기</button>
      <button class="ctrl-btn">조금 천천히</button>
    </div>
  </div>

  <div class="parent-hint">
    <span>아래로 내리면 부모님 화면</span>
    <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 4 l4 4 l4 -4" style="fill:none; stroke:var(--t-sub); stroke-width:1.5; stroke-linecap:round"/></svg>
  </div>

</body>
</html>
