<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P01 A 끼어드는 순간 피드</title>
<link rel="stylesheet" href="../shared/tokens.css">
</head>
<body>
<style>
.a { background: var(--sky); }
.a .pic { position: absolute; left: 70px; right: 70px; top: 300px; height: 760px; border-radius: 40px; overflow: hidden; border: 10px solid var(--white); }
.a .pic img.scene { width: 100%; height: 100%; object-fit: cover; object-position: center 40%; }
.a h1 { position: absolute; left: 80px; right: 80px; top: 70px; margin: 0; font-family: var(--font-head); font-weight: 400; font-size: 92px; line-height: 1.12; color: var(--ink); }
.a h1 em { font-style: normal; color: var(--white); background: var(--sky-deep); padding: 0 16px; border-radius: 18px; }
.a .foot { position: absolute; left: 80px; right: 80px; bottom: 70px; display: flex; align-items: center; justify-content: space-between; }
.a .meta { font-size: 34px; font-weight: 700; color: var(--ink); line-height: 1.35; }
</style>
<div class="ad feed a">
  <h1>아이가 <em>톡!</em> 눌러야<br>이야기가 이어져요</h1>
  <div class="pic"><img class="scene" src="../assets/cap-tb-wait0-find.webp" alt="손 그림이 칫솔을 가리키는 실제 장면"></div>
  <div class="foot"><div class="meta">4~7세 2분 영어 그림책<br>릴리랑</div><span class="cta">무료로 듣기</span></div>
</div>
