<html lang="ko">
<head>

<title>P03 B 양치 전 2분 피드</title>

<style>
.b { background: var(--cream); }

<div class="ad feed b">
  <div class="pic"><img src="../assets/bg-3-bubbles.webp" alt="거품 속에서 웃는 릴리"></div>
  <div class="txt">
    <h1>양치하기<br>싫다는<br>아이에게</h1>

  </div>
  <div class="foot"><img class="logo" src="../assets/logo-h.svg" alt="릴리랑"><span class="cta">무료로 듣기</span></div>
</div>
