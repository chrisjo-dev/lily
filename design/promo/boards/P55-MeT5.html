<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P55 내 정보 T5</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/landing-t4.css">
<link rel="stylesheet" href="../shared/pages-t5.css">
</head>
<body>
  <header class="topband">
    <div class="bar"><a class="brand" href="#home"><img src="../assets/emblem.png" alt=""><span>릴리랑</span></a><a class="me" href="#me">내 정보</a></div>
    <div class="title"><h1>내 정보</h1></div>
    <svg class="edge" viewBox="0 0 1440 44" preserveAspectRatio="none" aria-hidden="true"><path d="M0 44V24c160-20 320-24 480-10s320 24 480 14 320-24 480-16v32z" fill="#fefefd"/></svg>
  </header>
  <main class="page narrow">
    <section class="form">
      <h2>프로필</h2>
      <label class="field">닉네임 (20자까지)<span class="box">하린이 엄마</span></label>
      <div class="field">아이 나이대 (선택)<div class="seg"><span>4~5세</span><span class="on">6~7세</span><span>선택 안 함</span></div></div>
      <p class="check"><i class="on"></i><span>[선택] 새 편 소식과 안내를 받을게요</span></p>
      <a class="solid" href="#save">저장하기</a>
    </section>
    <section class="block">
      <h2>끝까지 들은 편</h2>
      <div class="donelist">
        <a class="circle" href="#ep01"><div class="dot"><img src="../assets/t2-ep-brush.webp" alt=""></div><b>이 닦기</b></a>
        <a class="circle" href="#ep02"><div class="dot"><img src="../assets/t2-ep-wake.webp" alt=""></div><b>일어나기</b></a>
      </div>
      <p class="lead">아직 들은 편이 없으면 "아직 끝까지 들은 편이 없어요."라고 보여요.</p>
    </section>
    <section class="form block">
      <h2>계정</h2>
      <a class="ghost" href="#logout">로그아웃</a>
      <p><a class="danger" href="#leave">탈퇴하기</a></p>
      <div class="confirm">탈퇴하면 계정과 들은 기록이 바로 지워지고 되돌릴 수 없어요.<div class="row"><span class="del">탈퇴할게요</span><span class="keep">그만둘게요</span></div></div>
    </section>
  </main>
  <footer class="foot2"><a href="#privacy">개인정보처리방침</a><small>매일 외국어 읽기가 만들어요</small></footer>
</body>
</html>
