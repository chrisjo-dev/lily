<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P105 부모님 확인 휴대폰</title>
<link rel="stylesheet" href="../shared/presignup.css">
</head>
<body>
  <div class="end">
    <div class="body">
      <div class="frame"><img src="../assets/pre-ep01-intro.webp" alt=""></div>
      <div class="head"><p class="epn">EP01</p><p class="etitle">Brush, Brush, Brush!</p><p class="emsg">오늘 이야기를 다 들었어요.</p></div>
      <p class="ribbon">오늘 모은 스티커</p>
      <div class="stk">
        <span><i class="spot"><img src="../assets/L-sticker-brush.webp" alt=""></i>brush my teeth</span>
        <span><i class="spot"><img src="../assets/L-sticker-bubbles.webp" alt=""></i>bubbles</span>
        <span><i class="spot"><img src="../assets/L-sticker-clean.webp" alt=""></i>all clean</span>
      </div>
      <button class="again" type="button">한 번 더</button>
      <button class="toparent" type="button">부모님께</button>
    </div>
    <div class="pstrip">
      <p class="tip">실제 양치 시간에 한 번만. "Brush my teeth!" 하고 말해 주면 소리와 상황이 이어져 더 오래 기억해요.</p>
      <button class="pre" type="button" aria-label="부모님께, 창립 회원 사전 신청 보기">
        <span class="who">부모님께</span>
        <span class="what"><b>창립 회원 사전 신청</b><small>결제 없이 관심만 남겨요</small></span><i class="chev"></i></button>
    </div>
    <div class="hintrow"><i></i>부모 화면 열기</div>
    <div class="shade"></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="g-t">
      <i class="grab"></i>
      <div class="top"><p class="kicker">부모님 확인</p><button class="x" type="button">닫기</button></div>
      <h2 id="g-t">어른만 넘어갈 수 있어요</h2>
      <p class="lead">아이가 모르고 누르지 않게 한 번만 확인할게요.</p>
      <p class="ask">아래 숫자를 차례로 눌러 주세요.<br><b>칠, 이, 오</b></p>
      <div class="slots" aria-label="세 개 중 한 개 누름"><i class="on"></i><i></i><i></i></div>
      <div class="keys">
        <button type="button">1</button><button type="button">2</button><button type="button">3</button>
        <button type="button">4</button><button type="button">5</button><button type="button">6</button>
        <button class="hit" type="button">7</button><button type="button">8</button><button type="button">9</button>
      </div>
      <p class="small">숫자는 열 때마다 바뀌어요.</p>
    </section>
  </div>
</body>
</html>
