<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P55 내 정보</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/landing-t4.css">
<link rel="stylesheet" href="../shared/landing-t5.css">
<link rel="stylesheet" href="../shared/pages-join.css">
</head>
<body>
<header class="top"><div class="bar"><img src="../assets/emblem.png" alt=""><span>릴리랑</span></div></header>
<svg class="edge" viewBox="0 0 1440 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0h1440v14c-160 24-320 28-480 14S640 0 480 10 160 34 0 22z" fill="#1b2a44"/></svg>
<main class="page">
  <h1>내 정보</h1>
  <p class="who">wonsang@example.com 로 로그인했어요.</p>
  <div class="part">
    <label class="field">닉네임 (20자까지)<span class="input">릴리네 아빠</span></label>
    <p class="field">아이 나이대 (선택)</p>
    <p class="seg"><span>4~5세</span><span class="on">6~7세</span><span>선택 안 함</span></p>
    <p class="check part"><i class="box on"></i><span><b>[선택]</b> 새 편 소식과 안내를 받을게요</span></p>
    <p class="part"><a class="act main" href="#save">저장하기</a></p>
    <p class="msg ok">저장했어요.</p>
  </div>
  <div class="part">
    <h2>끝까지 들은 편</h2>
    <ul class="done">
      <li><img src="../assets/t2-ep-brush.webp" alt=""><span><b>이 닦기</b><small>Brush, Brush!</small></span><time>10월 28일</time></li>
      <li><img src="../assets/t2-ep-wake.webp" alt=""><span><b>일어나기</b><small>Wake Up!</small></span><time>10월 29일</time></li>
    </ul>
  </div>
  <div class="part">
    <a class="act line" href="#logout">로그아웃</a>
    <a class="act quiet" href="#leave">탈퇴하기</a>
  </div>
</main>
<footer class="foot2"><a href="#privacy">개인정보처리방침</a></footer>
</body>
</html>
