<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P47 첫 화면 하늘 시안 2</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/landing-t4.css">
<style>
  /* 첫 화면만: 밤 대신 밝은 크레파스 하늘(진한 크레파스 낮 하늘). 그림 한 장이 첫 화면 전체를 채우고 왼쪽 하늘 위에 글 */
  body { width: 1440px; margin: 0; }
  .sky { position: relative; height: 820px; background: url(../assets/sky-2.webp) center / cover no-repeat; }
  .sky .bar { position: absolute; left: 0; top: 0; padding: 26px 64px; }
  .sky .bar span { color: #ffffff; }
  .sky .copy { position: absolute; left: 64px; top: 190px; width: 560px; }
  .sky h1 { font-size: 70px; line-height: 1.1; color: #ffffff; }
  .sky h1 b { font-weight: 400; color: #ffc531; }
  .sky .sub { font-size: 23px; line-height: 1.5; margin: 22px 0 36px; color: #e8f1ff; }
  .sky .note { font-size: 16px; color: #e8f1ff; margin: 14px 0 0 30px; }
  .sky .btn { font-size: 29px; padding: 20px 42px; }
  .edge { display: block; width: 100%; height: 56px; margin-top: -55px; position: relative; }
  .next { text-align: center; padding: 40px 0 60px; }
</style>
</head>
<body>
  <header class="sky">
    <div class="bar"><img src="../assets/emblem.png" alt=""><span>릴리랑</span></div>
    <div class="copy">
      <h1>아이가 <b>톡!</b> 눌러야<br>이야기가 이어져요</h1>
      <p class="sub">하루 습관마다 2분, 4~7세 아이와 부모가 함께 듣는 영어 그림책</p>
      <a class="btn" href="#play">무료로 2분 들어보기</a>
      <p class="note">로그인 없이 바로 시작해요</p>
    </div>
  </header>
  <svg class="edge" viewBox="0 0 1440 56" preserveAspectRatio="none" aria-hidden="true"><path d="M0 56V30c160-22 320-26 480-12s320 30 480 18 320-30 480-22v42z" fill="#fefefd"/></svg>
  <section class="next"><h2 class="sec-title">하루 습관마다 한 편씩</h2></section>
</body>
</html>
