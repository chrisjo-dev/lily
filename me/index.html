<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js; connect-src 'self' https://supabase-project-ref.invalid; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex, nofollow">
<title>내 정보 | 릴리랑</title>
<link rel="icon" href="/brand/favicon.ico" sizes="any"><link rel="icon" href="/brand/favicon-32.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="fonts" media="print" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/common/shell.css">
<link rel="stylesheet" href="/common/forms.css">
</head>
<body class="t8 t8-me">
<header class="lamp short noart t8">
  <div class="bar"><a class="brand" href="/"><img src="/hello/img/emblem.webp" width="288" height="221" alt=""><span>릴리랑</span></a></div>
  <div class="inner"><div class="head"><h1>내 정보</h1></div></div>
  <svg class="edge" viewBox="0 0 1440 56" preserveAspectRatio="none" aria-hidden="true"><path d="M0 56V30c160-22 320-26 480-12s320 30 480 18 320-30 480-22v42z" fill="#fefefd"/></svg>
</header>
<main class="page wide">
  <p class="msg info" id="notReady" hidden>가입은 아직 준비 중이에요. 그동안 <a href="/ep01/">맛보기 편</a>을 끝까지 들어 보세요.</p>
  <div id="signedOut" hidden>
    <p class="lead">로그인하면 들은 이야기와 내 정보를 볼 수 있어요.</p>
    <p class="part"><a class="act main" href="/join/?next=%2Fme%2F">로그인하기</a></p>
  </div>
  <p class="lead" id="loading">불러오고 있어요.</p>

  <div id="signedIn" hidden>
    <div>
    <p class="who" id="who"></p>
    <div class="part">
      <form id="profile" novalidate>
        <label class="field">닉네임 (20자까지)<input class="input" type="text" id="nickname" maxlength="20" autocomplete="nickname"></label>
        <fieldset>
          <legend class="field">아이 나이대 (선택)</legend>
          <div class="seg">
            <label><input type="radio" name="age" value="4-5"><span>4~5세</span></label>
            <label><input type="radio" name="age" value="6-7"><span>6~7세</span></label>
            <label><input type="radio" name="age" value=""><span>선택 안 함</span></label>
          </div>
        </fieldset>
        <div class="part"><label class="check"><input type="checkbox" id="marketing"><i class="box" aria-hidden="true"></i><span><b>[선택]</b> 새 이야기 소식과 안내를 받을게요</span></label></div>
        <p class="part"><button class="act main" type="submit" id="save">저장하기</button></p>
      </form>
      <p class="msg ok" id="saveMsg" role="status" aria-live="polite" hidden></p>
    </div>
    </div>

    <div>
    <section class="part" aria-labelledby="epsTitle">
      <h2 id="epsTitle">끝까지 들은 이야기</h2>
      <ul class="done" id="eps"></ul>
      <p class="who" id="epsEmpty" hidden>아직 끝까지 들은 이야기가 없어요.</p>
    </section>

    <section class="part" aria-label="계정">
      <button class="act line" type="button" id="logout">로그아웃</button>
      <button class="act quiet" type="button" id="leave">탈퇴하기</button>
      <div id="confirm" hidden>
        <p class="msg err">탈퇴하면 계정과 들은 기록이 바로 지워지고 되돌릴 수 없어요.</p>
        <p class="part"><button class="act danger" type="button" id="leaveYes">탈퇴할게요</button></p>
        <button class="act quiet" type="button" id="leaveNo">그만둘게요</button>
      </div>
      <p class="msg ok" id="acctMsg" role="status" aria-live="polite" hidden></p>
    </section>
    </div>
  </div>
</main>
<footer class="foot2"><a href="/privacy/">개인정보처리방침</a></footer>
<script src="/src/shared/lib/fonts.js"></script>
<script src="/src/shared/config/lily-config.js"></script>
<script src="/src/shared/api/supabase.js"></script>
<script src="/src/entities/session/session.js"></script>
<script src="/src/entities/episode/catalog.js"></script>
<script src="/me/me.js"></script>
</body>
</html>
